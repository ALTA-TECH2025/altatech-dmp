    IdentityGraph:
      type: object
      properties:
        nodes: { type: array, items: { type: object, properties: { id: { type: string, description: 'type:遮罩值' }, type: { type: string }, value: { type: string, description: 依角色遮罩 } } } }
        edges: { type: array, items: { type: object, properties: { a: { type: string }, b: { type: string }, source: { type: string }, evidence_event_id: { type: string }, first_seen: { type: string }, last_seen: { type: string }, seen_count: { type: integer }, confidence: { type: number }, status: { type: string } } } }
        masked: { type: object, additionalProperties: { type: string } }
    SegmentCreate:
      type: object
