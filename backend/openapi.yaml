    post: { tags: [Meta], summary: '立即執行其來源同步任務（審計 dimension.sync）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/meta/dictionaries:
    get: { tags: [Meta], summary: '維度字典清單（屬性 → 值／顯示名映射，1:1 或 N:1）', responses: { '200': { description: ok } } }
