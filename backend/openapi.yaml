  /v1/integration/tables:
    get: { tags: [Integration], summary: '數據表管理：已登記的外部表（數據源、表、主鍵、增量欄位、欄位數、Schema 版本、變更、使用它的任務）', responses: { '200': { description: ok } } }
    post: { tags: [Integration], summary: '從數據源探索並登記表（讀 schema 與樣本；個資欄位標 L4 不可選；設主鍵與增量欄位）', responses: { '201': { description: created } } }
  /v1/integration/tables/{id}/rescan:
    post: { tags: [Integration], summary: '重新探索 Schema，產生變更清單（新欄位／改型別），依任務的 schema_change 設定處理', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/integration/sync-tasks:
