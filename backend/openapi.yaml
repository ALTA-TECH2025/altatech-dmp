        rows: { type: array, items: { type: object, properties: { bucket: { type: string }, g1: { type: string }, step: { type: integer }, alias: { type: string }, event: { type: string }, users: { type: integer, nullable: true }, rate_prev: { type: number, nullable: true }, rate_first: { type: number, nullable: true }, suppressed: { type: boolean } } } }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    CompiledQuery:
      type: object
      properties:
        sql: { type: string }
