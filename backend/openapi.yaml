      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }, '422': { description: 欄位／secret_ref 格式錯誤或疑似明文密鑰 } }
  /v1/integration/connections/{id}:
    get: { tags: [Integration], summary: '連線詳情（遮罩）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [Integration], summary: '更新非機密欄位或換 secret_ref（換參照視同輪替）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [Integration], summary: '停用連線（保留審計；有模型依賴時拒絕）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: disabled } } }
  /v1/integration/connections/{id}/test:
    post:
      tags: [Integration]
      summary: 連線測試：逐步診斷 dns→tcp→tls→auth→privilege→cdc_prereq→sample_read→clock_skew，失敗步驟附修法；在執行節點以 Workload Identity 取密鑰，API 節點不接觸明文；寫審計 integration.connection.tested
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTest' } } } } }
  /v1/integration/connections/{id}/rotate:
    post: { tags: [Integration], summary: '輪替密鑰（新 secret_ref；新舊並存 24 小時；短效憑證回 409）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '409': { description: 短效憑證不需輪替 } } }
  /v1/integration/connections/{id}/privileges:
    get: { tags: [Integration], summary: '權限自檢結果（對照 least_privilege 清單逐項 ✓／✗）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations:
    get: { tags: [Activation], summary: '目的地清單（webhook / kafka / gcs；皆為內部系統）', responses: { '200': { description: ok } } }
    post: { tags: [Activation], summary: '建立目的地（需 segments.approve；新目的地首次推送另需稽核核可）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Destination' } } } }, responses: { '201': { description: created } } }
  /v1/destinations/{id}/test:
    post: { tags: [Activation], summary: '送測試事件（audience.test，3 筆假資料）並回傳接收端回應', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations/{id}/rotate-secret:
    post: { tags: [Activation], summary: '輪替 Webhook secret（新舊並存 24 小時）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/audiences/{id}/push:
    post:
      tags: [Activation]
      summary: 推送受眾包到目的地（mode=delta|full；full 需審批；排程由 schedule 指定）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { destination_ids: { type: array, items: { type: string } }, mode: { type: string, enum: [delta, full] }, schedule: { type: string, enum: [now, after_batch, realtime, cron] }, cron: { type: string }, include_tags: { type: array, items: { type: string } } } } } } }
      responses: { '202': { description: accepted（pending_approval 或已排程） } }
  /v1/deliveries:
    get: { tags: [Activation], summary: '交付紀錄（受眾包、目的地、版本、批次、狀態、重試、下游回應）', parameters: [{ name: audience_id, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string, enum: [ok, retrying, failed, dlq] } }], responses: { '200': { description: ok } } }
  /v1/deliveries/{id}/replay:
    post: { tags: [Activation], summary: '重放失敗交付（沿用同一 Delivery-Id）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/dictionary/events:
    get: { tags: [Governance], summary: '事件字典（含未登記隔離事件）', responses: { '200': { description: ok } } }
  /v1/lineage/{entity}:
    get: { tags: [Governance], summary: '血緣', parameters: [{ name: entity, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/audit:
    get: { tags: [Governance], summary: '審計（含 agent.tool_called）', responses: { '200': { description: ok } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    MetaEvent:
      type: object
      required: [name, cn, entity, source, kind, owner]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_.]{2,47}$' }
        cn: { type: string }
        entity: { type: string, enum: [user, account, item] }
        source: { type: string }
        kind: { type: string, enum: [behavior, business, trade, marketing] }
        owner: { type: string }
        status: { type: string, enum: [draft, live], default: draft }
        properties: { type: array, items: { type: object, properties: { key: { type: string }, type: { type: string, enum: [string, number, bool, datetime, list] }, sensitivity: { type: string, enum: [L0, L1, L2, L3] } } } }
        path_node_rule: { type: string, description: 路徑分析節點拆分屬性（例 page_group） }
        note: { type: string }
    MetaProperty:
      type: object
      required: [key, cn, type, scope, sensitivity]
      properties: { key: { type: string }, cn: { type: string }, type: { type: string }, scope: { type: string, enum: [event, user, item] }, sensitivity: { type: string, enum: [L0, L1, L2, L3] }, source: { type: string }, enum: { type: array, items: { type: string } }, unit: { type: string }, item_type: { type: string } }
    DimensionTable:
      type: object
      required: [id, cn, primary_key, join, source]
      properties:
        id: { type: string, pattern: '^dim_[a-z0-9_]+$' }
        cn: { type: string }
        primary_key: { type: string }
        item_type: { type: string }
        join: { type: array, items: { type: object, required: [table, column], properties: { table: { type: string, enum: [events, users] }, column: { type: string, description: 事件／用戶屬性 }, dim_column: { type: string, description: 預設為主鍵 } } } }
        source: { type: string, description: 同步任務 id }
        columns: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, type: { type: string }, sensitivity: { type: string, enum: [L0, L1, L2, L3] }, exposed: { type: boolean, default: true } } } }
    Assignment:
      type: object
      required: [user_id, roles]
      properties:
        user_id: { type: string }
        roles: { type: array, items: { type: string } }
        scope: { type: object, properties: { branches: { type: array, items: { type: string } }, agent_customers: { type: boolean }, projects: { type: array, items: { type: string } }, segment_limit: { type: string }, lookback_days: { type: integer } } }
        expires_at: { type: string, format: date-time }
        reason: { type: string }
    SyncTask:
      type: object
      required: [id, cn, source, target, mode]
      properties:
        id: { type: string }
        cn: { type: string }
        source: { type: object, properties: { table_id: { type: string }, incremental_column: { type: string } } }
        target: { type: object, properties: { type: { type: string, enum: [events, users, dimension_table, oneid_bind, tags] }, id: { type: string, description: 維度表 id 或標籤 id }, write: { type: string, enum: [append, upsert, overwrite] } } }
        mode: { type: string, enum: [full, incremental, stream] }
        schedule: { type: string, description: cron 或 realtime }
        depends_on: { type: array, items: { type: string } }
        mapping: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, transform: { type: string }, pii: { type: boolean } } } }
        event_rules: { type: object, description: 目標為 events 時：事件名規則（固定／狀態機）、time、identities、event_id }
        cleansing: { type: array, items: { type: object, properties: { rule: { type: string }, expr: { type: string }, on_violation: { type: string, enum: [quarantine, reject, fix] } } } }
        schema_change: { type: string, enum: [auto_map, ignore, pause_and_notify], default: pause_and_notify }
    ConnectionCreate:
      type: object
      required: [id, type, auth_method, fields]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{2,31}$' }
        type: { type: string, enum: [mssql, postgresql, bigquery, sensorsdata, kafka, gcs] }
        auth_method: { type: string, description: 見 /v1/integration/connectors 的 auth_methods }
        fields: { type: object, additionalProperties: true, description: 非機密欄位；API 會掃描疑似明文密鑰並拒絕 }
        secret_refs: { type: object, additionalProperties: { type: string }, description: 'secret_field → 密鑰庫參照（projects/…/secrets/…/versions/N、kv/data/dmp/…#key、secret://ns/name/key）' }
        secrets_once: { type: object, additionalProperties: { type: string, format: password }, description: 一次性明文，API 寫入密鑰庫後丟棄；不入日誌、不回顯 }
        tls_verify: { type: boolean, default: true }
        owner: { type: string, description: 憑證負責人（輪替到期通知對象） }
    Connection:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        auth_method: { type: string }
        fields: { type: object, additionalProperties: true }
        secrets: { type: object, additionalProperties: { type: object, properties: { ref: { type: string }, value: { type: string, const: '••••••••' } } } }
        tls_verify: { type: boolean }
        rotation: { type: object, properties: { kind: { type: string, enum: [short_lived, rotating] }, every_days: { type: integer }, due: { type: string, format: date }, days_left: { type: integer }, state: { type: string, enum: [ok, warn, expired] } } }
        last_test: { type: object, properties: { at: { type: string, format: date-time }, ok: { type: boolean }, failed_step: { type: string, nullable: true } } }
        owner: { type: string }
    ConnectionTest:
      type: object
      properties:
        ok: { type: boolean }
        at: { type: string, format: date-time }
        steps:
          type: array
          items: { type: object, properties: { step: { type: string, enum: [validate, dns, tcp, tls, auth, privilege, cdc_prereq, sample_read, clock_skew] }, ok: { type: boolean }, detail: { type: string }, fix: { type: string } } }
    Event:
      type: object
      required: [type, time, project]
      properties:
        type: { type: string, enum: [track, profile_set, profile_set_once, profile_increment, profile_append, profile_unset, item_set, item_delete, track_id_bind, track_id_unbind] }
        event: { type: string }
        event_id: { type: string }
        time: { type: integer, description: ms since epoch (UTC) }
        project: { type: string }
        source: { type: string }
        distinct_id: { type: string }
        identities: { type: object, additionalProperties: true }
        entity: { type: object, properties: { type: { type: string }, id: { type: string } } }
        properties: { type: object, additionalProperties: true }
    SemanticQuery:
      type: object
      required: [metric, time]
      properties:
        metric: { type: string }
        time: { type: object, properties: { from: { type: string }, to: { type: string }, grain: { type: string, enum: [hour, day, week, month] } } }
        filters: { type: array, items: { type: object, properties: { dimension: { type: string }, op: { type: string }, value: {} } } }
        group_by: { type: array, items: { type: string } }
        segment: { type: string }
        compare: { type: string, enum: [previous_period, segment] }
    PathQuery:
      type: object
      required: [anchor, time]
      properties:
        project: { type: string }
        anchor: { type: object, required: [event], properties: { event: { type: string, description: '事件名或拆分後節點（event:值）' }, filters: { type: array, items: { type: object } } }, description: 起點（direction=after）或終點（before） }
        direction: { type: string, enum: [after, before], default: after }
        steps: { type: integer, minimum: 1, maximum: 10, default: 5 }
        session: { type: object, properties: { mode: { type: string, enum: [gap, id, cross], default: gap, description: 'gap = 依間隔切會話；id = 用 session_id；cross = 期間內整個用戶一條序列' }, gap_minutes: { type: integer, default: 30 }, max_events: { type: integer, default: 200, description: 每會話最多保留的事件數 } } }
        nodes: { type: object, properties: { events: { type: array, items: { type: string }, description: 只把這些事件當節點（空 = 全部） }, collapse_other: { type: boolean, default: false, description: 不在 events 裡的事件折成「其他」而不是略過 }, split: { type: array, items: { type: object, required: [event, field], properties: { event: { type: string }, field: { type: string } } }, description: '事件依屬性值拆成子節點（event:值）' }, merge_repeats: { type: boolean, default: true, description: 連續重複節點合併 }, exit_node: { type: boolean, default: true, description: 會話結束補「離開」節點（$AppEnd 或會話逾時） } } }
        filters: { type: array, items: { type: object } }
        segment: { type: string }
        sample: { type: number, nullable: true, description: '預設 0.1（按用戶分桶）；null = 不抽樣' }
        top_n: { type: integer, default: 100, maximum: 1000 }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, now: { type: string } } }
    PathResult:
      type: object
      properties:
        paths: { type: array, items: { type: object, properties: { path: { type: array, items: { type: string } }, users: { type: integer, nullable: true }, sessions: { type: integer, nullable: true }, share: { type: number, nullable: true, description: 占起點用戶比例 }, avg_ms: { type: number, nullable: true }, suppressed: { type: boolean } } } }
        anchor_users: { type: integer, description: 經過起點的用戶數（抽樣後） }
        nodes: { type: array, items: { type: object, properties: { level: { type: integer }, node: { type: string }, users: { type: integer } } }, description: 桑基節點（由未抑制的路徑彙總） }
        links: { type: array, items: { type: object, properties: { level: { type: integer }, from: { type: string }, to: { type: string }, users: { type: integer } } } }
        sampled: { type: number, nullable: true }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    FunnelQuery:
      type: object
      required: [steps, window, time]
      properties:
        project: { type: string }
        steps: { type: array, minItems: 2, maxItems: 10, items: { type: object, required: [event], properties: { event: { type: string }, alias: { type: string }, filters: { type: array, items: { type: object } } } } }
        window: { type: object, required: [value, unit], properties: { value: { type: integer, minimum: 1 }, unit: { type: string, enum: [minute, hour, day] } }, description: 最長 90 天 }
        order: { type: string, enum: [loose, strict], default: loose }
        relation: { type: string, description: 關聯屬性（業務 ID）：entity_id 或 props.<key>；同一值的事件才算同一流程 }
        metric: { type: string, enum: [users, times], default: users, description: times 需指定 relation（計算流程數） }
        group_by: { type: array, maxItems: 1, items: { type: string }, description: 分組值取自第一步事件 }
        trend: { type: string, enum: [day, week, month], description: 依第一步發生日期分桶 }
        filters: { type: object, description: 全局篩選（同 SemanticQuery.filters） }
        segment: { type: string }
        sample: { type: number, description: 按用戶抽樣比例 (0,1) }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string } } }
    RetentionQuery:
      type: object
      required: [initial, time]
      properties:
        project: { type: string }
        initial: { type: object, required: [event], properties: { event: { type: string }, filters: { type: array, items: { type: object } } }, description: 初始行為 }
        return: { type: object, properties: { event: { type: string, nullable: true, description: 空 = 任一事件 }, filters: { type: array, items: { type: object } } }, description: 回訪行為（省略 = 任一事件） }
        model: { type: string, enum: [date, interval, continuous, churn], default: date }
        unit: { type: string, enum: [day, week, month], default: day }
        periods: { type: integer, minimum: 1, maximum: 90, default: 7 }
        include_day0: { type: boolean, default: false, description: 輸出第 0 期（當期回訪） }
        group_by: { type: array, maxItems: 1, items: { type: string }, description: 分組值取自初始事件 }
        filters: { type: object }
        segment: { type: string }
        sample: { type: number }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string } }, description: 初始行為的日期範圍（同期群） }
    RetentionResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { cohort: { type: string }, g1: { type: string }, period: { type: integer }, users: { type: integer, nullable: true, description: 同期群人數 }, retained: { type: integer, nullable: true }, rate: { type: number, nullable: true }, complete: { type: boolean, description: 該期是否已過（未過的期數為不完整） }, suppressed: { type: boolean } } } }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    UsersQuery:
      type: object
      description: 用戶列表條件：全部是「人」的條件（用戶屬性／分群／做過未做過／來自分析結果的下鑽）；事件欄位請放在 behaviors.filters
      properties:
        project: { type: string }
        filters: { description: 用戶屬性（user.<key>，只限寬表 L0–L2）與分群（seg.<id>）條件；可巢狀 and／or, oneOf: [{ type: array, items: { type: object } }, { type: object, properties: { op: { type: string, enum: [and, or] }, items: { type: array, items: { type: object } } } }] }
        segment: { type: string, description: 等同 filters 加 seg.<id> in }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' } }
        behaviors_op: { type: string, enum: [and, or], default: and }
        time: { type: object, description: behaviors 未各自指定時的預設時間範圍, properties: { from: { type: string }, to: { type: string }, now: { type: string } } }
        source: { $ref: '#/components/schemas/UsersSource' }
    UsersBehavior:
      type: object
      required: [event]
      properties:
        event: { type: string }
        filters: { type: array, items: { type: object }, description: 事件屬性條件 }
        done: { type: boolean, default: true, description: false = 期間內一次都沒做過（忽略 count） }
        count: { type: object, properties: { op: { type: string, enum: [gte, lte, eq, between], default: gte }, value: { description: '數字或 [a, b]' } } }
        time: { type: object, properties: { from: { type: string }, to: { type: string } } }
    UsersSource:
      type: object
      description: 從分析結果的某個落點下鑽成用戶列表（漏斗某步到達／流失、留存某同期群某期留存／未留存、事件分析某桶某分組）
      required: [type, query]
      properties:
        type: { type: string, enum: [funnel, retention, events, path] }
        query: { type: object, description: 原分析查詢（FunnelQuery／RetentionQuery／SemanticQuery／PathQuery） }
        node: { type: string, description: 'path：節點名' }
        level: { type: integer, description: 'path：節點所在步（0 = 起點）' }
        step: { type: integer, description: funnel：步驟序號（1 起） }
        reached: { type: boolean, default: true, description: funnel：true = 到達該步；false = 在該步流失（到達前一步但未到達此步，step ≥ 2） }
        bucket: { type: string, description: funnel 趨勢桶／events 時間桶 }
        group: { description: 'funnel／retention 的 g1 值，或 events 的 [g1, g2, …]' }
        cohort: { type: string, description: retention：同期群 }
        period: { type: integer, description: retention：期數 }
        retained: { type: boolean, nullable: true, description: retention：true 留存／false 未留存／null 整個同期群 }
        metric: { type: string, description: events：指標別名（預設第一個） }
    UsersEstimate:
      type: object
      properties:
        users: { type: integer }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    UsersListRequest:
      allOf:
        - $ref: '#/components/schemas/UsersQuery'
        - type: object
          properties:
            columns: { type: array, items: { type: string }, description: 要顯示的用戶屬性（寬表 L0–L2；hide 的欄位略過並回 warning） }
            sort: { type: object, properties: { field: { type: string }, dir: { type: string, enum: [asc, desc] } } }
            page_size: { type: integer, default: 50, maximum: 500 }
            cursor: { type: string, description: 上一頁回的 next_cursor；最多瀏覽 100,000 筆 }
    UsersListResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, description: one_id（遮罩）+ columns } }
        columns: { type: array, items: { type: string } }
        masked: { type: object, additionalProperties: { type: string } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, description: 同條件的 Bitmap 基數（第一頁計算、游標帶著走） }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    Profile:
      type: object
      properties:
        one_id: { type: string, description: 依角色遮罩 }
        props: { type: object, description: 寬表用戶屬性（依角色遮罩；hide 略過） }
        masked: { type: object, additionalProperties: { type: string } }
        segments: { type: array, items: { type: string } }
        summary: { type: object, properties: { days: { type: integer }, events: { type: array, items: { type: object, properties: { event: { type: string }, cn: { type: string }, n: { type: integer }, first: { type: string }, last: { type: string } } } }, total: { type: integer } } }
        warnings: { type: array, items: { type: string } }
    TimelineResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { time: { type: string, description: UTC }, event: { type: string }, cn: { type: string }, platform: { type: string }, channel: { type: string }, symbol: { type: string }, side: { type: string }, amount: { nullable: true, description: 依角色遮罩（區間字串或數字） }, entity_type: { type: string }, entity_id: { type: string }, session_id: { type: string }, event_id: { type: string }, props: { type: object } } } }
        next_cursor: { type: string, nullable: true }
