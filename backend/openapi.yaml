    get: { tags: [Meta], summary: '下載字典', parameters: [{ name: property, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/meta/virtual-properties:
    get: { tags: [Meta], summary: '虛擬屬性（表達式組合屬性與維度表欄位；查詢時計算）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '建立虛擬屬性（名稱不可與既有屬性重複；表達式 ≤ 1024 字元；型別推斷與預覽）', responses: { '201': { description: created } } }
  /v1/ops/pipeline:
    get: { tags: [Ops], summary: '端到端資料流各段吞吐、延遲、狀態（Prometheus 供數）與資料品質指標', responses: { '200': { description: ok } } }
  /v1/ops/query-perf:
