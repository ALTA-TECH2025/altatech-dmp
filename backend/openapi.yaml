  /auth/login:
    get: { tags: [Auth], summary: '開始 OIDC 登入（授權碼 + PKCE；302 到 IdP；state 綁 dmp_login cookie）', parameters: [{ name: provider, in: query, required: true, schema: { type: string } }, { name: return_to, in: query, schema: { type: string, description: 只接受站內路徑 } }], responses: { '302': { description: 轉向 IdP } } }
