    post: { tags: [Auth], summary: '帳密登入（direct 模式）：provider=ad 走 LDAPS bind、provider=local 走本機帳號（scrypt 密碼 + TOTP；外包／單機環境用）；第一步回 next=totp，第二步帶 totp 驗證；速率限制與鎖定；審計', requestBody: { content: { application/json: { schema: { type: object, required: [username, password], properties: { provider: { type: string, enum: [ad, local], default: ad }, username: { type: string }, password: { type: string }, totp: { type: string } } } } } }, responses: { '200': { description: ok 或 next=totp }, '401': { description: 帳號或密碼錯誤 } } }
