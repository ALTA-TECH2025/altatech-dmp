    post: { tags: [IAM], summary: '建立自訂角色（需 iam.admin）。rbac.yaml custom_roles.second_review 開啟時不直接生效：回 202 與審批單（type=role_change，另一位系統管理員或數位經營核可後才寫入並審計 role.changed）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }, responses: { '201': { description: created } } }
  /v1/iam/roles/{key}:
    put: { tags: [IAM], summary: '更新角色名稱、說明、範圍、權限勾選（雙人複核開啟時回 202 審批單，附變更前後快照）', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }, responses: { '200': { description: ok } } }
    delete: { tags: [IAM], summary: '刪除角色（系統管理員；admin 角色本身不可刪；仍有指派時需帶 reassign_to 改派，否則 409；審計 role.deleted，雙人複核）', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/iam/roles/{key}/copy:
    post: { tags: [IAM], summary: '複製角色為新草稿', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], responses: { '201': { description: created } } }
  /v1/iam/assignments:
    get: { tags: [IAM], summary: '使用者指派清單（角色、數據範圍、到期、SSO 群組、最近登入；臨時提權標記）', responses: { '200': { description: ok } } }
    post: { tags: [IAM], summary: '指派角色給使用者（多角色；範圍：組織樹節點／營業員客戶／專案／分群限制／回溯天數；到期日；需 iam.admin；審計 iam.assignment.created）。break_glass=true（臨時提權 admin，hours ≤ 4）不直接生效：回 202 審批單 type=break_glass，由申請者之外的系統管理員或數位經營核可後建立到期指派', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }, responses: { '201': { description: created } } }
  /v1/iam/assignments/{id}:
    patch: { tags: [IAM], summary: '修改範圍／到期', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [IAM], summary: '撤銷（含臨時提權）；審計 iam.assignment.revoked', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: revoked } } }
  /v1/iam/scope/simulate:
    post: { tags: [IAM], summary: '行級規則模擬：給角色＋範圍，回查詢編譯器會加的 WHERE 與遮罩欄位（UI／API／agent 共用）', requestBody: { content: { application/json: { schema: { type: object, properties: { role: { type: string }, scope: { type: object } } } } } }, responses: { '200': { description: ok } } }
  /v1/sync/tags:
    get:
      tags: [Sync]
      summary: 單一客戶的全部標籤值（Valkey 快取，< 10 ms；代碼化 ID；依目標系統合約套隱碼）
      parameters: [{ name: one_id, in: query, schema: { type: string } }, { name: customer_code, in: query, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TagSnapshot' } } } } }
  /v1/sync/tags/changes:
    get:
      tags: [Sync]
      summary: 標籤變更增量（日批後比對前一版本；分頁拉取；大量同步請用 Kafka dmp.tag_updates 或 GCS Parquet）
