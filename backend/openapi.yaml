openapi: 3.1.0
info:
  title: AltaTech DMP API
  version: 0.1.0
  description: 人（UI）與 AI agent 共用的語意層／分析／分群／洞察 API。所有端點以 on_behalf_of 身份套權限。
servers:
  - url: https://dmp.internal/api
security: [{ bearerAuth: [] }]
tags:
  - { name: Ingest }
  - { name: Semantic }
  - { name: Analytics }
  - { name: Profile }
  - { name: OneID }
  - { name: Segments }
  - { name: Triggers }
  - { name: Insights }
  - { name: Agents }
  - { name: Governance }
  - { name: IAM }
  - { name: Sync }
  - { name: Activation }
  - { name: Integration }
  - { name: Meta }
  - { name: Ops }
  - { name: Migration }
paths:
  /v1/events:
    post:
      tags: [Ingest]
      summary: 寫入事件（神策相容超集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
      responses: { '202': { description: accepted } }
  /v1/semantic/metrics:
    get: { tags: [Semantic], summary: '指標目錄', responses: { '200': { description: ok } } }
  /v1/semantic/events:
    get: { tags: [Semantic], summary: '事件字典', responses: { '200': { description: ok } } }
  /v1/semantic/dimensions:
    get: { tags: [Semantic], summary: '維度目錄', responses: { '200': { description: ok } } }
  /v1/semantic/compile:
    post:
      tags: [Semantic]
      summary: 語意查詢 → SQL（dry-run，含成本與血緣）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CompiledQuery' } } } } }
  /v1/analytics/events:
    post: { tags: [Analytics], summary: '事件分析', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResult' } } } } } }
  /v1/analytics/funnel:
    post: { tags: [Analytics], summary: '漏斗分析：2–10 步（每步事件 + 篩選）、窗口 1 分鐘–90 天、寬鬆／嚴格順序、關聯屬性（業務 ID 串流程）、用戶數／次數口徑、單維分組、趨勢；回每步人數、相對上一步與第一步轉換率；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/FunnelQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/FunnelResult' } } } } } }
  /v1/semantic/catalog:
    get: { tags: [Semantic], summary: '語意目錄（給查詢建構器）：事件字典、維度、用戶屬性（可篩選／可分組）、聚合與運算子清單；依身分過濾 L3 以上欄位', responses: { '200': { description: ok } } }
  /v1/analytics/retention:
    post: { tags: [Analytics], summary: '留存分析：初始行為與回訪行為各自可選事件與篩選；四模型（date 第 N 期當期回訪、interval N 期內任一期、continuous 連續 N 期、churn 第 N 期起不再回訪）；日／週／月、期數、含當期、單維分組（取初始事件）；回每個同期群 × 期的人數、留存人數、比例；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RetentionQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RetentionResult' } } } } } }
  /v1/analytics/path:
    post: { tags: [Analytics], summary: '行為路徑（起點或終點事件、之後／之前 1–10 步、會話切割、節點拆分與合併、離開節點；預設抽樣 1/10；Top N 路徑 + 桑基節點／連線；K 匿名）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PathQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PathResult' } } } } } }
  /v1/analytics/interval:
    post: { tags: [Analytics], summary: '間隔', responses: { '200': { description: ok } } }
  /v1/analytics/distribution:
    post: { tags: [Analytics], summary: '分布', responses: { '200': { description: ok } } }
  /v1/analytics/attribution:
    post: { tags: [Analytics], summary: '歸因', responses: { '200': { description: ok } } }
  /v1/analytics/ltv:
    post: { tags: [Analytics], summary: 'LTV', responses: { '200': { description: ok } } }
  /v1/analytics/session:
    post: { tags: [Analytics], summary: 'Session', responses: { '200': { description: ok } } }
  /v1/users/estimate:
    post: { tags: [Users], summary: '用戶列表人數預估（條件 → 各自 Bitmap 交併差 → bitmapCardinality；精確、< 1 s）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersEstimate' } } } }, '400': { description: 條件不合法 }, '403': { description: users.use 未授權 } } }
  /v1/users/list:
    post: { tags: [Users], summary: '用戶列表分頁（keyset 游標；每頁 ≤ 500；最多瀏覽 100,000 筆，之後請走匯出審批；欄位依角色遮罩）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersListRequest' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersListResult' } } } } } }
  /v1/profiles/{one_id}:
    get: { tags: [Profile], summary: '畫像（用戶細查第一頁：用戶屬性脫敏、近 30 天事件摘要、所屬分群；需 reason，審計 profile.viewed；範圍外回 404）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string, minLength: 4, maxLength: 200 } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '403': { description: profile.use 未授權或缺 reason }, '404': { description: 不存在或不在資料範圍 } } }
  /v1/profiles/{one_id}/timeline:
    get: { tags: [Profile], summary: '行為序列（用戶細查，需 reason；時間倒序 keyset 分頁；金額等欄位依角色遮罩；props 去除 L4 鍵）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: events, in: query, schema: { type: string }, description: 逗號分隔的事件名 }, { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }, { name: cursor, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineResult' } } } } } }
  /v1/profiles/{one_id}/identities:
    get: { tags: [Profile], summary: '身分圖（id_edges：節點 = ID 類型 × 遮罩後的值；邊 = 來源、證據事件、信心、狀態、首末次；需 reason）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGraph' } } } } } }
  /v1/oneid/resolve:
    get: { tags: [OneID], summary: '解析 ID → one_id（接入時歸戶規則見 docs/19；一個 ID 只屬一個用戶）', parameters: [{ name: type, in: query, schema: { type: string } }, { name: value, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/bind:
    post: { tags: [OneID], summary: '綁定指令（CRM 主檔 {login_id, account_no} 等；等同一條共現資料，套同一套歸戶規則）', responses: { '200': { description: ok } } }
  /v1/oneid/unbind:
    post: { tags: [OneID], summary: '解綁（login_id 不可解綁；審計 oneid.unbound）', responses: { '200': { description: ok }, '409': { description: 不可解綁 } } }
  /v1/oneid/merge:
    post: { tags: [OneID], summary: '人工合併兩個用戶（唯一會改寫事件 one_id 的操作；由資訊管理發起、系統管理員審批）', responses: { '202': { description: pending_approval } } }
  /v1/oneid/{one_id}/history:
    get: { tags: [OneID], summary: '綁定／改綁／升級／衝突歷史', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/backfills:
    get: { tags: [OneID], summary: '登入改寫批次（近 7 天匿名事件改寫到登入客戶；docs/19 §2.5）：待套用／已套用、筆數、視窗', responses: { '200': { description: ok } } }
  /v1/oneid/erase:
    post: { tags: [OneID], summary: 'DSAR 刪除', responses: { '202': { description: accepted } } }
  /v1/segments:
    get: { tags: [Segments], summary: '列出分群（q 搜尋、status、kind；回收站用 status=recycled）', parameters: [{ name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: kind, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Segment' } } } } } } }
    post: { tags: [Segments], summary: '建立分群（規則 = UsersQuery；行銷與 agent 提議者為 pending_approval，數據分析／數位經營／admin 直接 active；每專案 ≤ 500）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '400': { description: 規則不合法 }, '409': { description: 名稱重複或超過上限 } } }
  /v1/segments/{id}/preview:
    post: { tags: [Segments], summary: '預估人數（Bitmap 基數，精確）與畫像（生命週期／價值分級／資產區間／分公司分布）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentPreview' } } } } } }
  /v1/segments/{id}:
    get: { tags: [Segments], summary: '分群詳情（基礎資訊、規則、最新版本、更新方式、存儲設定）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } } } }
    put: { tags: [Segments], summary: '編輯分群（結果保存分群不可改規則；手動分群不可改更新方式；例行分群可改時間範圍與最早計算時間，不可改頻率；改規則後需重新計算）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCreate' } } } }, responses: { '200': { description: ok }, '409': { description: 不可變更的欄位 } } }
  /v1/segments/{id}/approve:
    post: { tags: [Segments], summary: '審批（數位經營／admin；approve=false 退回 draft 並附 note）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { approve: { type: boolean, default: true }, note: { type: string } } } } } }, responses: { '200': { description: ok }, '409': { description: 不在待審批狀態 } } }
  /v1/segments/{id}/versions:
    get: { tags: [Segments], summary: '歷史版本（basetime、人數、計算狀態；可下鑽用戶、另存新分群、下載）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SegmentVersion' } } } } } } }
  /v1/segments/{id}/versions/{basetime}/members:
    get: { tags: [Segments], summary: '某版本的用戶列表（與 /v1/users/list 同形：columns／sort／page_size／cursor；欄位依角色遮罩；下載需審批與浮水印）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: basetime, in: path, required: true, schema: { type: string, description: 'YYYY-MM-DD 或 latest' } }, { name: page_size, in: query, schema: { type: integer } }, { name: cursor, in: query, schema: { type: string } }, { name: columns, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersListResult' } } } } } }
  /v1/segments/{id}/compute:
    post: { tags: [Segments], summary: '手動更新（basetime = 今日 00:00；手動分群只留 1 版，例行分群留 keep 版）；最小版同步計算並回版本紀錄，正式環境排進 Airflow', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { basetime: { type: string, description: '例行分群回溯用 YYYY-MM-DD' } } } } } }, responses: { '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentVersion' } } } }, '409': { description: 未生效（待審批／回收站） } } }
  /v1/segments/tick:
    post: { tags: [Segments], summary: '例行分群排程（排程器每分鐘呼叫；admin）：到期且當日未算的 active 例行分群依序計算，回執行清單', responses: { '200': { description: ok } } }
  /v1/segments/{id}/pause:
    post: { tags: [Segments], summary: '暫停／啟動例行分群', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/copy:
    post: { tags: [Segments], summary: '複製規則建立新分群', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '201': { description: created } } }
  /v1/segments/{id}/lineage:
    get: { tags: [Segments], summary: '血緣關係（上游標籤／分群／事件／屬性；下游推送、規則、分析）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/recycle:
    post: { tags: [Segments], summary: '移入回收站（有下游依賴時回 409 需確認；支援批量）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '409': { description: has_dependents } } }
  /v1/segments/{id}/restore:
    post: { tags: [Segments], summary: '從回收站恢復', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/purge:
    delete: { tags: [Segments], summary: '徹底刪除（系統管理員；不可恢復；回收站保留天數到期自動執行）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/segments/estimate:
    post: { tags: [Segments], summary: '規則預估人數（預設 1/16 抽樣，比例可後台配置）', responses: { '200': { description: ok } } }
  /v1/segments/import:
    post: { tags: [Segments], summary: '導入創建：上傳 txt／csv，指定匹配屬性（任一 ID 欄位或用戶屬性）、是否保留未匹配 ID；先做 L4 欄位掃描', responses: { '202': { description: queued } } }
  /v1/tags:
    get: { tags: [Segments], summary: '標籤目錄', responses: { '200': { description: ok } } }
    post: { tags: [Segments], summary: '建立標籤', responses: { '201': { description: created } } }
  /v1/tags/{id}:
    get: { tags: [Segments], summary: '標籤詳情（基礎資訊、所屬目錄、創建方式、規則、更新方式、存儲、審批、自定義欄位）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    put: { tags: [Segments], summary: '編輯標籤（基礎資訊、規則或重新上傳、存儲設定；留變更記錄）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/distribution:
    get: { tags: [Segments], summary: '標籤值分布（最新可用版本或指定 basetime；經數據權限過濾；排序與顯示數量）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: basetime, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/versions:
    get: { tags: [Segments], summary: '歷史詳情（每個計算結果的分布與人數）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/lineage:
    get: { tags: [Segments], summary: '血緣（含某計算結果依賴的上游 basetime）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/pause:
    post: { tags: [Segments], summary: '停用／啟用（有下游依賴時提醒）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/backfill:
    post: { tags: [Segments], summary: '回溯指定 basetime 區間重算；終止計算用 DELETE /v1/tags/{id}/runs/current', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: queued } } }
  /v1/tags/{id}/approve:
    post: { tags: [Segments], summary: '審批（通過／退回／拒絕）；數位經營或系統管理員', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/recycle:
    post: { tags: [Segments], summary: '移入回收站（保留 N 天後自動徹底刪除）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/custom-fields:
    get: { tags: [Segments], summary: '標籤自定義欄位定義（字串／日期；文字框、單選、多選、日期）', responses: { '200': { description: ok } } }
  /v1/sql/tables:
    get: { tags: [SQL], summary: '自定義 SQL 可用的數據庫表與欄位（依數據表權限；含中間表）', responses: { '200': { description: ok } } }
  /v1/sql/query:
    post: { tags: [SQL], summary: '執行 SQL（唯讀；脫敏預校驗，涉及脫敏欄位直接報錯；行級規則與列級遮罩；每人最多 5 條同時；掃描與逾時上限；結果預覽 1000 列）', responses: { '200': { description: ok }, '400': { description: masked_field_or_non_select }, '429': { description: too_many_running } } }
  /v1/sql/query/{run_id}/download:
    get: { tags: [SQL], summary: '下載查詢結果（Excel／CSV；上限 10 萬列；L2 區間化、浮水印；審計 export）', parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/sql/saved:
    get: { tags: [SQL], summary: '已存查詢目錄（分組）', responses: { '200': { description: ok } } }
    post: { tags: [SQL], summary: '添加到查詢／保存至概覽或書籤（含動態參數與可視化設定）', responses: { '201': { description: created } } }
  /v1/sql/history:
    get: { tags: [SQL], summary: '查詢記錄（最近 30 天內最近 100 條；成功者可重新下載）', responses: { '200': { description: ok } } }
  /v1/sql/mid-tables:
    post: { tags: [SQL], summary: '保存到中間表：建立 SQL 任務（名稱、調度週期、授權）→ 任務管理與數據表管理各一筆', responses: { '201': { description: created } } }
  /v1/triggers:
    get: { tags: [Triggers], summary: '即時規則', responses: { '200': { description: ok } } }
    post: { tags: [Triggers], summary: '建立規則', responses: { '201': { description: created } } }
  /v1/insights:
    get:
      tags: [Insights]
      summary: 洞察列表／檢索
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Insight' } } } } } }
    post: { tags: [Insights], summary: '建立洞察', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Insight' } } } }, responses: { '201': { description: created } } }
  /v1/insights/{id}/feedback:
