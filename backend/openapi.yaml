        rule: { $ref: '#/components/schemas/UsersQuery' }
        update: { type: object, properties: { mode: { type: string, enum: [manual, routine], default: manual }, freq: { type: string, enum: [daily, weekly, monthly], default: daily }, earliest: { type: string, default: '06:00', description: 'HH:MM，最早計算時間' }, keep: { type: integer, minimum: 1, maximum: 100, default: 7, description: 例行版本保留數；手動固定 1 } } }
        tz: { type: string, default: Asia/Taipei }
    Segment:
      allOf:
        - $ref: '#/components/schemas/SegmentCreate'
        - type: object
          properties:
            id: { type: string }
            project: { type: string }
            status: { type: string, enum: [draft, pending_approval, active, paused, recycled] }
            owner: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
            approval: { type: object, properties: { status: { type: string, enum: [none, pending, approved, rejected] }, by: { type: string }, at: { type: string }, note: { type: string } } }
            latest: { $ref: '#/components/schemas/SegmentVersion' }
            lineage: { type: object, properties: { up: { type: array, items: { type: string }, description: 'event:*／dmp.users_dict／segment:*…' }, down: { type: array, items: { type: string }, description: 引用本分群的分群（之後：推送單、觸發規則、分析） } } }
            recycled_at: { type: string, nullable: true }
    SegmentVersion:
      type: object
      properties:
        version: { type: integer }
        basetime: { type: string, description: YYYY-MM-DD }
        users: { type: integer, nullable: true }
        status: { type: string, enum: [running, success, failed, cancelled] }
        computed_at: { type: string }
        ms: { type: integer }
        trigger: { type: string, enum: [manual, routine, backfill] }
        error: { type: string, nullable: true }
    SegmentPreview:
      type: object
      properties:
        users: { type: integer }
