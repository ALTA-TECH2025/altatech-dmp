openapi: 3.1.0
info:
  title: AltaTech DMP API
  version: 0.1.0
  description: 人（UI）與 AI agent 共用的語意層／分析／分群／洞察 API。所有端點以 on_behalf_of 身份套權限。
servers:
  - url: https://dmp.internal/api
security: [{ bearerAuth: [] }]
tags:
  - { name: Ingest }
  - { name: Semantic }
  - { name: Analytics }
  - { name: Dashboards }
  - { name: Profile }
  - { name: OneID }
  - { name: Segments }
  - { name: Triggers }
  - { name: Insights }
  - { name: Agents }
  - { name: Governance }
  - { name: IAM }
  - { name: Sync }
  - { name: Activation }
  - { name: Integration }
  - { name: Meta }
  - { name: Ops }
  - { name: Migration }
paths:
  /v1/events:
    post:
      tags: [Ingest]
      summary: 寫入事件（神策相容超集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
      responses: { '202': { description: accepted } }
  /v1/semantic/metrics:
    get: { tags: [Semantic], summary: '指標目錄', responses: { '200': { description: ok } } }
  /v1/semantic/events:
    get: { tags: [Semantic], summary: '事件字典', responses: { '200': { description: ok } } }
  /v1/semantic/dimensions:
    get: { tags: [Semantic], summary: '維度目錄', responses: { '200': { description: ok } } }
  /v1/semantic/compile:
    post:
      tags: [Semantic]
      summary: 語意查詢 → SQL（dry-run，含成本與血緣）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CompiledQuery' } } } } }
  /v1/analytics/events:
    post: { tags: [Analytics], summary: '事件分析', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResult' } } } } } }
  /v1/analytics/funnel:
    post: { tags: [Analytics], summary: '漏斗分析：2–10 步（每步事件 + 篩選）、窗口 1 分鐘–90 天、寬鬆／嚴格順序、關聯屬性（業務 ID 串流程）、用戶數／次數口徑、單維分組、趨勢；回每步人數、相對上一步與第一步轉換率；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/FunnelQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/FunnelResult' } } } } } }
  /v1/semantic/catalog:
    get: { tags: [Semantic], summary: '語意目錄（給查詢建構器）：事件字典、維度、用戶屬性（可篩選／可分組）、聚合與運算子清單；依身分過濾 L3 以上欄位', responses: { '200': { description: ok } } }
  /v1/analytics/retention:
    post: { tags: [Analytics], summary: '留存分析：初始行為與回訪行為各自可選事件與篩選；四模型（date 第 N 期當期回訪、interval N 期內任一期、continuous 連續 N 期、churn 第 N 期起不再回訪）；日／週／月、期數、含當期、單維分組（取初始事件）；回每個同期群 × 期的人數、留存人數、比例；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RetentionQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RetentionResult' } } } } } }
  /v1/analytics/path:
    post: { tags: [Analytics], summary: '行為路徑（起點或終點事件、之後／之前 1–10 步、會話切割、節點拆分與合併、離開節點；預設抽樣 1/10；Top N 路徑 + 桑基節點／連線；K 匿名）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PathQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PathResult' } } } } } }
  /v1/analytics/interval:
    post: { tags: [Analytics], summary: '間隔', responses: { '200': { description: ok } } }
  /v1/analytics/distribution:
    post: { tags: [Analytics], summary: '分布', responses: { '200': { description: ok } } }
  /v1/analytics/attribution:
    post: { tags: [Analytics], summary: '歸因（轉化目標 × 待歸因觸點；首次／末次／線性／位置／時間衰減／自訂權重，可多模型同時比較；回溯窗口 1–90 天；觸點可依維度拆分；K 匿名）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AttributionQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AttributionResult' } } } } } }
  /v1/analytics/ltv:
    post: { tags: [Analytics], summary: 'LTV', responses: { '200': { description: ok } } }
  /v1/analytics/session:
    post: { tags: [Analytics], summary: 'Session', responses: { '200': { description: ok } } }
  /v1/users/estimate:
    post: { tags: [Users], summary: '用戶列表人數預估（條件 → 各自 Bitmap 交併差 → bitmapCardinality；精確、< 1 s）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersEstimate' } } } }, '400': { description: 條件不合法 }, '403': { description: users.use 未授權 } } }
  /v1/users/list:
    post: { tags: [Users], summary: '用戶列表分頁（keyset 游標；每頁 ≤ 500；最多瀏覽 100,000 筆，之後請走匯出審批；欄位依角色遮罩）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersListRequest' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersListResult' } } } } } }
  /v1/profiles/{one_id}:
    get: { tags: [Profile], summary: '畫像（用戶細查第一頁：用戶屬性脫敏、近 30 天事件摘要、所屬分群；需 reason，審計 profile.viewed；範圍外回 404）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string, minLength: 4, maxLength: 200 } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '403': { description: profile.use 未授權或缺 reason }, '404': { description: 不存在或不在資料範圍 } } }
  /v1/profiles/{one_id}/timeline:
    get: { tags: [Profile], summary: '行為序列（用戶細查，需 reason；時間倒序 keyset 分頁；金額等欄位依角色遮罩；props 去除 L4 鍵）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: events, in: query, schema: { type: string }, description: 逗號分隔的事件名 }, { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }, { name: cursor, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineResult' } } } } } }
  /v1/profiles/{one_id}/identities:
    get: { tags: [Profile], summary: '身分圖（id_edges：節點 = ID 類型 × 遮罩後的值；邊 = 來源、證據事件、信心、狀態、首末次；需 reason）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGraph' } } } } } }
  /v1/oneid/resolve:
    get: { tags: [OneID], summary: '解析 ID → one_id（接入時歸戶規則見 docs/19；一個 ID 只屬一個用戶）', parameters: [{ name: type, in: query, schema: { type: string } }, { name: value, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/bind:
    post: { tags: [OneID], summary: '綁定指令（CRM 主檔 {login_id, account_no} 等；等同一條共現資料，套同一套歸戶規則）', responses: { '200': { description: ok } } }
  /v1/oneid/unbind:
    post: { tags: [OneID], summary: '解綁（login_id 不可解綁；審計 oneid.unbound）', responses: { '200': { description: ok }, '409': { description: 不可解綁 } } }
  /v1/oneid/merge:
    post: { tags: [OneID], summary: '人工合併兩個用戶（唯一會改寫事件 one_id 的操作；由資訊管理發起、系統管理員審批）', responses: { '202': { description: pending_approval } } }
  /v1/oneid/{one_id}/history:
    get: { tags: [OneID], summary: '綁定／改綁／升級／衝突歷史', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/backfills:
    get: { tags: [OneID], summary: '登入改寫批次（近 7 天匿名事件改寫到登入客戶；docs/19 §2.5）：待套用／已套用、筆數、視窗', responses: { '200': { description: ok } } }
  /v1/oneid/erase:
    post: { tags: [OneID], summary: 'DSAR 刪除', responses: { '202': { description: accepted } } }
  /v1/approvals:
    get: { tags: [Approvals], summary: '審批單（待我審批 = 類型的審批角色含我的角色；我的申請 = 我發起的；admin 全看）', parameters: [{ name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } }, { name: type, in: query, schema: { type: string } }, { name: scope, in: query, schema: { type: string, enum: [to_me, mine, all], default: to_me } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Approval' } } } } } } }
  /v1/approvals/{id}:
    get: { tags: [Approvals], summary: '審批單詳情', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } } } }
  /v1/approvals/{id}/decide:
    post: { tags: [Approvals], summary: '核可／退回（審批角色依類型：匯出與分群 = 數位經營；L3 揭露 = admin；不能審自己的申請；審計 approval.decided 並回寫受控物件）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { approve: { type: boolean, default: true }, note: { type: string } } } } } }, responses: { '200': { description: ok }, '409': { description: 不在待審批 } } }
  /v1/exports:
    get: { tags: [Exports], summary: '匯出申請（我的；admin／數位經營全看）', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Export' } } } } } } }
    post: { tags: [Exports], summary: '申請匯出用戶列表或分群成員（需 users.export；附用途、保存天數；先估列數，上限 100,000；建立審批單給數位經營；審計 export.requested）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }, '400': { description: 列數超過上限或條件不合法 }, '403': { description: 無 users.export } } }
  /v1/exports/{id}:
    get: { tags: [Exports], summary: '匯出申請詳情', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } } } }
  /v1/exports/{id}/run:
    post: { tags: [Exports], summary: '核可後產生檔案（申請者本人；匯出遮罩比 UI 嚴一級：L2 區間化、L3 尾碼；每列帶浮水印欄、檔頭帶申請單號／使用者／時間；審計 export.generated）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }, '409': { description: 未核可或已過期 } } }
  /v1/exports/{id}/download:
    get: { tags: [Exports], summary: '下載 CSV（申請者本人；核可後 7 天內；審計 export.downloaded）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { text/csv: { schema: { type: string } } } }, '409': { description: 尚未產生或已過期 } } }
  /v1/reveals:
    get: { tags: [Approvals], summary: '揭露申請（我的；admin／數位經營全看）；active = 核可且未到期', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reveal' } } } } } } }
    post: { tags: [Approvals], summary: '申請揭露遮罩欄位（masking.yaml 的欄位；L3 由 admin 審批、L2 由數位經營；理由必填；時效預設 24 小時）；核可後該欄位在時效內對申請者明文，每次查看寫審計 mask.revealed', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RevealRequest' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Reveal' } } } }, '400': { description: 欄位不在遮罩表或本來就明文 } } }
  /v1/dashboards:
    get:
      tags: [Dashboards]
      summary: 看板清單：我建立的 + 分享給我的角色或我的（admin 全看）；卡片數、擁有者、更新時間
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dashboard' } } } } }
    post:
      tags: [Dashboards]
      summary: 建立看板（需 overview.use）；擁有者 = 建立者；可同時帶卡片
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCreate' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /v1/dashboards/{id}:
    get:
      tags: [Dashboards]
      summary: 看板詳情（含卡片定義，不含資料）；非擁有者且未分享 → 404
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
    put:
      tags: [Dashboards]
      summary: 更新名稱、描述、分享對象、卡片順序與寬度（擁有者或 admin）；審計 dashboard.updated
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCreate' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
    delete:
      tags: [Dashboards]
      summary: 刪除看板（擁有者或 admin）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deleted } }
  /v1/dashboards/{id}/cards:
    post:
      tags: [Dashboards]
      summary: 加一張卡片（從事件／漏斗／留存／路徑／歸因分析頁「存為看板卡片」）：存查詢本身，不存結果；擁有者或 admin
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCardCreate' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /v1/dashboards/{id}/cards/{card_id}:
    delete:
      tags: [Dashboards]
      summary: 移除卡片（擁有者或 admin）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: card_id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deleted } }
  /v1/dashboards/{id}/cards/{card_id}/data:
    post:
      tags: [Dashboards]
      summary: 執行卡片查詢：以「查看者」身分套策略（行級、遮罩、K 匿名、預算）後回該分析類型的結果；可帶 time 覆寫看板期間；審計 query.executed（module=dashboard）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: card_id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { time: { type: object, description: '覆寫卡片查詢的 time（from／to）' } } } } } }
      responses:
        '200': { description: 'events／funnel／retention／path／attribution 的結果物件（與 /v1/analytics/* 相同）', content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { description: 查看者沒有該分析模組的 use 權限 }
  /v1/dashboards/{id}/explain:
    post:
      tags: [Dashboards]
      summary: 看板解讀（規則式，不用 LLM）：以檢視者身分重算每張卡，做趨勢／上期對比／最大跌幅步驟／最新同期群等摘要 → 三句總結 + 每卡一行 + warnings；只讀；審計 dashboard.explained。AI 閘道啟用後改由 MCP dashboard.explain 產生自然語言版本
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { time: { type: object } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardExplain' } } } }
  /v1/dashboards/{id}/render:
    post:
      tags: [Dashboards]
      summary: 產生單檔 HTML 看板（伺服器以「產生者」身分重算每張卡、inline SVG、無外部資源、無明細／SQL；套遮罩與 K 匿名；浮水印：產生者、時間、到期、受眾；含 L3 分組的卡片不納入）。需 overview.use；審計 dashboard.rendered
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { audience: { type: string, description: 受眾說明（例：債券部週會） }, expires_days: { type: integer, minimum: 1, maximum: 30, default: 14 }, include_explain: { type: boolean, default: true }, time: { type: object } } } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardRender' } } } }
  /v1/dashboards/{id}/renders:
    get:
      tags: [Dashboards]
      summary: 歷次 HTML 看板產物（到期後只剩紀錄；下載次數）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DashboardRender' } } } } }
  /v1/dashboards/{id}/renders/{artifact_id}:
    get:
      tags: [Dashboards]
      summary: 下載 HTML（登入且可檢視看板，或帶簽章 token 的分享連結；到期 410）；審計 dashboard.render.downloaded
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: artifact_id, in: path, required: true, schema: { type: string } }, { name: token, in: query, schema: { type: string } }]
      responses: { '200': { description: 'text/html' }, '410': { description: 已到期 } }
  /v1/dashboards/{id}/schedules:
    get:
      tags: [Dashboards]
      summary: 定時寄送設定清單（狀態 pending_approval／active／paused；最近執行）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DashboardSchedule' } } } } } }
    post:
      tags: [Dashboards]
      summary: 建立定時寄送（每日或每週某日某時，台北時間；收件人 = 角色或白名單網域信箱）→ 審批單 type=dashboard_schedule（數位經營），核可後生效；每次執行 = render + 寄信（有 SMTP 才寄，否則只產檔並記錄）；需 overview.use；審計 dashboard.schedule.created
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSchedule' } } } }
      responses: { '202': { description: pending approval } }
  /v1/dashboards/{id}/schedules/{schedule_id}:
    delete:
      tags: [Dashboards]
      summary: 刪除定時寄送（擁有者或 admin）；審計 dashboard.schedule.deleted
