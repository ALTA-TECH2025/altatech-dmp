    post: { tags: [Meta], summary: '新增維度表（指定同步任務的目標表 → 主鍵（須唯一）→ 關聯屬性 → 曝露欄位）；> 100 萬列自動改 dictionary 引擎', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DimensionTable' } } } }, responses: { '201': { description: created }, '422': { description: 主鍵不唯一或關聯屬性不存在 } } }
  /v1/meta/dimension-tables/{id}:
    get: { tags: [Meta], summary: '維度表定義', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [Meta], summary: '修改關聯條件／曝露欄位／顯示名（敏感等級只能升）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
