    post: { tags: [IAM], summary: '建立本機帳號（外包／廠商；只能持有 allowed_roles 白名單角色、強制 TOTP、到期日）；回 otpauth URI 一次；需 iam.admin；審計 iam.user.created', requestBody: { content: { application/json: { schema: { type: object, required: [username, password, roles], properties: { username: { type: string }, password: { type: string }, roles: { type: array, items: { type: string } }, name: { type: string }, email: { type: string } } } } } }, responses: { '201': { description: created }, '501': { description: 此環境未啟用本機帳號 } } }
  /v1/iam/users/{id}:
