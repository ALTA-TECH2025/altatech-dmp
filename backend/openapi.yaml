openapi: 3.1.0
info:
  title: AltaTech DMP API
  version: 0.1.0
  description: 人（UI）與 AI agent 共用的語意層／分析／分群／洞察 API。所有端點以 on_behalf_of 身份套權限。
servers:
  - url: https://dmp.internal/api
security: [{ bearerAuth: [] }]
tags:
  - { name: Ingest }
  - { name: Semantic }
  - { name: Analytics }
  - { name: Dashboards }
  - { name: Profile }
  - { name: OneID }
  - { name: Segments }
  - { name: Triggers }
  - { name: Insights }
  - { name: Agents }
  - { name: Governance }
  - { name: IAM }
  - { name: Sync }
  - { name: Activation }
  - { name: Integration }
  - { name: Meta }
  - { name: Ops }
  - { name: Migration }
paths:
  /v1/events:
    post:
      tags: [Ingest]
      summary: 寫入事件（舊平台相容超集）
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
      responses: { '202': { description: accepted } }
  /v1/semantic/metrics:
    get: { tags: [Semantic], summary: '指標目錄', responses: { '200': { description: ok } } }
  /v1/semantic/events:
    get: { tags: [Semantic], summary: '事件字典', responses: { '200': { description: ok } } }
  /v1/semantic/dimensions:
    get: { tags: [Semantic], summary: '維度目錄', responses: { '200': { description: ok } } }
  /v1/semantic/compile:
    post:
      tags: [Semantic]
      summary: 語意查詢 → SQL（dry-run，含成本與血緣）
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CompiledQuery' } } } } }
  /v1/analytics/events:
    post: { tags: [Analytics], summary: '事件分析', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SemanticQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsResult' } } } } } }
  /v1/analytics/funnel:
    post: { tags: [Analytics], summary: '漏斗分析：2–10 步（每步事件 + 篩選）、窗口 1 分鐘–90 天、寬鬆／嚴格順序、關聯屬性（業務 ID 串流程）、用戶數／次數口徑、單維分組、趨勢；回每步人數、相對上一步與第一步轉換率；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/FunnelQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/FunnelResult' } } } } } }
  /v1/semantic/catalog:
    get: { tags: [Semantic], summary: '語意目錄（給查詢建構器）：事件字典、維度、用戶屬性（可篩選／可分組）、聚合與運算子清單；依身分過濾 L3 以上欄位', responses: { '200': { description: ok } } }
  /v1/analytics/retention:
    post: { tags: [Analytics], summary: '留存分析：初始行為與回訪行為各自可選事件與篩選；四模型（date 第 N 期當期回訪、interval N 期內任一期、continuous 連續 N 期、churn 第 N 期起不再回訪）；日／週／月、期數、含當期、單維分組（取初始事件）；回每個同期群 × 期的人數、留存人數、比例；K 匿名抑制', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RetentionQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RetentionResult' } } } } } }
  /v1/analytics/path:
    post: { tags: [Analytics], summary: '行為路徑（起點或終點事件、之後／之前 1–10 步、會話切割、節點拆分與合併、離開節點；預設抽樣 1/10；Top N 路徑 + 桑基節點／連線；K 匿名）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PathQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PathResult' } } } } } }
  /v1/analytics/interval:
    post: { tags: [Analytics], summary: '間隔', responses: { '200': { description: ok } } }
  /v1/analytics/distribution:
    post: { tags: [Analytics], summary: '分布', responses: { '200': { description: ok } } }
  /v1/analytics/attribution:
    post: { tags: [Analytics], summary: '歸因（轉化目標 × 待歸因觸點；首次／末次／線性／位置／時間衰減／自訂權重，可多模型同時比較；回溯窗口 1–90 天；觸點可依維度拆分；K 匿名）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AttributionQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AttributionResult' } } } } } }
  /v1/analytics/ltv:
    post: { tags: [Analytics], summary: 'LTV', responses: { '200': { description: ok } } }
  /v1/analytics/session:
    post: { tags: [Analytics], summary: 'Session', responses: { '200': { description: ok } } }
  /v1/users/estimate:
    post: { tags: [Users], summary: '用戶列表人數預估（條件 → 各自 Bitmap 交併差 → bitmapCardinality；精確、< 1 s）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersQuery' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersEstimate' } } } }, '400': { description: 條件不合法 }, '403': { description: users.use 未授權 } } }
  /v1/users/list:
    post: { tags: [Users], summary: '用戶列表分頁（keyset 游標；每頁 ≤ 500；最多瀏覽 100,000 筆，之後請走匯出審批；欄位依角色遮罩）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UsersListRequest' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersListResult' } } } } } }
  /v1/profiles/{one_id}:
    get: { tags: [Profile], summary: '畫像（用戶細查第一頁：用戶屬性脫敏、近 30 天事件摘要、所屬分群；需 reason，審計 profile.viewed；範圍外回 404）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string, minLength: 4, maxLength: 200 } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '403': { description: profile.use 未授權或缺 reason }, '404': { description: 不存在或不在資料範圍 } } }
  /v1/profiles/{one_id}/timeline:
    get: { tags: [Profile], summary: '行為序列（用戶細查，需 reason；時間倒序 keyset 分頁；金額等欄位依角色遮罩；props 去除 L4 鍵）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: events, in: query, schema: { type: string }, description: 逗號分隔的事件名 }, { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }, { name: cursor, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineResult' } } } } } }
  /v1/profiles/{one_id}/identities:
    get: { tags: [Profile], summary: '身分圖（id_edges：節點 = ID 類型 × 遮罩後的值；邊 = 來源、證據事件、信心、狀態、首末次；需 reason）', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }, { name: reason, in: query, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityGraph' } } } } } }
  /v1/oneid/resolve:
    get: { tags: [OneID], summary: '解析 ID → one_id（接入時歸戶規則見 docs/19；一個 ID 只屬一個用戶）', parameters: [{ name: type, in: query, schema: { type: string } }, { name: value, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/bind:
    post: { tags: [OneID], summary: '綁定指令（CRM 主檔 {login_id, account_no} 等；等同一條共現資料，套同一套歸戶規則）', responses: { '200': { description: ok } } }
  /v1/oneid/unbind:
    post: { tags: [OneID], summary: '解綁（login_id 不可解綁；審計 oneid.unbound）', responses: { '200': { description: ok }, '409': { description: 不可解綁 } } }
  /v1/oneid/merge:
    post: { tags: [OneID], summary: '人工合併兩個用戶（唯一會改寫事件 one_id 的操作；由資訊管理發起、系統管理員審批）', responses: { '202': { description: pending_approval } } }
  /v1/oneid/{one_id}/history:
    get: { tags: [OneID], summary: '綁定／改綁／升級／衝突歷史', parameters: [{ name: one_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/oneid/backfills:
    get: { tags: [OneID], summary: '登入改寫批次（近 7 天匿名事件改寫到登入客戶；docs/19 §2.5）：待套用／已套用、筆數、視窗', responses: { '200': { description: ok } } }
  /v1/oneid/erase:
    post: { tags: [OneID], summary: 'DSAR 刪除', responses: { '202': { description: accepted } } }
  /v1/approvals:
    get: { tags: [Approvals], summary: '審批單（待我審批 = 類型的審批角色含我的角色；我的申請 = 我發起的；admin 全看）', parameters: [{ name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, expired] } }, { name: type, in: query, schema: { type: string } }, { name: scope, in: query, schema: { type: string, enum: [to_me, mine, all], default: to_me } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Approval' } } } } } } }
  /v1/approvals/{id}:
    get: { tags: [Approvals], summary: '審批單詳情', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } } } }
  /v1/approvals/{id}/decide:
    post: { tags: [Approvals], summary: '核可／退回（審批角色依類型：匯出與分群 = 數位經營；L3 揭露 = admin；不能審自己的申請；審計 approval.decided 並回寫受控物件）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { approve: { type: boolean, default: true }, note: { type: string } } } } } }, responses: { '200': { description: ok }, '409': { description: 不在待審批 } } }
  /v1/exports:
    get: { tags: [Exports], summary: '匯出申請（我的；admin／數位經營全看）', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Export' } } } } } } }
    post: { tags: [Exports], summary: '申請匯出用戶列表或分群成員（需 users.export；附用途、保存天數；先估列數，上限 100,000；建立審批單給數位經營；審計 export.requested）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }, '400': { description: 列數超過上限或條件不合法 }, '403': { description: 無 users.export } } }
  /v1/exports/{id}:
    get: { tags: [Exports], summary: '匯出申請詳情', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } } } }
  /v1/exports/{id}/run:
    post: { tags: [Exports], summary: '核可後產生檔案（申請者本人；匯出遮罩比 UI 嚴一級：L2 區間化、L3 尾碼；每列帶浮水印欄、檔頭帶申請單號／使用者／時間；審計 export.generated）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }, '409': { description: 未核可或已過期 } } }
  /v1/exports/{id}/download:
    get: { tags: [Exports], summary: '下載 CSV（申請者本人；核可後 7 天內；審計 export.downloaded）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { text/csv: { schema: { type: string } } } }, '409': { description: 尚未產生或已過期 } } }
  /v1/exports/tasks:
    get: { tags: [Exports], summary: '資料輸出任務清單（名稱、類型、輸出內容、目的地、狀態、上次執行）；需 integration.view；我的＋分享給我角色的', parameters: [{ name: status, in: query, schema: { type: string } }, { name: type, in: query, schema: { type: string, enum: [realtime, once, daily] } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OutputTask' } } } } } } }
    post:
      tags: [Exports]
      summary: 建立資料輸出任務（對齊「數據輸出」：任務類型 × 輸出內容 × 目的地 × 內容選擇 × 格式）。需 integration.view；輸出事件明細另需 events.export、用戶寬表／分群名單另需 users.export（數據分析、數位經營；資訊管理只能看任務）。建立即開審批單（type=output_task → 數位經營；目的地首次使用另需系統管理員），核可前狀態 pending_approval。L3／L4 欄位不可選（422）；L2 數值依匯出規則區間化；每列帶浮水印欄 _wm；單次執行列數上限 limits.output_rows_per_run（預設 10,000,000）。審計 output_task.created
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OutputTaskCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/OutputTask' } } } }, '422': { description: 欄位含 L3／L4、事件不在字典、目的地類型與任務類型不合（realtime 只接 kafka／webhook）、格式不支援 } }
  /v1/exports/tasks/preview:
    post: { tags: [Exports], summary: '建立前預覽：套遮罩後的欄位清單（哪些被區間化／拒絕）、估算列數與掃描量、最多 20 列樣本（依申請者權限遮罩）；不落地、不送目的地；審計 output_task.previewed', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OutputTaskCreate' } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OutputPreview' } } } } } }
  /v1/exports/tasks/{id}:
    get: { tags: [Exports], summary: '任務詳情（含最近 20 次執行）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OutputTask' } } } } } }
    put: { tags: [Exports], summary: '編輯任務（名稱、排程、結束日、格式、內容選擇；改輸出內容或目的地視同新任務，重走審批）；審計 output_task.updated', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OutputTaskCreate' } } } }, responses: { '200': { description: ok } } }
    delete: { tags: [Exports], summary: '刪除任務（已有執行紀錄的保留紀錄，狀態改 deleted；審計 output_task.deleted）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/exports/tasks/{id}/run:
    post: { tags: [Exports], summary: '立即執行一次（once：整段期間；daily：指定 partition_date，預設昨天；realtime 不適用）；需任務 active 或 approved；執行前重驗目的地啟用中且（首次使用）系統管理員核可仍對應目前設定，否則記 skipped 並回 409；排程以擁有者現在的有效角色執行（撤權／到期即停）；回執行摘要；審計 output_task.run／run_skipped／run_failed', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { partition_date: { type: string, format: date } } } } } }, responses: { '202': { description: accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OutputRun' } } } }, '409': { description: 任務未核可、已暫停或已結束 } } }
  /v1/exports/tasks/{id}/pause:
    post: { tags: [Exports], summary: '暫停／恢復（daily 暫停期間不排程、realtime 停止寫入；恢復後不補跑，缺的分區用 run 指定 partition_date 補）；審計 output_task.paused／resumed', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/exports/tasks/{id}/runs:
    get: { tags: [Exports], summary: '執行紀錄（分區日、觸發方式、列數、位元組、檔案清單與校驗碼、狀態、錯誤、重試）；realtime 任務回每分鐘彙總', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OutputRun' } } } } } } }
  /v1/reveals:
    get: { tags: [Approvals], summary: '揭露申請（我的；admin／數位經營全看）；active = 核可且未到期', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reveal' } } } } } } }
    post: { tags: [Approvals], summary: '申請揭露遮罩欄位（masking.yaml 的欄位；L3 由 admin 審批、L2 由數位經營；理由必填；時效預設 24 小時）；核可後該欄位在時效內對申請者明文，每次查看寫審計 mask.revealed', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RevealRequest' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Reveal' } } } }, '400': { description: 欄位不在遮罩表或本來就明文 } } }
  /v1/bookmarks:
    get:
      tags: [Dashboards]
      summary: 書籤清單（舊平台「書籤」對應）：分析頁查詢存成可重用的書籤；我建立的 + 分享給我的角色或我的（admin 全看）；可依 kind 篩選；附被幾個看板引用
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [events, funnel, retention, path, attribution] } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bookmark' } } } } } }
    post:
      tags: [Dashboards]
      summary: 存為書籤（需該分析模組 use；以建立者身分先編譯一次）；可同時 add_to 一或多個看板（擁有者或 admin 的看板）；審計 bookmark.created
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BookmarkCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Bookmark' } } } } }
  /v1/bookmarks/{id}:
    get: { tags: [Dashboards], summary: 書籤詳情（查詢本體；分析頁「開啟書籤」用）, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    put: { tags: [Dashboards], summary: 更新名稱、說明、分享、圖型；query 可更新（以更新者身分重新編譯）→ 引用它的看板卡片同步更新；擁有者或 admin；審計 bookmark.updated, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [Dashboards], summary: 刪除書籤；引用它的看板卡片保留當時的查詢快照（卡片標示「書籤已刪除」）；審計 bookmark.deleted, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/bookmarks/{id}/data:
    post:
      tags: [Dashboards]
      summary: 以檢視者身分執行書籤查詢（可帶 time 覆寫）；審計 query.executed（module=bookmark）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { time: { type: object } } } } } }
      responses: { '200': { description: 該分析類型的結果物件 } }
  /v1/dashboards:
    get:
      tags: [Dashboards]
      summary: 看板清單：我建立的 + 分享給我的角色或我的（admin 全看）；卡片數、擁有者、更新時間
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dashboard' } } } } }
    post:
      tags: [Dashboards]
      summary: 建立看板（需 overview.use）；擁有者 = 建立者；可同時帶卡片
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCreate' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /v1/dashboards/{id}:
    get:
      tags: [Dashboards]
      summary: 看板詳情（含卡片定義，不含資料）；非擁有者且未分享 → 404
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
    put:
      tags: [Dashboards]
      summary: 更新名稱、描述、分享對象、卡片順序與寬度（擁有者或 admin）；審計 dashboard.updated
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCreate' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
    delete:
      tags: [Dashboards]
      summary: 刪除看板（擁有者或 admin）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deleted } }
  /v1/dashboards/{id}/cards:
    post:
      tags: [Dashboards]
      summary: 加一張卡片（從事件／漏斗／留存／路徑／歸因分析頁「存為看板卡片」）：存查詢本身，不存結果；擁有者或 admin
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardCardCreate' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /v1/dashboards/{id}/cards/{card_id}:
    delete:
      tags: [Dashboards]
      summary: 移除卡片（擁有者或 admin）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: card_id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deleted } }
  /v1/dashboards/{id}/cards/{card_id}/data:
    post:
      tags: [Dashboards]
      summary: 執行卡片查詢：以「查看者」身分套策略（行級、遮罩、K 匿名、預算）後回該分析類型的結果；可帶 time 覆寫看板期間；審計 query.executed（module=dashboard）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: card_id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { time: { type: object, description: '覆寫卡片查詢的 time（from／to）' } } } } } }
      responses:
        '200': { description: 'events／funnel／retention／path／attribution 的結果物件（與 /v1/analytics/* 相同）', content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { description: 查看者沒有該分析模組的 use 權限 }
  /v1/analytics/ask:
    post:
      tags: [Dashboards]
      summary: 問數 → 卡片草稿（不存）：一句話（可多句）→ 在既有五種分析模型與語意層目錄上做選擇（不生成任意 SQL）→ 每張草稿以當事人身分乾跑編譯 → 回卡片（title、kind、query、chart、confidence、explanation、sql_preview、warnings）與候選（對不上的事件／指標）。解析器：rules（內建關鍵字規則，離線可用）或 llm（設了 DMP_LLM_API_KEY_REF 才啟用，走企業 LLM Gateway 或 Claude API，結構化輸出同一份 schema）。需 ai_ask.use；審計 dashboard.asked
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AskRequest' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AskResponse' } } } }
        '422': { description: 問題無法映射到任何分析模型（回 candidates） }
  /v1/analytics/ask/status:
    get: { tags: [Dashboards], summary: 問數可用狀態：parsers（rules 永遠可用；llm 需金鑰）、模型、範例問題, responses: { '200': { description: ok } } }
  /v1/dashboards/{id}/ask:
    post:
      tags: [Dashboards]
      summary: 同 /v1/analytics/ask，但時間預設用看板的「最近 N 天」，且回應附 dashboard；確認後用 POST /cards 或 /v1/bookmarks 存
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AskRequest' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AskResponse' } } } } }
  /v1/dashboards/{id}/explain:
    post:
      tags: [Dashboards]
      summary: 看板解讀：以檢視者身分重算每張卡，規則產生趨勢／上期對比／最大跌幅步驟／最新同期群等事實 → 三句總結 + 每卡一行 + warnings；mode=llm（設了 DMP_LLM_API_KEY_REF）時再把這些事實交給模型寫成敘述（narrative，只讀、不看明細列）；只讀；審計 dashboard.explained
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { time: { type: object }, mode: { type: string, enum: [rules, llm], default: rules } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardExplain' } } } }
  /v1/dashboards/{id}/render:
    post:
      tags: [Dashboards]
      summary: 產生單檔 HTML 看板（伺服器以「產生者」身分重算每張卡、inline SVG、無外部資源、無明細／SQL；套遮罩與 K 匿名；浮水印：產生者、時間、到期、受眾；含 L3 分組的卡片不納入）。需 overview.use；審計 dashboard.rendered
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { audience: { type: string, description: 受眾說明（例：債券部週會） }, expires_days: { type: integer, minimum: 1, maximum: 30, default: 14 }, include_explain: { type: boolean, default: true }, time: { type: object } } } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardRender' } } } }
  /v1/dashboards/{id}/renders:
    get:
      tags: [Dashboards]
      summary: 歷次 HTML 看板產物（到期後只剩紀錄；下載次數）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DashboardRender' } } } } }
  /v1/dashboards/{id}/renders/{artifact_id}:
    get:
      tags: [Dashboards]
      summary: 下載 HTML（登入且可檢視看板，或帶簽章 token 的分享連結；到期 410）；審計 dashboard.render.downloaded
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: artifact_id, in: path, required: true, schema: { type: string } }, { name: token, in: query, schema: { type: string } }]
      responses: { '200': { description: 'text/html' }, '410': { description: 已到期 } }
  /v1/dashboards/{id}/schedules:
    get:
      tags: [Dashboards]
      summary: 定時寄送設定清單（狀態 pending_approval／active／paused；最近執行）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DashboardSchedule' } } } } } }
    post:
      tags: [Dashboards]
      summary: 建立定時寄送（每日或每週某日某時，台北時間；收件人 = 角色或白名單網域信箱）→ 審批單 type=dashboard_schedule（數位經營），核可後生效；每次執行 = render + 寄信（有 SMTP 才寄，否則只產檔並記錄）；需 overview.use；審計 dashboard.schedule.created
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSchedule' } } } }
      responses: { '202': { description: pending approval } }
  /v1/dashboards/{id}/schedules/{schedule_id}:
    delete:
      tags: [Dashboards]
      summary: 刪除定時寄送（擁有者或 admin）；審計 dashboard.schedule.deleted
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: schedule_id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: deleted } }
  /v1/dashboards/{id}/schedules/{schedule_id}/run:
    post:
      tags: [Dashboards]
      summary: 立即執行一次（擁有者或 admin；須已核可）；回產物與寄送結果
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: schedule_id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok } }
  /v1/segments:
    get: { tags: [Segments], summary: '列出分群（q 搜尋、status、kind；回收站用 status=recycled）', parameters: [{ name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: kind, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Segment' } } } } } } }
    post: { tags: [Segments], summary: '建立分群（規則 = UsersQuery；行銷與 agent 提議者為 pending_approval，數據分析／數位經營／admin 直接 active；每專案 ≤ 500）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '400': { description: 規則不合法 }, '409': { description: 名稱重複或超過上限 } } }
  /v1/segments/{id}/preview:
    post: { tags: [Segments], summary: '預估人數（Bitmap 基數，精確）與畫像（生命週期／價值分級／資產區間／分公司分布）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentPreview' } } } } } }
  /v1/segments/{id}:
    get: { tags: [Segments], summary: '分群詳情（基礎資訊、規則、最新版本、更新方式、存儲設定）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } } } }
    put: { tags: [Segments], summary: '編輯分群（結果保存分群不可改規則；手動分群不可改更新方式；例行分群可改時間範圍與最早計算時間，不可改頻率；改規則後需重新計算）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCreate' } } } }, responses: { '200': { description: ok }, '409': { description: 不可變更的欄位 } } }
  /v1/segments/{id}/approve:
    post: { tags: [Segments], summary: '審批（數位經營／admin；approve=false 退回 draft 並附 note）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { approve: { type: boolean, default: true }, note: { type: string } } } } } }, responses: { '200': { description: ok }, '409': { description: 不在待審批狀態 } } }
  /v1/segments/{id}/versions:
    get: { tags: [Segments], summary: '歷史版本（basetime、人數、計算狀態；可下鑽用戶、另存新分群、下載）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SegmentVersion' } } } } } } }
  /v1/segments/{id}/versions/{basetime}/members:
    get: { tags: [Segments], summary: '某版本的用戶列表（與 /v1/users/list 同形：columns／sort／page_size／cursor；欄位依角色遮罩；下載需審批與浮水印）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: basetime, in: path, required: true, schema: { type: string, description: 'YYYY-MM-DD 或 latest' } }, { name: page_size, in: query, schema: { type: integer } }, { name: cursor, in: query, schema: { type: string } }, { name: columns, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UsersListResult' } } } } } }
  /v1/segments/{id}/compute:
    post: { tags: [Segments], summary: '手動更新（basetime = 今日 00:00；手動分群只留 1 版，例行分群留 keep 版）；最小版同步計算並回版本紀錄，正式環境排進 Airflow', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { basetime: { type: string, description: '例行分群回溯用 YYYY-MM-DD' } } } } } }, responses: { '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentVersion' } } } }, '409': { description: 未生效（待審批／回收站） } } }
  /v1/segments/tick:
    post: { tags: [Segments], summary: '例行分群排程（排程器每分鐘呼叫；admin）：到期且當日未算的 active 例行分群依序計算，回執行清單', responses: { '200': { description: ok } } }
  /v1/segments/{id}/pause:
    post: { tags: [Segments], summary: '暫停／啟動例行分群', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/copy:
    post: { tags: [Segments], summary: '複製規則建立新分群', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '201': { description: created } } }
  /v1/segments/{id}/lineage:
    get: { tags: [Segments], summary: '血緣關係（上游標籤／分群／事件／屬性；下游推送、規則、分析）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/recycle:
    post: { tags: [Segments], summary: '移入回收站（有下游依賴時回 409 需確認；支援批量）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '409': { description: has_dependents } } }
  /v1/segments/{id}/restore:
    post: { tags: [Segments], summary: '從回收站恢復', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/segments/{id}/purge:
    delete: { tags: [Segments], summary: '徹底刪除（系統管理員；不可恢復；回收站保留天數到期自動執行）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/segments/estimate:
    post: { tags: [Segments], summary: '規則預估人數（預設 1/16 抽樣，比例可後台配置）', responses: { '200': { description: ok } } }
  /v1/segments/imports:
    post: { tags: [Segments], summary: '導入名單（第一步）：上傳客戶代碼或 one_id 清單（前端讀 txt／csv，一列一個；≤ 200,000）。客戶代碼以與舊平台登入 ID 相同的金鑰（token_v1）轉成 one_id，原始代碼不落地；只存 one_id 於 dmp.segment_imports。回總數、去重後數、對到用戶表的人數與未對到數，再以 kind=import 建分群（第二步）；需 segments.use；審計 segment.import.created（只記數量）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SegmentImportCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentImport' } } } }, '400': { description: 空清單、超過上限或 id_type 不支援 }, '503': { description: 未連接 ClickHouse 或未設定 token 金鑰 } } }
  /v1/segments/imports/{id}:
    get: { tags: [Segments], summary: '導入名單摘要（不回名單本身）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentImport' } } } }, '404': { description: 不存在 } } }
  /v1/tags:
    get: { tags: [Segments], summary: '標籤目錄（第一階段：分群對應值／SQL 兩種建立方式；含最新版本人數與分布）', parameters: [{ name: status, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tag' } } } } } } }
    post: { tags: [Segments], summary: '建立標籤（行銷建立需數位經營審批；數據分析／數位經營／系統管理員直接生效；建立後可立即計算）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TagCreate' } } } }, responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Tag' } } } } } }
  /v1/tags/{id}:
    get: { tags: [Segments], summary: '標籤詳情（基礎資訊、所屬目錄、創建方式、規則、更新方式、存儲、審批、自定義欄位）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    put: { tags: [Segments], summary: '編輯標籤（基礎資訊、規則或重新上傳、存儲設定；留變更記錄）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/distribution:
    get: { tags: [Segments], summary: '標籤值分布（最新可用版本或指定 basetime；經數據權限過濾；排序與顯示數量）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: basetime, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/versions:
    get: { tags: [Segments], summary: '歷史詳情（每個計算結果的分布與人數）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/lineage:
    get: { tags: [Segments], summary: '血緣（含某計算結果依賴的上游 basetime）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/pause:
    post: { tags: [Segments], summary: '停用／啟用（有下游依賴時提醒）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/backfill:
    post: { tags: [Segments], summary: '回溯指定 basetime 區間重算；終止計算用 DELETE /v1/tags/{id}/runs/current', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: queued } } }
  /v1/tags/{id}/approve:
    post: { tags: [Segments], summary: '審批（通過／退回／拒絕）；數位經營或系統管理員', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/recycle:
    post: { tags: [Segments], summary: '移入回收站（保留 N 天後自動徹底刪除）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/tags/{id}/compute:
    post: { tags: [Segments], summary: '立即計算一版（basetime 預設今天）：每個標籤值一個 Bitmap 寫入 dmp.user_tags；回傳版本紀錄（人數、分布、耗時）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { basetime: { type: string, format: date } } } } } }, responses: { '202': { description: computed } } }
  /v1/tags/tick:
    post: { tags: [Segments], summary: '例行標籤到點計算（正式環境由排程器每 10 分鐘呼叫；需 segments.approve）', responses: { '200': { description: ok } } }
  /v1/tags/custom-fields:
    get: { tags: [Segments], summary: '標籤自定義欄位定義（字串／日期；文字框、單選、多選、日期）', responses: { '200': { description: ok } } }
  /v1/sql/tables:
    get: { tags: [SQL], summary: '自定義 SQL 可用的數據表與欄位（依角色：events／users／user_tags／segment_members／dim_*／中間表；id_map 只給資訊管理與系統管理員；欄位標示敏感等級與是否可用：L3／L4 與 hide 策略欄位不可查詢）、函數提示、範例', responses: { '200': { description: ok } } }
  /v1/sql/query:
    post:
      tags: [SQL]
      summary: 執行 SQL（唯讀：只允許單一 SELECT／WITH；sqlglot 解析 ClickHouse 方言；DDL／DML／SETTINGS／INTO OUTFILE 拒絕；只能引用目錄內的表；涉及脫敏欄位（L3／L4／hide）直接 400；有行級範圍的自訂角色不開放；每人最多 5 條同時；max_execution_time 60 s、掃描預算；結果預覽 ≤ 1000 列；審計 query.sql）
      requestBody: { content: { application/json: { schema: { type: object, required: [sql], properties: { sql: { type: string, maxLength: 20000 }, limit: { type: integer, default: 1000, maximum: 1000 }, params: { type: object, description: '動態參數 {name: value}，以 {{name}} 代入（只允許字串／數字／日期）' }, explain: { type: boolean, default: false, description: 只解析與估算，不執行 } } } } } }
      responses: { '200': { description: '{ run_id, columns, rows, row_count, truncated, ms, scan_rows_estimate, sql_effective, warnings }' }, '400': { description: masked_field_or_non_select }, '429': { description: 超過每人同時 5 條 } }
  /v1/sql/query/{run_id}/download:
    get: { tags: [SQL], summary: '下載此次預覽結果 CSV（≤ 1000 列，浮水印、審計 sql.downloaded；需該模組 export）；大量取數請走匯出申請（/v1/exports）', parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: 'text/csv' } } }
  /v1/sql/saved:
    get: { tags: [SQL], summary: '已存查詢（我的 + 分享給我的；分組）', responses: { '200': { description: ok } } }
    post: { tags: [SQL], summary: '儲存查詢（名稱、分組、SQL、動態參數預設值、分享角色）；要放進看板請用 /v1/bookmarks（kind=sql）', responses: { '201': { description: created } } }
  /v1/sql/saved/{id}:
    put: { tags: [SQL], summary: 更新已存查詢, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [SQL], summary: 刪除已存查詢, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/sql/history:
    get: { tags: [SQL], summary: '查詢記錄（本人最近 100 條、30 天內；狀態、列數、耗時、錯誤）', responses: { '200': { description: ok } } }
  /v1/sql/mid-tables:
    get: { tags: [SQL], summary: '中間表清單（名稱、來源 SQL、列數、建立者、最近重算）', responses: { '200': { description: ok } } }
    post: { tags: [SQL], summary: '保存到中間表：CREATE TABLE dmp.mid_<name> AS <sql>（同樣經沙盒驗證；需 governance.admin 或 integration.admin；登記到 /v1/sql/tables；審計 sql.mid_table.created）', responses: { '201': { description: created } } }
  /v1/sql/mid-tables/{name}/refresh:
    post: { tags: [SQL], summary: 重算中間表（整表重建）, parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/sql/mid-tables/{name}:
    delete: { tags: [SQL], summary: 刪除中間表（有書籤或標籤引用時 409）, parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/triggers:
    get: { tags: [Triggers], summary: '即時規則', responses: { '200': { description: ok } } }
    post: { tags: [Triggers], summary: '建立規則', responses: { '201': { description: created } } }
  /v1/insights:
    get:
      tags: [Insights]
      summary: 洞察列表／檢索
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Insight' } } } } } }
    post: { tags: [Insights], summary: '建立洞察', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Insight' } } } }, responses: { '201': { description: created } } }
  /v1/insights/{id}/feedback:
    post: { tags: [Insights], summary: '回饋（useful / not_useful / wrong）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '201': { description: created } } }
  /v1/insights/subscriptions:
    post: { tags: [Insights], summary: '訂閱洞察', responses: { '201': { description: created } } }
  /v1/agents:
    get: { tags: [Agents], summary: 'agent 註冊表', responses: { '200': { description: ok } } }
  /v1/agents/{id}/run:
    post: { tags: [Agents], summary: '手動執行 agent', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/agents/ask:
    post:
      tags: [Agents]
      summary: 自然語言提問（on-demand agent），串流回傳計畫、工具呼叫與答案
      requestBody: { content: { application/json: { schema: { type: object, properties: { question: { type: string }, context: { type: object } }, required: [question] } } } }
      responses: { '200': { description: text/event-stream } }
  /v1/agents/runs/{run_id}:
    get: { tags: [Agents], summary: '執行紀錄（計畫、工具呼叫、成本）', parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /auth/providers:
    get: { tags: [Auth], summary: '可用的身分提供者（broker：Keycloak，AD 經 Keycloak LDAP User Federation 接入；direct：Entra ID + 本機帳號）。API 不再直連 AD', responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [broker, direct] }, providers: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, kind: { type: string, enum: [oidc, ldap] } } } } } } } } } } }
  /auth/login:
    get: { tags: [Auth], summary: '開始 OIDC 登入（授權碼 + PKCE；302 到 IdP；state 綁 dmp_login cookie）', parameters: [{ name: provider, in: query, required: true, schema: { type: string } }, { name: return_to, in: query, schema: { type: string, description: 只接受站內路徑 } }], responses: { '302': { description: 轉向 IdP } } }
  /auth/callback:
    get: { tags: [Auth], summary: 'IdP 回呼：換 token、驗 ID token（JWKS／iss／aud／nonce／amr／tid）、群組對應角色、建立 session（Set-Cookie dmp_sid HttpOnly + dmp_csrf）；無角色轉 /no-access；審計 auth.login.*', parameters: [{ name: code, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }], responses: { '302': { description: 轉向 return_to }, '401': { description: 驗證失敗 } } }
  /auth/ldap:
    post: { tags: [Auth], summary: '本機帳號登入（direct 模式）：provider=local（scrypt 密碼 + TOTP；外包／單機環境用）；AD 帳號一律走 Keycloak（/auth/login?provider=keycloak），本端點不接受 provider=ad；第一步回 next=totp，第二步帶 totp 驗證；速率限制與鎖定；審計', requestBody: { content: { application/json: { schema: { type: object, required: [username, password], properties: { provider: { type: string, enum: [local], default: local }, username: { type: string }, password: { type: string }, totp: { type: string } } } } } }, responses: { '200': { description: ok 或 next=totp }, '401': { description: 帳號或密碼錯誤 } } }
  /auth/step-up:
    post: { tags: [Auth], summary: 'admin step-up：session 超過 15 分鐘後再驗一次 TOTP 延展 admin 權限（只對 provider=local 或其他有 TOTP 驗證能力的提供者）；需 X-CSRF-Token；審計 auth.step_up', requestBody: { content: { application/json: { schema: { type: object, required: [totp], properties: { totp: { type: string } } } } } }, responses: { '200': { description: ok（含目前有效角色） }, '401': { description: 驗證碼錯誤 }, '400': { description: 此登入方式不支援 } } }
  /auth/logout:
    post: { tags: [Auth], summary: '登出：刪 session、清 cookie；回 IdP end_session 網址供前端跳轉（RP-initiated logout）；需 X-CSRF-Token', responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, idp_logout: { type: string, nullable: true } } } } } } } }
  /auth/token:
    post: { tags: [Auth], summary: '以 session 換短效 API token（RS256，15 分鐘，roles claim）給 MCP／排程／CLI；審計 auth.token.issued', responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, token_type: { type: string }, expires_in: { type: integer } } } } } } } }
  /v1/iam/me:
    get: { tags: [IAM], summary: '目前身分：使用者、角色（active 標記）、模組權限聯集、欄位遮罩（最嚴格）、範圍、session（idp_mode／amr／step_up_needed／csrf_header）；前端啟動資料', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }, '401': { description: 未登入 } } }
  /v1/iam/sessions:
    get: { tags: [IAM], summary: 'session 清單：預設本人；scope=all 列全平台（需 iam.admin；含使用者、身分來源、角色、建立、最近活動、IP 遮罩）', parameters: [{ name: scope, in: query, schema: { type: string, enum: [me, all], default: me } }], responses: { '200': { description: ok } } }
  /v1/iam/sessions/{sid}:
    delete: { tags: [IAM], summary: '強制登出一個 session（sid 前 8 碼；本人的任一個，或 iam.admin 對任何人）；審計 auth.session.revoked', parameters: [{ name: sid, in: path, required: true, schema: { type: string } }], responses: { '204': { description: revoked } } }
  /v1/iam/users:
    get: { tags: [IAM], summary: '成員目錄（舊平台「成員管理」對應）：把登入審計（SSO 使用者）、本機帳號與本地指派合併成一張表：身分、來源、角色、狀態（啟用／停用／鎖定／到期／未登入）、最近登入、失敗登入、有效 session 數、指派數；需 iam.view', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } } }
    post: { tags: [IAM], summary: '建立本機帳號（外包／廠商；只能持有 allowed_roles 白名單角色、強制 TOTP、到期日）；回 otpauth URI 一次；需 iam.admin；審計 iam.user.created', requestBody: { content: { application/json: { schema: { type: object, required: [username, password, roles], properties: { username: { type: string }, password: { type: string }, roles: { type: array, items: { type: string } }, name: { type: string }, email: { type: string } } } } } }, responses: { '201': { description: created }, '501': { description: 此環境未啟用本機帳號 } } }
  /v1/iam/users/{id}:
    get: { tags: [IAM], summary: '成員詳情：指派、有效 session、最近 50 筆審計', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [IAM], summary: '本機帳號：停用／啟用、名稱、信箱、角色（白名單內）；需 iam.admin；審計 iam.user.changed', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [IAM], summary: '刪除本機帳號（同時撤銷其 session 與本地指派）；需 iam.admin；審計 iam.user.deleted', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/iam/users/{id}/reset-password:
    post: { tags: [IAM], summary: '重設本機帳號密碼（延展到期日、解鎖）；需 iam.admin；審計 iam.user.password_reset', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/iam/users/{id}/reset-totp:
    post: { tags: [IAM], summary: '重設本機帳號 TOTP（回新的 otpauth URI 一次）；需 iam.admin；審計 iam.user.totp_reset', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/iam/changes:
    get: { tags: [IAM], summary: '權限變更審核：自訂角色變更（role_change）與臨時提權（break_glass）的審批單與前後快照；需 iam.view', parameters: [{ name: status, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/iam/roles:
    get: { tags: [IAM], summary: '角色列表（內建 + 自訂，含模組權限矩陣與範圍）', responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } } }
    post: { tags: [IAM], summary: '建立自訂角色（需 iam.admin）。rbac.yaml custom_roles.second_review 開啟時不直接生效：回 202 與審批單（type=role_change，另一位系統管理員或數位經營核可後才寫入並審計 role.changed）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }, responses: { '201': { description: created } } }
  /v1/iam/roles/{key}:
    put: { tags: [IAM], summary: '更新角色名稱、說明、範圍、權限勾選（雙人複核開啟時回 202 審批單，附變更前後快照）', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }, responses: { '200': { description: ok } } }
    delete: { tags: [IAM], summary: '刪除角色（系統管理員；admin 角色本身不可刪；仍有指派時需帶 reassign_to 改派，否則 409；審計 role.deleted，雙人複核）', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/iam/roles/{key}/copy:
    post: { tags: [IAM], summary: '複製角色為新草稿', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], responses: { '201': { description: created } } }
  /v1/iam/assignments:
    get: { tags: [IAM], summary: '使用者指派清單（角色、數據範圍、到期、SSO 群組、最近登入；臨時提權標記）', responses: { '200': { description: ok } } }
    post: { tags: [IAM], summary: '指派角色給使用者（多角色；範圍：組織樹節點／營業員客戶／專案／分群限制／回溯天數；到期日；需 iam.admin；審計 iam.assignment.created）。break_glass=true（臨時提權 admin，hours ≤ 4）不直接生效：回 202 審批單 type=break_glass，由申請者之外的系統管理員或數位經營核可後建立到期指派', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }, responses: { '201': { description: created } } }
  /v1/iam/assignments/{id}:
    patch: { tags: [IAM], summary: '修改範圍／到期', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [IAM], summary: '撤銷（含臨時提權）；審計 iam.assignment.revoked', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: revoked } } }
  /v1/iam/scope/simulate:
    post: { tags: [IAM], summary: '行級規則模擬：給角色＋範圍，回查詢編譯器會加的 WHERE 與遮罩欄位（UI／API／agent 共用）', requestBody: { content: { application/json: { schema: { type: object, properties: { role: { type: string }, scope: { type: object } } } } } }, responses: { '200': { description: ok } } }
  /v1/sync/tags:
    get:
      tags: [Sync]
      summary: 單一客戶的全部標籤值（Valkey 快取，< 10 ms；代碼化 ID；依目標系統合約套隱碼）
      parameters: [{ name: one_id, in: query, schema: { type: string } }, { name: customer_code, in: query, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TagSnapshot' } } } } }
  /v1/sync/tags/changes:
    get:
      tags: [Sync]
      summary: 標籤變更增量（日批後比對前一版本；分頁拉取；大量同步請用 Kafka dmp.tag_updates 或 GCS Parquet）
      parameters: [{ name: since, in: query, required: true, schema: { type: string, format: date-time } }, { name: tag_ids, in: query, schema: { type: string } }, { name: page_token, in: query, schema: { type: string } }, { name: page_size, in: query, schema: { type: integer, default: 10000, maximum: 10000 } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TagChange' } }, next_page_token: { type: string } } } } } } }
  /v1/sync/segments/{id}/members:
    get: { tags: [Sync], summary: '分群成員（分頁；或以 export=gcs 產生 Parquet manifest）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: export, in: query, schema: { type: string, enum: [page, gcs] } }], responses: { '200': { description: ok } } }
  /v1/sync/exports:
    post: { tags: [Sync], summary: '觸發批次匯出（全量／增量 Parquet 到 GCS dmp-sync，含 manifest 與 checksum；寫審計 sync.delivered）', responses: { '202': { description: accepted } } }
  /v1/sync/subscriptions:
    get: { tags: [Sync], summary: '下游訂閱清單（Kafka consumer group、Webhook、GCS），含最後同步時間與落後量', responses: { '200': { description: ok } } }
  /v1/meta/events:
    get: { tags: [Meta], summary: '事件字典（含狀態 live/draft/quarantine/deprecated、屬性、負責人、日均量）', parameters: [{ name: status, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }], responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '登記事件（草稿或直接上線；上線檢查：命名、負責人、屬性型別與敏感等級、無 L4；需 governance.d；審計 meta.event.published）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MetaEvent' } } } }, responses: { '201': { description: created }, '422': { description: 檢查未通過（含逐項原因） } } }
  /v1/meta/events/{name}:
    get: { tags: [Meta], summary: '事件定義（含版本歷史、使用它的模組／標籤／agent 工具）', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [Meta], summary: '修改定義；上線事件的屬性型別／敏感等級變更會建立變更單（需審批）而非直接生效', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '202': { description: 已建立變更單 } } }
  /v1/meta/events/{name}/status:
    post: { tags: [Meta], summary: '狀態轉移（draft→live、quarantine→live、live→deprecated）；改名不允許', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { to: { type: string, enum: [live, deprecated] }, reason: { type: string } } } } } }, responses: { '200': { description: ok } } }
  /v1/meta/quarantine:
    get: { tags: [Meta], summary: '隔離區：未登記事件與屬性的種類、筆數、首見時間、樣本（脫敏）；30 天未登記自動丟棄', responses: { '200': { description: ok } } }
  /v1/meta/properties:
    get: { tags: [Meta], summary: '全域屬性字典（型別、敏感等級、來源、枚舉、關聯 Item、使用事件數）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '登記屬性；L4 一律拒絕；型別只能放寬、敏感等級只能升', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MetaProperty' } } } }, responses: { '201': { description: created }, '422': { description: 拒絕（L4 或收窄型別／降級） } } }
  /v1/meta/virtual-events:
    get: { tags: [Meta], summary: '虛擬事件（多事件 OR 組合＋屬性條件，語意層展開）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '建立虛擬事件', responses: { '201': { description: created } } }
  /v1/meta/user-properties:
    get: { tags: [Meta], summary: '用戶表屬性（來源、更新頻率、敏感等級、可篩選／分組、覆蓋率）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '登記用戶屬性（來自建模映射或 profile_* 協議）；同步到 dimensions.yaml', responses: { '201': { description: created } } }
  /v1/meta/oneid/rules:
    get: { tags: [Meta], summary: 'OneID 識別類型優先序、強度與合併策略；合併／拆分統計', responses: { '200': { description: ok } } }
    put: { tags: [Meta], summary: '更新規則（需 governance.d 與稽核審批；影響標籤重算）', responses: { '200': { description: ok } } }
  /v1/meta/dimension-tables:
    get: { tags: [Meta], summary: '維度表清單（主鍵、item_type、關聯條件 events/users.<屬性> = dim.<主鍵>、來源任務、列數、欄位與敏感等級、曝露為關聯屬性的欄位）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '新增維度表（指定同步任務的目標表 → 主鍵（須唯一）→ 關聯屬性 → 曝露欄位）；> 100 萬列自動改 dictionary 引擎', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DimensionTable' } } } }, responses: { '201': { description: created }, '422': { description: 主鍵不唯一或關聯屬性不存在 } } }
  /v1/meta/dimension-tables/{id}:
    get: { tags: [Meta], summary: '維度表定義', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [Meta], summary: '修改關聯條件／曝露欄位／顯示名（敏感等級只能升）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/meta/dimension-tables/{id}/sync:
    post: { tags: [Meta], summary: '立即執行其來源同步任務（審計 dimension.sync）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/meta/dictionaries:
    get: { tags: [Meta], summary: '維度字典清單（屬性 → 值／顯示名映射，1:1 或 N:1）', responses: { '200': { description: ok } } }
  /v1/meta/dictionaries/{property}:
    put: { tags: [Meta], summary: '上傳字典（CSV 值→顯示名；mode=append|overwrite；只限文字／數值屬性；審計 dictionary.uploaded）', parameters: [{ name: property, in: path, required: true, schema: { type: string } }, { name: mode, in: query, schema: { type: string, enum: [append, overwrite], default: append } }], responses: { '200': { description: ok } } }
    get: { tags: [Meta], summary: '下載字典', parameters: [{ name: property, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/meta/templates/{kind}:
    get: { tags: [Meta], summary: '下載範本（CSV，UTF-8 BOM，Excel 直接開）：kind=events 元事件、properties 事件屬性、user-properties 用戶表屬性。filled=false（預設）只有表頭與範例列（# 開頭，匯入時略過）；filled=true 附目前內容，改完可直接上傳；需 governance.view',
           parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [events, properties, user-properties] } }, { name: filled, in: query, schema: { type: boolean, default: false } }],
           responses: { '200': { description: 'text/csv; charset=utf-8' } } }
  /v1/meta/templates/{kind}/import:
    post: { tags: [Meta], summary: '上傳範本：dry_run=true（預設）逐列預覽新增／更新／不變／錯誤，不寫入；dry_run=false 依既有規則套用（新事件建為草稿、上線事件改屬性建變更單、L4 拒絕、敏感等級只升、型別只放寬）；單次 ≤ 2,000 列、≤ 2 MB；需 governance.use；審計 meta.template.imported',
            parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [events, properties, user-properties] } }, { name: dry_run, in: query, schema: { type: boolean, default: true } }],
            requestBody: { content: { application/json: { schema: { type: object, required: [csv], properties: { csv: { type: string, description: 'CSV 全文（UTF-8，可含 BOM）' } } } } } },
            responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateImportResult' } } } }, '400': { description: 表頭不符或超過上限 } } }
  /v1/meta/virtual-properties:
    get: { tags: [Meta], summary: '虛擬屬性（表達式組合屬性與維度表欄位；查詢時計算）', responses: { '200': { description: ok } } }
    post: { tags: [Meta], summary: '建立虛擬屬性（名稱不可與既有屬性重複；表達式 ≤ 1024 字元；型別推斷與預覽）', responses: { '201': { description: created } } }
  /metrics:
    get: { tags: [Ops], summary: 'Prometheus 文字格式指標（HTTP 請求數／耗時、查詢耗時與結果（依模組）、同步任務執行與列數、來源延遲、例行作業耗時與失敗、推送交付狀態、ClickHouse 表用量）；叢集內由 ServiceMonitor 抓取，需 Bearer（DMP_METRICS_TOKEN）或 governance.view 的 session', responses: { '200': { description: 'text/plain; version=0.0.4' }, '401': { description: 未授權 } } }
  /v1/ops/pipeline:
    get: { tags: [Ops], summary: '端到端資料流：來源（同步任務：最近一次、列數、水位、延遲）→ 進倉（ClickHouse 各表列數／用量／最新事件時間）→ 服務（5 分鐘請求率、錯誤率、查詢 P95）→ 下游（推送交付 24h、暫停的目的地）；資料品質（隔離／拒絕率、K 匿名抑制）；需 governance.view', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OpsPipeline' } } } } } }
  /v1/ops/query-perf:
    get: { tags: [Ops], summary: '各模組查詢次數、P50/P95/P99、錯誤數、平均列數與 SLA 達成（第一階段以審計 query.executed／query.sql 彙總；ClickHouse 可用時加 system.query_log 的掃描列數與記憶體）；需 governance.view', parameters: [{ name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OpsQueryPerf' } } } } } }
  /v1/ops/batch-jobs:
    get: { tags: [Ops], summary: '批次作業狀態（排程器同步任務＋例行：分群／標籤例行計算、推送重試與增量、看板定時寄送）與儲存用量（ClickHouse 表、控制面）；Airflow／dbt 作業第二階段；需 governance.view', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OpsBatchJobs' } } } } } }
  /v1/ops/batch-jobs/{name}/rerun:
    post: { tags: [Ops], summary: '立即重跑同步任務（name = 同步任務 id）；需 governance.admin；審計 batch.rerun', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted }, '404': { description: 無此作業 }, '409': { description: 作業正在執行或已停用 } } }
  /v1/ops/series:
    get: { tags: [Ops], summary: '系統監控頁的時間序列：與 Grafana 看板同一組面板（backend/ops/panels.yaml；每個面板附 PromQL），由 API 每分鐘快照程序內指標與 collector 存成環形緩衝（最多 24 小時；程序重啟即清空，長期保存看 Prometheus／Grafana）；回傳 Grafana 連結設定（DMP_GRAFANA_URL）供頁面嵌入；需 governance.admin（系統管理員、資訊管理）', parameters: [{ name: hours, in: query, schema: { type: integer, enum: [1, 6, 24], default: 6 } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OpsSeries' } } } } } }
  /v1/ops/notify:
    get: { tags: [Ops], summary: '告警通知設定：Email（SMTP，收件角色＋額外收件人）、LINE 官方帳號（Messaging API push／multicast；channel access token 只存 secret_ref；收件 userId／groupId）、政策（最低嚴重度、同一告警冷卻分鐘、恢復通知）；預設值 backend/ops/notify.yaml，線上修改存控制面；需 governance.admin', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotifyConfig' } } } } } }
    put: { tags: [Ops], summary: '修改通知設定（密鑰只能是 secret_ref；LINE 收件 ID 格式 U／C／R 開頭 33 字元）；審計 ops.notify.changed；需 governance.admin', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/NotifyConfig' } } } }, responses: { '200': { description: ok }, '400': { description: 格式錯誤或密鑰明文 } } }
  /v1/ops/notify/test:
    post: { tags: [Ops], summary: '送測試通知到指定管道（email|line），回傳每個收件對象的結果；審計 ops.notify.tested；需 governance.admin', requestBody: { content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, enum: [email, line] } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }, '409': { description: 管道未啟用或未設定 } } }
  /v1/ops/notify/history:
    get: { tags: [Ops], summary: '通知紀錄（最近 N 筆：時間、管道、告警鍵、收件數、狀態、回應摘要）；需 governance.view', parameters: [{ name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } } } }
  /v1/ops/notify/alertmanager:
    post: { tags: [Ops], summary: 'Alertmanager webhook 接收端（叢集內 PrometheusRule 的告警經此走同一組 Email／LINE 管道與冷卻政策）；Bearer DMP_METRICS_TOKEN；接受 Alertmanager v4 payload（alerts[].labels.alertname/severity/key、annotations.summary、status firing|resolved）', responses: { '200': { description: ok }, '401': { description: 未授權 } } }
  /v1/ops/alerts:
    get: { tags: [Ops], summary: '告警：依 backend/ops/alerts.yaml 的規則對當前指標評估（來源延遲、同步失敗、查詢 P95 超 SLA、交付進死信、目的地自動暫停、例行作業連續失敗、ClickHouse 表用量、隔離率）；回傳觸發中的告警與全部規則；通知管道（Email／LINE）第二階段，叢集內由 PrometheusRule 同規則送 Alertmanager；需 governance.view', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OpsAlerts' } } } } } }
  /v1/migration/inventory:
    get: { tags: [Migration], summary: '舊平台歷史資料盤點（資料集、來源表、日期範圍、筆數、導出方式、目標表、狀態；docs/22 §3）', responses: { '200': { description: ok } } }
  /v1/migration/inventory/refresh:
    post: { tags: [Migration], summary: '以舊平台查詢 API 重新盤點（每事件每日筆數、用戶數；需 LEGACY_BASE_URL／LEGACY_PROJECT／LEGACY_API_SECRET 於執行節點）；需 governance.use；審計 migration.inventory.refreshed', requestBody: { content: { application/json: { schema: { type: object, properties: { date_from: { type: string, format: date }, date_to: { type: string, format: date } } } } } }, responses: { '200': { description: ok }, '503': { description: 未設定舊平台連線 } } }
  /v1/migration/bridge:
    get: { tags: [Migration], summary: '舊平台 → GA4 埋點銜接表（由 events.yaml 產生：legacy_event、ga4_event、kind、參數、未解議題；可下載 CSV 給 360 導入商）', responses: { '200': { description: ok } } }
  /v1/migration/exports:
    get: { tags: [Migration], summary: '導出／載入任務（按日分片進度、筆數、校驗、重跑）', responses: { '200': { description: ok } } }
    post: { tags: [Migration], summary: '建立導出任務（資料集、日期範圍、方式 impala|api；需 governance.d；審計 migration.export.created）', responses: { '202': { description: accepted } } }
  /v1/migration/exports/{id}/rerun:
    post: { tags: [Migration], summary: '重跑指定日期分片（差異 > 0.1% 時）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/migration/legacy-groups:
    get: { tags: [Migration], summary: '舊平台分群／標籤遷移清單：每個舊平台分群（users 表 user_group_* 欄）與標籤（user_tag_* 欄）的人數、處理方式（待處理／快照／已重建／略過）、對應的 DMP 分群或標籤與人數差異；需 governance.view', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyGroupList' } } } } } }
  /v1/migration/legacy-groups/scan:
    post: { tags: [Migration], summary: '以舊平台查詢 API 掃描 users 表的 user_group_*／user_tag_* 欄位與人數（標籤另回值的種類數）；保留既有處理狀態；需 governance.use；審計 migration.groups.scanned', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyGroupList' } } } }, '503': { description: 未設定舊平台連線 } } }
  /v1/migration/legacy-groups/{name}/snapshot:
    post: { tags: [Migration], summary: '快照：從舊平台取成員（登入 ID 以 token_v1 轉 one_id，匿名用 first_id）→ 導入名單 → 建 kind=import 的分群（分群）或標籤（標籤，每人一值）並計算一次；規則重建不了的用這個；需 governance.use 與 segments.use；審計 migration.group.snapshot', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { dmp_name: { type: string, maxLength: 60, description: '預設「舊平台：<名稱>」' } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyGroup' } } } }, '409': { description: 已處理或名稱重複 }, '503': { description: 未設定舊平台連線或 ClickHouse } } }
  /v1/migration/legacy-groups/{name}/link:
    post: { tags: [Migration], summary: '標記已重建：連到分析師以規則建構器重建的 DMP 分群或標籤，之後比對人數差異；需 governance.use', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, required: [type, id], properties: { type: { type: string, enum: [segment, tag] }, id: { type: string } } } } } }, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyGroup' } } } }, '404': { description: 分群或標籤不存在 } } }
  /v1/migration/legacy-groups/{name}/skip:
    post: { tags: [Migration], summary: '略過（已停用、不再需要）；需附原因；需 governance.use', parameters: [{ name: name, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 200 } } } } } }, responses: { '200': { description: ok } } }
  /v1/migration/reconcile:
    get: { tags: [Migration], summary: '新舊對帳（T2 每事件每日：舊平台筆數 vs 載入筆數；T5 並行期：舊平台 vs GA360 每日量與差異；T6 登入用戶銜接率；由 ClickHouse ingest_recon 與 events.source 計算）', parameters: [{ name: days, in: query, schema: { type: integer, default: 28 } }, { name: project, in: query, schema: { type: string } }], responses: { '200': { description: ok }, '503': { description: 未連接 ClickHouse } } }
  /v1/integration/tables:
    get: { tags: [Integration], summary: '數據表管理：已登記的外部表（數據源、表、主鍵、增量欄位、欄位數、Schema 版本、變更、使用它的任務）', responses: { '200': { description: ok } } }
    post: { tags: [Integration], summary: '從數據源探索並登記表（讀 schema 與樣本；個資欄位標 L4 不可選；設主鍵與增量欄位）', responses: { '201': { description: created } } }
  /v1/integration/tables/{id}/rescan:
    post: { tags: [Integration], summary: '重新探索 Schema，產生變更清單（新欄位／改型別），依任務的 schema_change 設定處理', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/integration/sync-tasks:
    get: { tags: [Integration], summary: '同步任務清單（來源表 → 目標：events 只增量／users upsert／dim_* upsert 或全量／oneid_bind／tags；全量／增量／流任務；排程、依賴、最近執行、狀態）', responses: { '200': { description: ok } } }
    post: { tags: [Integration], summary: '建立任務（可視化建模精靈的產物：數據源 → 表與主鍵 → 目標類型 → 字段映射與轉換 → 清洗規則 → 預覽驗證 → 排程）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SyncTask' } } } }, responses: { '201': { description: created } } }
  /v1/integration/sync-tasks/{id}/run:
    post: { tags: [Integration], summary: '立即執行／重跑（流任務為重啟；審計 task.rerun）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/integration/sync-tasks/{id}/runs:
    get: { tags: [Integration], summary: '執行紀錄（筆數、耗時、隔離數、失敗原因、重試次數）與日誌', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/integration/sync-tasks/{id}/preview:
    post: { tags: [Integration], summary: '以樣本（預設 1,000 列）跑映射與清洗規則，回通過／隔離／拒絕與原因、個資命中、新屬性', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/integration/connectors:
    get: { tags: [Integration], summary: '連接器目錄（類型、鑑權方式與欄位、最小權限清單、輪替政策；來自 connectors.yaml）', responses: { '200': { description: ok } } }
  /v1/integration/connections:
    get: { tags: [Integration], summary: '連線清單（密鑰一律遮罩，只回 secret_ref 與輪替狀態、最後測試）', responses: { '200': { description: ok } } }
    post:
      tags: [Integration]
      summary: 建立連線。密鑰不入庫：請求可帶 secret_ref，或帶一次性明文由 API 直接寫入密鑰庫後只保留參照（回應不回顯）；需 integration.d 權限；寫審計 integration.connection.created
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionCreate' } } } }
      responses: { '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }, '422': { description: 欄位／secret_ref 格式錯誤或疑似明文密鑰 } }
  /v1/integration/connections/{id}:
    get: { tags: [Integration], summary: '連線詳情（遮罩）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { tags: [Integration], summary: '更新非機密欄位或換 secret_ref（換參照視同輪替）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [Integration], summary: '停用連線（保留審計；有模型依賴時拒絕）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: disabled } } }
  /v1/integration/connections/{id}/test:
    post:
      tags: [Integration]
      summary: 連線測試：逐步診斷 dns→tcp→tls→auth→privilege→cdc_prereq→sample_read→clock_skew，失敗步驟附修法；在執行節點以 Workload Identity 取密鑰，API 節點不接觸明文；寫審計 integration.connection.tested
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTest' } } } } }
  /v1/integration/connections/{id}/rotate:
    post: { tags: [Integration], summary: '輪替密鑰（新 secret_ref；新舊並存 24 小時；短效憑證回 409）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '409': { description: 短效憑證不需輪替 } } }
  /v1/integration/connections/{id}/privileges:
    get: { tags: [Integration], summary: '權限自檢結果（對照 least_privilege 清單逐項 ✓／✗）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations:
    get: { tags: [Activation], summary: '目的地清單（webhook / kafka / gcs / sftp / s3；皆為內部系統；資料輸出任務與受眾推送共用）', responses: { '200': { description: ok } } }
    post: { tags: [Activation], summary: '建立目的地（需 segments.approve；新目的地首次推送另需稽核核可）', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Destination' } } } }, responses: { '201': { description: created } } }
  /v1/destinations/{id}/test:
    post: { tags: [Activation], summary: '送測試事件（audience.test，3 筆假資料）並回傳接收端回應；sftp／s3 改為逐步診斷 dns→tcp→auth→寫入測試檔→刪除', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations/{id}:
    get: { tags: [Activation], summary: '目的地詳情（secret 只顯示參照；含 7 天成功率、最近交付）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    put: { tags: [Activation], summary: '編輯目的地（名稱、可附標籤、識別子、IP 白名單；URL 與 secret 變更視同新目的地：首次推送需再核可）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations/{id}/pause:
    post: { tags: [Activation], summary: '停用／啟用目的地（停用期間推送單暫停、交付進入重試佇列）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/destinations/{id}/rotate-secret:
    post: { tags: [Activation], summary: '輪替 Webhook secret（新舊並存 24 小時）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/audiences/{id}/push:
    post:
      tags: [Activation]
      summary: 推送受眾包到目的地（mode=delta|full；full 需審批；排程由 schedule 指定）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { destination_ids: { type: array, items: { type: string } }, mode: { type: string, enum: [delta, full] }, schedule: { type: string, enum: [now, after_batch, realtime, cron] }, cron: { type: string }, include_tags: { type: array, items: { type: string } } } } } } }
      responses: { '202': { description: accepted（pending_approval 或已排程） } }
  /v1/pushes:
    get: { tags: [Activation], summary: '推送單清單（分群 × 目的地 × 模式 × 排程；狀態、最近交付版本、審批）', parameters: [{ name: segment_id, in: query, schema: { type: string } }], responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Push' } } } } } } }
  /v1/pushes/{id}:
    get: { tags: [Activation], summary: '推送單詳情（含最近 20 筆交付）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [Activation], summary: '刪除推送單（已有交付的保留紀錄，狀態改 deleted）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /v1/pushes/{id}/run:
    post: { tags: [Activation], summary: '立即執行一次（增量：與上次交付版本比對；全量：整份）；需推送單 active', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: 'ok（回傳本次交付摘要）' } } }
  /v1/pushes/{id}/pause:
    post: { tags: [Activation], summary: '暫停／恢復推送單', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/activation/tick:
    post: { tags: [Activation], summary: '例行：到期重試、日批後（分群有新版本）自動增量推送；正式環境由排程器每分鐘呼叫；需 segments.approve', responses: { '200': { description: ok } } }
  /v1/deliveries:
    get: { tags: [Activation], summary: '交付紀錄（受眾包、目的地、版本、批次、狀態、重試、下游回應）', parameters: [{ name: audience_id, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string, enum: [ok, retrying, failed, dlq] } }], responses: { '200': { description: ok } } }
  /v1/deliveries/{id}/replay:
    post: { tags: [Activation], summary: '重放失敗交付（沿用同一 Delivery-Id）', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '202': { description: accepted } } }
  /v1/dictionary/events:
    get: { tags: [Governance], summary: '事件字典（含未登記隔離事件）', responses: { '200': { description: ok } } }
  /v1/lineage/{entity}:
    get: { tags: [Governance], summary: '血緣', parameters: [{ name: entity, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
  /v1/audit:
    get: { tags: [Governance], summary: '審計尾端（含 agent.tool_called；行銷／分析只看自己）', parameters: [{ name: n, in: query, schema: { type: integer, default: 100, maximum: 1000 } }], responses: { '200': { description: ok } } }
  /v1/audit/stats:
    get: { tags: [Governance], summary: '日誌統計看板（docs/10 §8）：指標卡、每日趨勢（登入／失敗／權限拒絕／細查／匯出／查詢）、模組使用、依角色細查、敏感存取 Top、審批、agent 活動、告警規則評估結果；audit.use 看全平台，只有 audit.view 看自己', parameters: [{ name: days, in: query, schema: { type: integer, default: 30, maximum: 90 } }], responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuditStats' } } } } } }
  /v1/audit/export:
    get: { tags: [Governance], summary: '匯出審計報表 CSV（檔頭浮水印：匯出者、時間、雜湊；≤ 10000 列）；需 audit.export；審計 audit.exported', parameters: [{ name: days, in: query, schema: { type: integer, default: 30 } }], responses: { '200': { description: 'text/csv' } } }
  /v1/settings:
    get: { tags: [Governance], summary: '平台設定（唯讀）：身分與登入（idp.yaml）、權限（rbac.yaml）、隱碼與揭露（masking.yaml）、agent 預算（mcp/tools.yaml、agents.yaml）、審計告警（audit_alerts.yaml）；密鑰只顯示 secret_ref；需 iam.view。線上修改（含雙人複核）為第二階段', responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    MetaEvent:
      type: object
      required: [name, cn, entity, source, kind, owner]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_.]{2,47}$' }
        cn: { type: string }
        entity: { type: string, enum: [user, account, item] }
        source: { type: string }
        kind: { type: string, enum: [behavior, business, trade, marketing] }
        owner: { type: string }
        status: { type: string, enum: [draft, live], default: draft }
        properties: { type: array, items: { type: object, properties: { key: { type: string }, type: { type: string, enum: [string, number, bool, datetime, list] }, sensitivity: { type: string, enum: [L0, L1, L2, L3] } } } }
        path_node_rule: { type: string, description: 路徑分析節點拆分屬性（例 page_group） }
        note: { type: string }
    MetaProperty:
      type: object
      required: [key, cn, type, scope, sensitivity]
      properties: { key: { type: string }, cn: { type: string }, type: { type: string }, scope: { type: string, enum: [event, user, item] }, sensitivity: { type: string, enum: [L0, L1, L2, L3] }, source: { type: string }, enum: { type: array, items: { type: string } }, unit: { type: string }, item_type: { type: string } }
    DimensionTable:
      type: object
      required: [id, cn, primary_key, join, source]
      properties:
        id: { type: string, pattern: '^dim_[a-z0-9_]+$' }
        cn: { type: string }
        primary_key: { type: string }
        item_type: { type: string }
        join: { type: array, items: { type: object, required: [table, column], properties: { table: { type: string, enum: [events, users] }, column: { type: string, description: 事件／用戶屬性 }, dim_column: { type: string, description: 預設為主鍵 } } } }
        source: { type: string, description: 同步任務 id }
        columns: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, type: { type: string }, sensitivity: { type: string, enum: [L0, L1, L2, L3] }, exposed: { type: boolean, default: true } } } }
    Assignment:
      type: object
      required: [user_id, roles]
      properties:
        user_id: { type: string }
        roles: { type: array, items: { type: string } }
        scope: { type: object, properties: { branches: { type: array, items: { type: string } }, agent_customers: { type: boolean }, projects: { type: array, items: { type: string } }, segment_limit: { type: string }, lookback_days: { type: integer } } }
        expires_at: { type: string, format: date-time }
        reason: { type: string }
    SyncTask:
      type: object
      required: [id, cn, source, target, mode]
      properties:
        id: { type: string }
        cn: { type: string }
        source: { type: object, properties: { table_id: { type: string }, incremental_column: { type: string } } }
        target: { type: object, properties: { type: { type: string, enum: [events, users, dimension_table, oneid_bind, tags] }, id: { type: string, description: 維度表 id 或標籤 id }, write: { type: string, enum: [append, upsert, overwrite] } } }
        mode: { type: string, enum: [full, incremental, stream] }
        schedule: { type: string, description: cron 或 realtime }
        depends_on: { type: array, items: { type: string } }
        mapping: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, transform: { type: string }, pii: { type: boolean } } } }
        event_rules: { type: object, description: 目標為 events 時：事件名規則（固定／狀態機）、time、identities、event_id }
        cleansing: { type: array, items: { type: object, properties: { rule: { type: string }, expr: { type: string }, on_violation: { type: string, enum: [quarantine, reject, fix] } } } }
        schema_change: { type: string, enum: [auto_map, ignore, pause_and_notify], default: pause_and_notify }
    ConnectionCreate:
      type: object
      required: [id, type, auth_method, fields]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{2,31}$' }
        type: { type: string, enum: [mssql, postgresql, bigquery, legacydata, kafka, gcs] }
        auth_method: { type: string, description: 見 /v1/integration/connectors 的 auth_methods }
        fields: { type: object, additionalProperties: true, description: 非機密欄位；API 會掃描疑似明文密鑰並拒絕 }
        secret_refs: { type: object, additionalProperties: { type: string }, description: 'secret_field → 密鑰庫參照（projects/…/secrets/…/versions/N、kv/data/dmp/…#key、secret://ns/name/key）' }
        secrets_once: { type: object, additionalProperties: { type: string, format: password }, description: 一次性明文，API 寫入密鑰庫後丟棄；不入日誌、不回顯 }
        tls_verify: { type: boolean, default: true }
        owner: { type: string, description: 憑證負責人（輪替到期通知對象） }
    Connection:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        auth_method: { type: string }
        fields: { type: object, additionalProperties: true }
        secrets: { type: object, additionalProperties: { type: object, properties: { ref: { type: string }, value: { type: string, const: '••••••••' } } } }
        tls_verify: { type: boolean }
        rotation: { type: object, properties: { kind: { type: string, enum: [short_lived, rotating] }, every_days: { type: integer }, due: { type: string, format: date }, days_left: { type: integer }, state: { type: string, enum: [ok, warn, expired] } } }
        last_test: { type: object, properties: { at: { type: string, format: date-time }, ok: { type: boolean }, failed_step: { type: string, nullable: true } } }
        owner: { type: string }
    ConnectionTest:
      type: object
      properties:
        ok: { type: boolean }
        at: { type: string, format: date-time }
        steps:
          type: array
          items: { type: object, properties: { step: { type: string, enum: [validate, dns, tcp, tls, auth, privilege, cdc_prereq, sample_read, clock_skew] }, ok: { type: boolean }, detail: { type: string }, fix: { type: string } } }
    Event:
      type: object
      required: [type, time, project]
      properties:
        type: { type: string, enum: [track, profile_set, profile_set_once, profile_increment, profile_append, profile_unset, item_set, item_delete, track_id_bind, track_id_unbind] }
        event: { type: string }
        event_id: { type: string }
        time: { type: integer, description: ms since epoch (UTC) }
        project: { type: string }
        source: { type: string }
        distinct_id: { type: string }
        identities: { type: object, additionalProperties: true }
        entity: { type: object, properties: { type: { type: string }, id: { type: string } } }
        properties: { type: object, additionalProperties: true }
    SemanticQuery:
      type: object
      required: [metric, time]
      properties:
        metric: { type: string }
        time: { type: object, properties: { from: { type: string }, to: { type: string }, grain: { type: string, enum: [minute, hour, day, week, month, total] }, now: { type: string } } }
        filters: { description: '全局篩選：陣列（＝且）或 { op: and|or, items: [條件或子群組] } 可巢狀；條件 { field, op, value }（事件欄位、維度、props.<key>、user.<key>、seg.<id>）', oneOf: [{ type: array, items: { type: object, properties: { field: { type: string }, op: { type: string }, value: {} } } }, { type: object, properties: { op: { type: string, enum: [and, or] }, items: { type: array, items: { type: object } } } }] }
        group_by: { type: array, maxItems: 3, items: { type: string } }
        segment: { type: string }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' }, description: '行為篩選「用戶做過／未做過」：與用戶列表 behaviors 同一套（事件 × 指標 × 比較 × 期間 × 事件屬性條件）；行為的 time 未給時以查詢的 time 為期間（last_days 以 time.now 回推）；只算符合的用戶的事件，一律走明細層' }
        behaviors_op: { type: string, enum: [and, or], default: and, description: 多條行為之間的組合 }
        cohorts: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Cohort' }, description: '對照組（最多 10 組）：每組一套篩選（filters／segment／behaviors），與全局篩選取交集後各算一次；結果每列多一欄 cohort（組名），rows 依組名順序串接；與 compare 可並用（每組各自比上期）' }
        compare: { type: string, enum: [previous_period, segment] }
        exact: { type: boolean, default: false, description: 'true＝一律走明細、不用日聚合層（次數／金額在聚合層本來就精確，這個開關用於對帳）' }
        estimate: { type: boolean, default: false, description: '快速估算（docs/04 §1.3）：true 時人數可走日聚合層（uniqMerge，近似值），回應 warnings 標示；預設 false＝人數精確去重。與 exact 同時為 true 時以 exact 為準' }
    Cohort:
      type: object
      required: [name]
      description: 對照組一組：名稱 + 自己的篩選；三種條件之間取交集（且）
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: 組名（結果的 cohort 欄；同一查詢內不可重複） }
        filters: { description: 同 SemanticQuery.filters（陣列或且／或樹） }
        segment: { type: string, description: 等同 filters 加 seg.<id> in }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' } }
        behaviors_op: { type: string, enum: [and, or], default: and }
    PathQuery:
      type: object
      required: [anchor, time]
      properties:
        project: { type: string }
        anchor: { type: object, required: [event], properties: { event: { type: string, description: '事件名或拆分後節點（event:值）' }, filters: { type: array, items: { type: object } } }, description: 起點（direction=after）或終點（before） }
        direction: { type: string, enum: [after, before], default: after }
        steps: { type: integer, minimum: 1, maximum: 10, default: 5 }
        session: { type: object, properties: { mode: { type: string, enum: [gap, id, cross], default: gap, description: 'gap = 依間隔切會話；id = 用 session_id；cross = 期間內整個用戶一條序列' }, gap_minutes: { type: integer, default: 30 }, max_events: { type: integer, default: 200, description: 每會話最多保留的事件數 } } }
        nodes: { type: object, properties: { events: { type: array, items: { type: string }, description: 只把這些事件當節點（空 = 全部） }, collapse_other: { type: boolean, default: false, description: 不在 events 裡的事件折成「其他」而不是略過 }, split: { type: array, items: { type: object, required: [event, field], properties: { event: { type: string }, field: { type: string } } }, description: '事件依屬性值拆成子節點（event:值）' }, merge_repeats: { type: boolean, default: true, description: 連續重複節點合併 }, exit_node: { type: boolean, default: true, description: 會話結束補「離開」節點（$AppEnd 或會話逾時） } } }
        filters: { type: array, items: { type: object } }
        segment: { type: string }
        sample: { type: number, nullable: true, description: '預設 0.1（按用戶分桶）；null = 不抽樣' }
        top_n: { type: integer, default: 100, maximum: 1000 }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, now: { type: string } } }
    TemplateImportResult:
      type: object
      properties:
        kind: { type: string }
        applied: { type: boolean, description: false＝只是預覽 }
        total: { type: integer }
        summary: { type: object, properties: { create: { type: integer }, update: { type: integer }, unchanged: { type: integer }, error: { type: integer }, change_request: { type: integer } } }
        rows: { type: array, items: { type: object, properties: { line: { type: integer, description: CSV 行號（含表頭）}, key: { type: string }, action: { type: string, enum: [create, update, unchanged, change_request, error] }, changes: { type: array, items: { type: string } }, errors: { type: array, items: { type: string } } } } }
    PathResult:
      type: object
      properties:
        paths: { type: array, items: { type: object, properties: { path: { type: array, items: { type: string } }, users: { type: integer, nullable: true }, sessions: { type: integer, nullable: true }, share: { type: number, nullable: true, description: 占起點用戶比例 }, avg_ms: { type: number, nullable: true }, suppressed: { type: boolean } } } }
        anchor_users: { type: integer, description: 經過起點的用戶數（抽樣後） }
        nodes: { type: array, items: { type: object, properties: { level: { type: integer }, node: { type: string }, users: { type: integer } } }, description: 桑基節點（由未抑制的路徑彙總） }
        links: { type: array, items: { type: object, properties: { level: { type: integer }, from: { type: string }, to: { type: string }, users: { type: integer } } } }
        sampled: { type: number, nullable: true }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    AttributionQuery:
      type: object
      required: [target, touches, time]
      properties:
        project: { type: string }
        target: { type: object, required: [event], properties: { event: { type: string }, filters: { type: array, items: { type: object } }, value_field: { type: string, description: '轉化價值欄位（例 amount）；不給 = 每次轉化計 1' } } }
        touches: { type: array, minItems: 1, maxItems: 10, items: { type: object, required: [event], properties: { event: { type: string }, alias: { type: string }, filters: { type: array, items: { type: object } }, weight: { type: number, description: 自訂權重模型用（預設 1） } } } }
        split: { type: string, description: 觸點再依此欄位拆分（例 utm_source、platform） }
        models: { type: array, minItems: 1, items: { type: string, enum: [first, last, linear, position, decay, custom] }, default: [first, last, linear] }
        position_weights: { type: object, properties: { first: { type: number, default: 0.4 }, last: { type: number, default: 0.4 } }, description: U 型：首末各占，中間平分其餘 }
        half_life_days: { type: number, default: 7, description: 時間衰減半衰期 }
        window_days: { type: integer, minimum: 1, maximum: 90, default: 7, description: 回溯窗口：轉化前 N 天內的觸點 }
        filters: { type: array, items: { type: object } }
        segment: { type: string }
        sample: { type: number }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, now: { type: string } }, description: 轉化事件的日期範圍（觸點可往前回溯 window_days） }
    AttributionResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { touch: { type: string, description: 觸點別名 }, event: { type: string }, split: { type: string, nullable: true }, models: { type: object, additionalProperties: { type: object, properties: { conversions: { type: number, nullable: true }, value: { type: number, nullable: true }, share: { type: number, nullable: true } } } }, users: { type: integer, nullable: true, description: 被歸到此觸點的轉化用戶數 }, suppressed: { type: boolean } } } }
        summary: { type: object, properties: { conversions: { type: integer, description: 期間轉化次數 }, converters: { type: integer }, touched: { type: integer, description: 窗口內至少一個觸點的轉化次數 }, untouched: { type: integer }, value: { type: number }, avg_touches: { type: number, nullable: true } } }
        models: { type: array, items: { type: string } }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    FunnelQuery:
      type: object
      required: [steps, window, time]
      properties:
        project: { type: string }
        steps: { type: array, minItems: 2, maxItems: 10, items: { type: object, required: [event], properties: { event: { type: string }, alias: { type: string }, filters: { type: array, items: { type: object } } } } }
        window: { type: object, required: [value, unit], properties: { value: { type: integer, minimum: 1 }, unit: { type: string, enum: [minute, hour, day] } }, description: 最長 90 天 }
        order: { type: string, enum: [loose, strict], default: loose }
        relation: { type: string, description: 關聯屬性（業務 ID）：entity_id 或 props.<key>；同一值的事件才算同一流程 }
        metric: { type: string, enum: [users, times], default: users, description: times 需指定 relation（計算流程數） }
        group_by: { type: array, maxItems: 1, items: { type: string }, description: 分組值取自第一步事件 }
        trend: { type: string, enum: [day, week, month], description: 依第一步發生日期分桶 }
        filters: { description: 全局篩選（同 SemanticQuery.filters：陣列或且／或樹） }
        segment: { type: string }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' }, description: 行為篩選（同 SemanticQuery.behaviors；只作用於進漏斗的用戶） }
        behaviors_op: { type: string, enum: [and, or], default: and }
        cohorts: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Cohort' }, description: 對照組（同 SemanticQuery.cohorts；每列多一欄 cohort） }
        sample: { type: number, description: 按用戶抽樣比例 (0,1) }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, now: { type: string } } }
    RetentionQuery:
      type: object
      required: [initial, time]
      properties:
        project: { type: string }
        initial: { type: object, required: [event], properties: { event: { type: string }, filters: { type: array, items: { type: object } } }, description: 初始行為 }
        return: { type: object, properties: { event: { type: string, nullable: true, description: 空 = 任一事件 }, filters: { type: array, items: { type: object } } }, description: 回訪行為（省略 = 任一事件） }
        model: { type: string, enum: [date, interval, continuous, churn], default: date }
        unit: { type: string, enum: [day, week, month], default: day }
        periods: { type: integer, minimum: 1, maximum: 90, default: 7 }
        include_day0: { type: boolean, default: false, description: 輸出第 0 期（當期回訪） }
        group_by: { type: array, maxItems: 1, items: { type: string }, description: 分組值取自初始事件 }
        filters: { description: 全局篩選（同 SemanticQuery.filters；只作用於初始行為） }
        segment: { type: string }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' }, description: 行為篩選（同 SemanticQuery.behaviors；只作用於進同期群的用戶） }
        behaviors_op: { type: string, enum: [and, or], default: and }
        cohorts: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Cohort' }, description: 對照組（同 SemanticQuery.cohorts；每列多一欄 cohort） }
        sample: { type: number }
        time: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string } }, description: 初始行為的日期範圍（同期群） }
    RetentionResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { cohort: { type: string, description: 同期群（起始日期）；有 cohorts 時對照組名放 cohort_name }, cohort_name: { type: string, description: 對照組名（有 cohorts 時才有） }, g1: { type: string }, period: { type: integer }, users: { type: integer, nullable: true, description: 同期群人數 }, retained: { type: integer, nullable: true }, rate: { type: number, nullable: true }, complete: { type: boolean, description: 該期是否已過（未過的期數為不完整） }, suppressed: { type: boolean } } } }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    UsersQuery:
      type: object
      description: '用戶條件（用戶列表／分群／標籤值共用，舊平台式）：用戶屬性條件樹（且／或可巢狀）＋ 行為條件（做過／未做過某事件、指標＝總次數／某屬性總和／平均／最大／最小／有行為天數、比較運算、期間＝近 N 天或自訂）＋ 兩塊之間的且／或；例行計算時「近 N 天」以計算基準日為準（動態標籤）'
      properties:
        project: { type: string }
        combine: { type: string, enum: [and, or], default: and, description: 用戶屬性條件（filters／segment）與行為條件（behaviors）之間的組合 }
        filters: { description: '用戶屬性（user.<key>，只限寬表 L0–L2）與分群（seg.<id>）條件樹：陣列＝全部符合（且）；{ op: and|or, items: [條件或子群組] } 可巢狀（建議最多兩層）；條件 { field, op, value }，運算子依型別：字串 eq/neq/in/nin/like/nlike/set/nset、數值 eq/neq/gt/gte/lt/lte/between/set/nset、布林 true/false、日期 rel({days})/between/set/nset、分群 in/nin', oneOf: [{ type: array, items: { type: object } }, { type: object, properties: { op: { type: string, enum: [and, or] }, items: { type: array, items: { type: object } } } }] }
        segment: { type: string, description: 等同 filters 加 seg.<id> in }
        behaviors: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/UsersBehavior' } }
        sequences: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/UsersSequence' }, description: 行為序列（依序完成 A → B → …）；與 behaviors 一起受 behaviors_op 組合 }
        behaviors_op: { type: string, enum: [and, or], default: and, description: behaviors 與 sequences 之間的組合 }
        time: { type: object, description: behaviors 未各自指定時的預設時間範圍, properties: { from: { type: string }, to: { type: string }, now: { type: string } } }
        source: { $ref: '#/components/schemas/UsersSource' }
    UsersBehavior:
      type: object
      required: [event]
      properties:
        event: { type: string }
        filters: { description: '事件屬性條件：陣列（且）或 { op: and|or, items }', oneOf: [{ type: array, items: { type: object } }, { type: object }] }
        done: { type: boolean, default: true, description: false = 期間內一次都沒做過（忽略 measure／cmp） }
        measure: { type: object, description: '指標：count 總次數（預設）、sum／avg／max／min 需 field（數值事件屬性，如 amount）、days 有行為天數', properties: { agg: { type: string, enum: [count, sum, avg, max, min, days], default: count }, field: { type: string } } }
        cmp: { type: object, description: 指標比較；未給時等同 count ≥ 1, properties: { op: { type: string, enum: [gte, lte, eq, gt, lt, between], default: gte }, value: { description: '數字或 [a, b]' } } }
        count: { type: object, deprecated: true, description: 舊寫法＝measure count ＋ cmp, properties: { op: { type: string, enum: [gte, lte, eq, between], default: gte }, value: { description: '數字或 [a, b]' } } }
        time: { type: object, description: '期間：{ last_days: N }＝到基準日（time.now 或例行計算的 basetime）為止近 N 天，動態標籤用這個；或 { from, to } 自訂日期', properties: { last_days: { type: integer, minimum: 1, maximum: 730 }, from: { type: string }, to: { type: string } } }
    UsersSequence:
      type: object
      description: '行為序列：期間內依序完成各步（ClickHouse windowFunnel 預設模式：從第一步起算，後續每一步都要在窗口內發生；中間可夾其他事件）；done=false＝期間內沒有依序完成'
      required: [steps, window]
      properties:
        steps: { type: array, minItems: 2, maxItems: 6, items: { type: object, required: [event], properties: { event: { type: string }, filters: { description: '該步的事件屬性條件：陣列（且）或 { op, items }' } } } }
        window: { type: object, required: [value, unit], properties: { value: { type: integer, minimum: 1 }, unit: { type: string, enum: [minute, hour, day] } }, description: 從第一步起算的完成窗口，最長 90 天 }
        done: { type: boolean, default: true }
        time: { type: object, description: '期間：{ last_days } 或 { from, to }，同 UsersBehavior.time；未給用頂層 time', properties: { last_days: { type: integer, minimum: 1, maximum: 730 }, from: { type: string }, to: { type: string } } }
    UsersSource:
      type: object
      description: 從分析結果的某個落點下鑽成用戶列表（漏斗某步到達／流失、留存某同期群某期留存／未留存、事件分析某桶某分組），或導入名單
      required: [type]
      properties:
        type: { type: string, enum: [funnel, retention, events, path, attribution, import] }
        import_id: { type: string, description: 'import：導入名單 id（/v1/segments/imports 回傳）；此時不需 query' }
        query: { type: object, description: 原分析查詢（FunnelQuery／RetentionQuery／SemanticQuery／PathQuery／AttributionQuery） }
        touch: { type: string, description: 'attribution：觸點別名（轉化前窗口內有此觸點的轉化者）' }
        node: { type: string, description: 'path：節點名' }
        level: { type: integer, description: 'path：節點所在步（0 = 起點）' }
        step: { type: integer, description: funnel：步驟序號（1 起） }
        reached: { type: boolean, default: true, description: funnel：true = 到達該步；false = 在該步流失（到達前一步但未到達此步，step ≥ 2） }
        bucket: { type: string, description: funnel 趨勢桶／events 時間桶 }
        group: { description: 'funnel／retention 的 g1 值，events 的 [g1, g2, …]，attribution 的 split 值' }
        cohort: { type: string, description: retention：同期群 }
        period: { type: integer, description: retention：期數 }
        retained: { type: boolean, nullable: true, description: retention：true 留存／false 未留存／null 整個同期群 }
        metric: { type: string, description: events：指標別名（預設第一個） }
    UsersEstimate:
      type: object
      properties:
        users: { type: integer }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    UsersListRequest:
      allOf:
        - $ref: '#/components/schemas/UsersQuery'
        - type: object
          properties:
            columns: { type: array, items: { type: string }, description: 要顯示的用戶屬性（寬表 L0–L2；hide 的欄位略過並回 warning） }
            sort: { type: object, properties: { field: { type: string }, dir: { type: string, enum: [asc, desc] } } }
            page_size: { type: integer, default: 50, maximum: 500 }
            cursor: { type: string, description: 上一頁回的 next_cursor；最多瀏覽 100,000 筆 }
    UsersListResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, description: one_id（遮罩）+ columns } }
        columns: { type: array, items: { type: string } }
        masked: { type: object, additionalProperties: { type: string } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, description: 同條件的 Bitmap 基數（第一頁計算、游標帶著走） }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    Profile:
      type: object
      properties:
        one_id: { type: string, description: 依角色遮罩 }
        props: { type: object, description: 寬表用戶屬性（依角色遮罩；hide 略過） }
        masked: { type: object, additionalProperties: { type: string } }
        segments: { type: array, items: { type: string } }
        summary: { type: object, properties: { days: { type: integer }, events: { type: array, items: { type: object, properties: { event: { type: string }, cn: { type: string }, n: { type: integer }, first: { type: string }, last: { type: string } } } }, total: { type: integer } } }
        warnings: { type: array, items: { type: string } }
    TimelineResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { time: { type: string, description: UTC }, event: { type: string }, cn: { type: string }, platform: { type: string }, channel: { type: string }, symbol: { type: string }, side: { type: string }, amount: { nullable: true, description: 依角色遮罩（區間字串或數字） }, entity_type: { type: string }, entity_id: { type: string }, session_id: { type: string }, event_id: { type: string }, props: { type: object } } } }
        next_cursor: { type: string, nullable: true }
        masked: { type: object, additionalProperties: { type: string } }
        sql: { type: string }
        cost: { type: object }
    IdentityGraph:
      type: object
      properties:
        nodes: { type: array, items: { type: object, properties: { id: { type: string, description: 'type:遮罩值' }, type: { type: string }, value: { type: string, description: 依角色遮罩 } } } }
        edges: { type: array, items: { type: object, properties: { a: { type: string }, b: { type: string }, source: { type: string }, evidence_event_id: { type: string }, first_seen: { type: string }, last_seen: { type: string }, seen_count: { type: integer }, confidence: { type: number }, status: { type: string } } } }
        masked: { type: object, additionalProperties: { type: string } }
    SegmentCreate:
      type: object
      required: [name, rule]
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string }
        kind: { type: string, enum: [rule, result, import], default: rule, description: 'result = 從分析結果點保存（rule.source 必填，規則不可再改）；import = 導入名單（rule.source = { type: import, import_id }，規則不可再改，更新方式固定手動；舊平台分群快照也用這種）' }
        rule: { $ref: '#/components/schemas/UsersQuery' }
        update: { type: object, properties: { mode: { type: string, enum: [manual, routine], default: routine, description: '預設例行（動態分群：每日凌晨重算符合規則的受眾）' }, freq: { type: string, enum: [daily, weekly, monthly], default: daily }, earliest: { type: string, default: '02:00', description: 'HH:MM，最早計算時間' }, keep: { type: integer, minimum: 1, maximum: 100, default: 7, description: 例行版本保留數；手動固定 1 } } }
        tz: { type: string, default: Asia/Taipei }
    SegmentImportCreate:
      type: object
      required: [id_type, values]
      properties:
        project: { type: string }
        id_type: { type: string, enum: [customer_code, one_id], description: 'customer_code＝客戶代碼（原始值，伺服器以 token_v1 轉 one_id）；one_id＝已是 DMP 的 one_id' }
        values: { type: array, minItems: 1, maxItems: 200000, items: { type: string, maxLength: 64 } }
        label: { type: string, maxLength: 60, description: 檔名或說明（只存摘要） }
    SegmentImport:
      type: object
      properties:
        id: { type: string }
        project: { type: string }
        id_type: { type: string }
        label: { type: string }
        total: { type: integer, description: 上傳列數 }
        distinct: { type: integer, description: 去重後 }
        matched: { type: integer, description: 對到用戶表的人數 }
        unmatched: { type: integer }
        invalid: { type: integer, description: 空白或格式不符而略過的列 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Segment:
      allOf:
        - $ref: '#/components/schemas/SegmentCreate'
        - type: object
          properties:
            id: { type: string }
            project: { type: string }
            status: { type: string, enum: [draft, pending_approval, active, paused, recycled] }
            owner: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
            approval: { type: object, properties: { status: { type: string, enum: [none, pending, approved, rejected] }, by: { type: string }, at: { type: string }, note: { type: string } } }
            latest: { $ref: '#/components/schemas/SegmentVersion' }
            lineage: { type: object, properties: { up: { type: array, items: { type: string }, description: 'event:*／dmp.users_dict／segment:*…' }, down: { type: array, items: { type: string }, description: 引用本分群的分群（之後：推送單、觸發規則、分析） } } }
            recycled_at: { type: string, nullable: true }
    SegmentVersion:
      type: object
      properties:
        version: { type: integer }
        basetime: { type: string, description: YYYY-MM-DD }
        users: { type: integer, nullable: true }
        status: { type: string, enum: [running, success, failed, cancelled] }
        computed_at: { type: string }
        ms: { type: integer }
        trigger: { type: string, enum: [manual, routine, backfill] }
        error: { type: string, nullable: true }
    SegmentPreview:
      type: object
      properties:
        users: { type: integer }
        profile: { type: object, additionalProperties: { type: array, items: { type: object, properties: { value: { type: string }, users: { type: integer } } } }, description: 'lifecycle／tier／aum_bucket／branch_id 各取前 10 值' }
        sql: { type: string }
        warnings: { type: array, items: { type: string } }
    Approval:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [export, output_task, destination_first_use, segment, push, reveal_l2, reveal_l3, agent_proposal, role_change, break_glass, dashboard_schedule], description: 類型決定審批角色（docs/10 §6）；output_task = 資料輸出任務（數位經營）；destination_first_use = 目的地首次使用（系統管理員；與 output_task 兩道都核可任務才生效，目的地設定變更後重開）；role_change／break_glass 一律不可自審；dashboard_schedule = 看板定時寄送（數位經營） }
        requester: { type: string }
        approver_roles: { type: array, items: { type: string } }
        summary: { type: string, description: 一行說明（給審批者看） }
        detail: { type: object, description: 附件（匯出：用途、列數、保存天數、條件摘要） }
        object: { type: object, properties: { kind: { type: string }, id: { type: string } }, description: 受控物件（核可後回寫狀態） }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        created_at: { type: string }
        expires_at: { type: string, description: 逾期未審自動 expired }
        decided_at: { type: string, nullable: true }
        decided_by: { type: string, nullable: true }
        note: { type: string }
    OutputTaskCreate:
      type: object
      required: [name, type, content, destination_id, format, purpose]
      description: 資料輸出任務＝任務類型 × 輸出內容 × 目的地（沿用推送的 Destination，加 sftp／s3）× 內容選擇 × 格式；密鑰只在目的地的 secret_ref
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        type: { type: string, enum: [realtime, once, daily], description: 'realtime 單條寫入指定目的地（只接 kafka／webhook、只接 events）；once 一次性批量；daily T+1 定時（每天 schedule.at 跑前一天分區）' }
        content: { $ref: '#/components/schemas/OutputContent' }
        destination_id: { type: string, description: /v1/destinations 的目的地；新目的地首次使用需系統管理員核可 }
        format: { $ref: '#/components/schemas/OutputFormat' }
        schedule: { type: object, properties: { at: { type: string, description: 'daily：每天幾點（HH:MM，台北）；預設 02:00' }, end_date: { type: string, format: date, description: 'daily：離線結束日（含）；到期後狀態 ended' } } }
        purpose: { type: string, minLength: 4, maxLength: 200, description: 用途（進審批單與浮水印） }
        retention_days: { type: integer, minimum: 1, maximum: 365, default: 90, description: 接收方承諾的保存期限（寫進審批單與檔頭） }
        shared_roles: { type: array, items: { type: string }, description: 哪些角色看得到這個任務 }
    OutputContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [events, users, segment_members], description: 事件明細／用戶寬表／分群名單 }
        events: { type: array, maxItems: 300, items: { type: string }, description: 'kind=events：事件清單（空＝全部 live 事件）；批量添加用事件字典的 group' }
        columns: { type: array, items: { type: string }, description: '欄位清單（事件：固定欄與 props.<key>；用戶：user.<key>）；空＝該敏感等級內的全部欄位；L3／L4 一律拒絕' }
        filters: { description: 同 SemanticQuery.filters（事件）或 UsersQuery.filters（用戶） }
        segment_id: { type: string, description: 'kind=segment_members；輸出 one_id／customer_code（代碼化）與選的標籤' }
        time: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } }, description: 'once：期間（事件依 event_date；用戶寬表依 updated_at，台北日含兩端）；daily 不用（事件＝分區日、用戶寬表＝分區日有更新的用戶）；segment_members 不套期間（最新版本完整快照，傳了會被忽略）' }
        identifier: { type: string, enum: [one_id, customer_code], default: one_id, description: 用戶識別子；customer_code 為代碼化值 }
    OutputFormat:
      type: object
      properties:
        type: { type: string, enum: [csv, jsonl, parquet], default: csv, description: realtime 固定 jsonl（每條一筆） }
        compression: { type: string, enum: [none, gzip, zstd], default: gzip }
        partition: { type: string, enum: [none, day], default: day, description: 按日分檔（檔名含 partition_date） }
        file_pattern: { type: string, default: '{task}/{date}/{task}_{date}_{seq}.{ext}', description: 遠端檔名樣板；變數 task／date／seq／ext；相對路徑、不得含 ..（只能落在目的地目錄內） }
        max_rows_per_file: { type: integer, minimum: 10000, maximum: 5000000, default: 1000000 }
        header: { type: boolean, default: true, description: csv 表頭 }
        manifest: { type: boolean, default: true, description: 每次執行附 manifest.json（檔案、列數、校驗碼、浮水印） }
    OutputTask:
      allOf:
        - $ref: '#/components/schemas/OutputTaskCreate'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [pending_approval, approved, active, paused, rejected, ended, deleted], description: approved＝核可未開始（once 等 run；daily 到時自動 active） }
            approval_id: { type: string, nullable: true, description: 資料面審批單（output_task） }
            destination_approval_id: { type: string, nullable: true, description: 目的地首次使用的系統管理員審批單（destination_first_use）；不需要時 null }
            pending_approvals: { type: array, items: { type: string }, description: 還沒核可的審批單；空＝全部過 }
            masked: { type: object, additionalProperties: { type: string }, description: 輸出欄 → 遮罩策略（與匯出同） }
            rows_estimate: { type: integer, nullable: true }
            owner: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            last_run: { $ref: '#/components/schemas/OutputRun' }
            runs: { type: array, items: { $ref: '#/components/schemas/OutputRun' }, description: 詳情才有（最近 20 次） }
    OutputRun:
      type: object
      properties:
        id: { type: string }
        task_id: { type: string }
        trigger: { type: string, enum: [manual, schedule, realtime, replay] }
        partition_date: { type: string, format: date, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, ok, failed, retrying, skipped], description: 'skipped＝分區沒有資料、目的地已暫停、或目的地設定變更待系統管理員重新核可（error 說明原因，不會上傳）' }
        rows: { type: integer, nullable: true }
        bytes: { type: integer, nullable: true }
        files: { type: array, items: { type: object, properties: { path: { type: string }, rows: { type: integer }, bytes: { type: integer }, checksum: { type: string, description: sha256 } } } }
        delivery_ids: { type: array, items: { type: string }, description: realtime／webhook／kafka 走交付紀錄（/v1/deliveries） }
        error: { type: string, nullable: true }
        attempts: { type: integer }
        watermark: { type: string, description: 本次浮水印值（檔頭與 _wm 欄） }
    OutputPreview:
      type: object
      properties:
        columns: { type: array, items: { type: object, properties: { name: { type: string }, cn: { type: string }, level: { type: string }, policy: { type: string, description: 'plain／bucket／round／mask_tail／rejected' } } } }
        rejected: { type: array, items: { type: string }, description: 被拒的欄位（L3／L4 或 hide） }
        rows_estimate: { type: integer }
        scan_rows_estimate: { type: integer }
        sample: { type: array, maxItems: 20, items: { type: object } }
        warnings: { type: array, items: { type: string } }
    ExportRequest:
      type: object
      required: [kind, purpose]
      properties:
        kind: { type: string, enum: [users, segment_members] }
        rule: { $ref: '#/components/schemas/UsersQuery', description: 'kind=users：用戶列表條件' }
        segment_id: { type: string, description: 'kind=segment_members' }
        basetime: { type: string, default: latest }
        columns: { type: array, items: { type: string } }
        purpose: { type: string, minLength: 4, maxLength: 200, description: 用途（必填，進審批單與浮水印） }
        retention_days: { type: integer, minimum: 1, maximum: 90, default: 30, description: 申請者承諾的保存期限 }
    Export:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        requester: { type: string }
        purpose: { type: string }
        retention_days: { type: integer }
        rows_estimate: { type: integer }
        rows: { type: integer, nullable: true, description: 實際匯出列數 }
        columns: { type: array, items: { type: string } }
        masked: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [pending_approval, approved, rejected, generated, downloaded, expired] }
        approval_id: { type: string }
        watermark_id: { type: string, nullable: true }
        created_at: { type: string }
        approved_at: { type: string, nullable: true }
        expires_at: { type: string, nullable: true, description: 核可後 7 天內可下載 }
        generated_at: { type: string, nullable: true }
        downloaded_at: { type: string, nullable: true }
        note: { type: string }
    DashboardCardCreate:
      type: object
      description: 二選一：bookmark（引用書籤，卡片跟著書籤更新）或 kind + query（直接存查詢）
      properties:
        bookmark: { type: string, description: 書籤 id；給了就以書籤的 kind／query 建卡，標題預設書籤名 }
        title: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [events, funnel, retention, path, attribution, sql] }
        query: { type: object, additionalProperties: true, description: '對應 /v1/analytics/{kind} 的請求本體（EventsQuery／FunnelQuery／RetentionQuery／PathQuery／AttributionQuery）' }
        chart: { type: string, enum: [auto, line, area, bar, stacked, pie, percent, stat, table], default: auto, description: 'auto 依粒度與分組自動選；area 面積、stacked 堆疊長條、pie 圓餅（總量切片）、percent 百分比堆疊；只對 events／sql 卡片有意義' }
        format: { type: string, enum: [auto, int, dec2, pct0, pct2, twd0, twd2], default: auto, description: '數值格式：auto 自動縮寫（萬／億）、int 取整、dec2 兩位小數、pct0／pct2 百分比、twd0／twd2 貨幣 NT$' }
        width: { type: integer, enum: [1, 2], default: 1, description: '1 = 半寬、2 = 全寬' }
        note: { type: string, maxLength: 200 }
    DashboardCard:
      allOf:
        - $ref: '#/components/schemas/DashboardCardCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
    DashboardCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        shared: { type: object, properties: { roles: { type: array, items: { type: string }, description: 'rbac 角色 key；看得到看板，但每張卡片仍以查看者自己的權限執行' }, users: { type: array, items: { type: string } } } }
        cards: { type: array, items: { $ref: '#/components/schemas/DashboardCard' }, description: '更新時整組取代（順序與寬度）；新增卡片用 /cards' }
        time: { type: object, properties: { preset: { type: string, enum: [7d, 14d, 30d, 90d], default: 30d } }, description: '看板共用期間；卡片查詢的 time 以此覆寫' }
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardCreate'
        - type: object
          required: [id, owner, cards, created_at, updated_at]
          properties:
            id: { type: string }
            owner: { type: string }
            mine: { type: boolean, description: '查看者是否為擁有者（可編輯）' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RevealRequest:
      type: object
      required: [field, reason]
      properties:
        field: { type: string, description: 'masking.yaml 的欄位名（one_id、amount、aum、churn_score…）' }
        one_id: { type: string, description: 只對某一位用戶揭露（細查用）；不給 = 該欄位全部 }
        reason: { type: string, minLength: 4, maxLength: 200 }
        hours: { type: integer, minimum: 1, maximum: 24, default: 24 }
    Reveal:
      type: object
      properties:
        id: { type: string }
        field: { type: string }
        level: { type: string, enum: [L2, L3] }
        one_id: { type: string, nullable: true }
        requester: { type: string }
        reason: { type: string }
        hours: { type: integer }
        status: { type: string, enum: [pending_approval, active, rejected, expired] }
        approval_id: { type: string }
        created_at: { type: string }
        expires_at: { type: string, nullable: true }
        views: { type: integer, description: 揭露期間查看次數（審計 mask.revealed） }
    FunnelResult:
      type: object
      properties:
        rows: { type: array, items: { type: object, properties: { cohort: { type: string, description: 有 cohorts 時才有 }, bucket: { type: string }, g1: { type: string }, step: { type: integer }, alias: { type: string }, event: { type: string }, users: { type: integer, nullable: true }, rate_prev: { type: number, nullable: true }, rate_first: { type: number, nullable: true }, suppressed: { type: boolean } } } }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object }
        warnings: { type: array, items: { type: string } }
    CompiledQuery:
      type: object
      properties:
        sql: { type: string }
        estimated_scan_bytes: { type: number }
        lineage: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    AnalyticsResult:
      type: object
      properties:
        rows: { type: array, items: { type: object }, description: '長表：[cohort,] [bucket,] g1..gn, 指標別名…, 公式別名…, _k, suppressed；有 cohorts 時第一欄是 cohort；compare 時每個指標多一欄 <別名>_prev' }
        columns: { type: array, items: { type: string } }
        chart_spec: { type: object }
        sql: { type: string }
        lineage: { type: array, items: { type: string } }
        cost: { type: object, properties: { scan_bytes: { type: number }, ms: { type: number } } }
        warnings: { type: array, items: { type: string } }
    BookmarkCreate:
      type: object
      required: [name, kind, query]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 400 }
        kind: { type: string, enum: [events, funnel, retention, path, attribution, sql], description: 'sql = 自定義 SQL（query 為 {sql, params?}；以沙盒規則驗證，卡片以表格或折線／長條呈現）' }
        query: { type: object, additionalProperties: true }
        chart: { type: string, enum: [auto, line, area, bar, stacked, pie, percent, stat, table], default: auto, description: 'auto 依粒度與分組自動選；area 面積、stacked 堆疊長條、pie 圓餅（總量切片）、percent 百分比堆疊；只對 events／sql 卡片有意義' }
        format: { type: string, enum: [auto, int, dec2, pct0, pct2, twd0, twd2], default: auto, description: '數值格式：auto 自動縮寫（萬／億）、int 取整、dec2 兩位小數、pct0／pct2 百分比、twd0／twd2 貨幣 NT$' }
        shared: { type: object, properties: { roles: { type: array, items: { type: string } }, users: { type: array, items: { type: string } } } }
        add_to: { type: array, items: { type: string }, description: 同時加進這些看板（id）；或用 new_dashboard 新建 }
        new_dashboard: { type: string, description: 新建看板名稱並加入 }
    Bookmark:
      allOf:
        - $ref: '#/components/schemas/BookmarkCreate'
        - type: object
          properties:
            id: { type: string }
            owner: { type: string }
            created_at: { type: string }
            updated_at: { type: string }
            mine: { type: boolean }
            editable: { type: boolean }
            used_in: { type: array, items: { type: object, properties: { dashboard: { type: string }, name: { type: string } } } }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500 }
        time: { type: object, description: 'preset 或 from/to；沒給就看板的 preset 或最近 30 天' }
        max_cards: { type: integer, default: 6, maximum: 6 }
        parser: { type: string, enum: [auto, rules, llm], default: auto, description: auto = 有金鑰用 llm，否則 rules }
    AskCard:
      type: object
      properties:
        title: { type: string }
        kind: { type: string, enum: [events, funnel, retention, path, attribution] }
        query: { type: object, additionalProperties: true }
        chart: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        explanation: { type: string, description: 為什麼這樣配置（模型、事件、分組、時間） }
        sql_preview: { type: string, nullable: true }
        warnings: { type: array, items: { type: string } }
        selected: { type: boolean, description: 信心度 ≥ 0.6 預設勾選 }
    AskResponse:
      type: object
      properties:
        run_id: { type: string }
        parser: { type: string, enum: [rules, llm] }
        cards: { type: array, items: { $ref: '#/components/schemas/AskCard' } }
        candidates: { type: object, properties: { events: { type: array, items: { type: object, properties: { name: { type: string }, cn: { type: string } } } }, dimensions: { type: array, items: { type: string } } } }
        unmatched: { type: array, items: { type: string }, description: 問題裡對不上語意層的片段 }
        dashboard: { type: string, nullable: true }
    DashboardExplain:
      type: object
      properties:
        method: { type: string, enum: [rules, llm] }
        narrative: { type: string, nullable: true, description: mode=llm 時的敘述（三段內） }
        summary: { type: array, items: { type: string }, description: 三句總結 }
        cards: { type: array, items: { type: object, properties: { card: { type: string }, title: { type: string }, kind: { type: string }, line: { type: string }, signal: { type: string, enum: [up, down, flat, none] }, warnings: { type: array, items: { type: string } } } } }
        generated_at: { type: string }
    DashboardRender:
      type: object
      properties:
        artifact_id: { type: string }
        dashboard: { type: string }
        url: { type: string, description: 登入下載 }
        share_url: { type: string, description: 帶簽章 token 的分享連結（到期即失效） }
        audience: { type: string }
        created_by: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        bytes: { type: integer }
        cards_included: { type: integer }
        cards_skipped: { type: array, items: { type: object, properties: { card: { type: string }, title: { type: string }, why: { type: string } } } }
        downloads: { type: integer }
        expired: { type: boolean }
    DashboardSchedule:
      type: object
      required: [hour, audience]
      properties:
        id: { type: string }
        weekday: { type: integer, nullable: true, minimum: 0, maximum: 6, description: 0=週一…6=週日；null = 每天 }
        hour: { type: integer, minimum: 0, maximum: 23, description: 台北時間 }
        audience: { type: object, properties: { roles: { type: array, items: { type: string } }, emails: { type: array, items: { type: string }, description: 只能是白名單網域（deploy 設定 mail.allowed_domains） } } }
        expires_days: { type: integer, default: 14 }
        include_explain: { type: boolean, default: true }
        status: { type: string, enum: [pending_approval, active, paused, rejected] }
        approval: { type: string }
        created_by: { type: string }
        last_run: { type: object, nullable: true, properties: { at: { type: string }, artifact_id: { type: string }, status: { type: string, enum: [sent, rendered_no_transport, failed] }, recipients: { type: integer }, error: { type: string } } }
    Member:
      type: object
      description: 成員目錄一列（登入審計 ∪ 本機帳號 ∪ 本地指派）
      properties:
        id: { type: string, description: provider:subject }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        provider: { type: string }
        source: { type: string, enum: [sso, local] }
        roles: { type: array, items: { type: string }, description: 最近一次登入的角色 ∪ 本地指派（含到期前） }
        status: { type: string, enum: [active, disabled, locked, expired, never_logged_in, no_role] }
        mfa: { type: boolean }
        last_login: { type: number, nullable: true }
        login_failed_7d: { type: integer }
        sessions: { type: integer }
        assignments: { type: integer }
        expires_at: { type: number, nullable: true, description: 本機帳號到期 }
    AuditStats:
      type: object
      properties:
        days: { type: integer }
        scope: { type: string, enum: [all, mine] }
        tiles: { type: object, additionalProperties: { type: integer } }
        daily: { type: array, items: { type: object } }
        by_module: { type: array, items: { type: object, properties: { module: { type: string }, n: { type: integer } } } }
        by_role: { type: array, items: { type: object } }
        top_sensitive: { type: array, items: { type: object } }
        approvals: { type: object }
        agent: { type: object }
        anomalies: { type: array, items: { type: object, properties: { rule: { type: string }, cn: { type: string }, severity: { type: string }, user: { type: string }, bucket: { type: string }, n: { type: integer } } } }
        rules: { type: array, items: { type: object } }
    Settings:
      type: object
      properties:
        sections: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, source: { type: string }, items: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, value: {}, note: { type: string } } } } } } }
        edit: { type: object, properties: { enabled: { type: boolean }, stage: { type: string }, note: { type: string } } }
    Me:
      type: object
      required: [user, roles, grants, masking, scope, session]
      properties:
        user: { type: object, properties: { id: { type: string, description: provider:subject }, username: { type: string }, name: { type: string }, email: { type: string }, provider: { type: string } } }
        roles: { type: array, items: { type: object, properties: { key: { type: string }, cn: { type: string }, active: { type: boolean, description: admin 未 step-up 時為 false } } } }
        grants: { type: object, additionalProperties: { type: array, items: { type: string, enum: [view, use, export, approve, admin] } } }
        masking: { type: object, additionalProperties: { type: object, properties: { level: { type: string }, policy: { type: string } } } }
        scope: { type: object, properties: { kind: { type: string, enum: [global, aggregate_only, restricted] }, k_anonymity: { type: integer }, lookback_days: { type: integer, nullable: true }, projects: { type: array, items: { type: string } }, branches: { type: array, items: { type: string } } } }
        session: { type: object, properties: { idp_mode: { type: string, enum: [broker, direct] }, amr: { type: array, items: { type: string } }, auth_time: { type: integer }, step_up_needed: { type: boolean }, csrf_header: { type: string } } }
    Role:
      type: object
      required: [name, scope, grants]
      properties:
        key: { type: string, description: 系統產生（custom_*），內建角色為固定值 }
        name: { type: string, description: 自訂名稱 }
        description: { type: string }
        scope: { type: string, enum: [global, branch, agent, aggregate_only] }
        lookback_days: { type: integer, description: 0 = 不限 }
        grants:
          type: object
          description: 模組 → 動作集合（v 可見 u 可用 e 匯出 a 審批 d 設定）
          additionalProperties: { type: array, items: { type: string, enum: [view, use, export, approve, admin] } }
        masking_profile: { type: string, enum: [default, stricter], default: default }
        builtin: { type: boolean, readOnly: true }
    Destination:
      type: object
      required: [name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [webhook, kafka, gcs, sftp, s3], description: 'webhook／kafka／gcs 給受眾推送與實時輸出；sftp／s3（S3 相容物件儲存，含 MinIO）給資料輸出任務的批量檔案' }
        url: { type: string, description: webhook 專用 }
        config: { type: object, additionalProperties: true, description: '類型專用設定：sftp {host, port, path, username, auth: password|key, host_key_fingerprint}；s3 {endpoint, bucket, prefix, region, access_key_id, path_style}；kafka {bootstrap, topic}；gcs {bucket, prefix}。密碼／私鑰／secret key 不在這裡，只在 secret_ref' }
        secret_ref: { type: string, description: '密鑰庫參照（kv/data/dmp/<env>/<name>#<key>）：Webhook 簽章密鑰、SFTP 密碼或私鑰、S3 secret key；永不接受明文' }
        identifier: { type: string, enum: [customer_code, one_id, client_id] }
        allowed_tags: { type: array, items: { type: string } }
        masking_level: { type: string, enum: [L1, L2], default: L2 }
        ip_allowlist: { type: array, items: { type: string } }
        mtls: { type: boolean }
        consent_required: { type: array, items: { type: string } }
        status: { type: string, enum: [active, paused, pending_approval] }
    Push:
      type: object
      required: [segment_id, destination_ids, mode]
      properties:
        id: { type: string }
        segment_id: { type: string }
        segment_name: { type: string }
        destination_ids: { type: array, items: { type: string } }
        mode: { type: string, enum: [delta, full] }
        schedule: { type: string, enum: [now, after_batch, cron], default: after_batch }
        cron: { type: string, description: 'schedule=cron 時：HH:MM（每日）' }
        include_tags: { type: array, items: { type: string }, description: 附帶標籤（須在每個目的地 allowed_tags 內；L2 數值一律區間化） }
        status: { type: string, enum: [pending_approval, active, paused, rejected, deleted] }
        approval_id: { type: string, nullable: true }
        owner: { type: string }
        created_at: { type: string, format: date-time }
        last_delivered_version: { type: integer, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_result: { type: object, nullable: true, description: '{added, removed, batches, ok, failed}' }
    Delivery:
      type: object
      properties:
        id: { type: string, description: 冪等鍵 X-DMP-Delivery-Id }
        push_id: { type: string }
        segment_id: { type: string }
        destination_id: { type: string }
        version: { type: integer }
        mode: { type: string, enum: [delta, full, test] }
        event: { type: string, enum: [audience.delta, audience.full, audience.complete, audience.test] }
        batch: { type: object, properties: { index: { type: integer }, total: { type: integer }, size: { type: integer } } }
        status: { type: string, enum: [ok, retrying, failed, dlq] }
        attempts: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }
        response: { type: object, nullable: true, properties: { status: { type: integer, nullable: true }, ms: { type: integer }, body: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        replay_of: { type: string, nullable: true }
    OpsStage:
      type: object
      description: 資料流的一段（sources／warehouse／serving／activation）
      properties:
        key: { type: string }
        cn: { type: string }
        status: { type: string, enum: [ok, warn, error, unknown] }
        summary: { type: string, description: 一行摘要（吞吐／延遲） }
        items: { type: array, items: { type: object, additionalProperties: true }, description: 該段的明細列（同步任務、表、模組、目的地） }
    OpsPipeline:
      type: object
      properties:
        at: { type: string, format: date-time }
        stages: { type: array, items: { $ref: '#/components/schemas/OpsStage' } }
        quality:
          type: array
          description: 資料品質指標（隔離率、拒絕率、K 匿名抑制、同步失敗）
          items: { type: object, properties: { key: { type: string }, cn: { type: string }, value: { type: number, nullable: true }, text: { type: string }, status: { type: string, enum: [ok, warn, error, unknown] } } }
        slo: { type: object, additionalProperties: true, description: 設計目標（backend/ops/sla.yaml） }
    OpsQueryPerf:
      type: object
      properties:
        window: { type: string }
        at: { type: string, format: date-time }
        modules:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              cn: { type: string }
              n: { type: integer }
              errors: { type: integer }
              p50_ms: { type: number, nullable: true }
              p95_ms: { type: number, nullable: true }
              p99_ms: { type: number, nullable: true }
              avg_rows: { type: number, nullable: true }
              sla_ms: { type: integer, nullable: true, description: 'P95 目標（backend/ops/sla.yaml）' }
              sla_ok: { type: boolean, nullable: true }
              scan_rows_avg: { type: number, nullable: true, description: 'system.query_log（ClickHouse 可用時）' }
              memory_peak_mb: { type: number, nullable: true }
        slow: { type: array, description: 最慢的 10 條（sql_hash、模組、耗時、使用者）, items: { type: object, additionalProperties: true } }
        clickhouse: { type: object, nullable: true, additionalProperties: true, description: system.query_log／system.metrics 摘要 }
    OpsBatchJobs:
      type: object
      properties:
        at: { type: string, format: date-time }
        jobs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              cn: { type: string }
              kind: { type: string, enum: [sync, routine] }
              schedule: { type: string }
              enabled: { type: boolean }
              last_at: { type: string, nullable: true }
              last_status: { type: string, nullable: true }
              last_ms: { type: number, nullable: true }
              last_detail: { type: string, nullable: true }
              next_at: { type: string, nullable: true }
              rerunnable: { type: boolean }
        storage:
          type: array
          items: { type: object, properties: { name: { type: string }, rows: { type: integer, nullable: true }, bytes: { type: integer, nullable: true }, parts: { type: integer, nullable: true }, note: { type: string } } }
    OpsAlert:
      type: object
      properties:
        key: { type: string }
        cn: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        value: { type: number, nullable: true }
        threshold: { type: number }
        op: { type: string, enum: ['>', '>=', '<', '<='] }
        unit: { type: string }
        subject: { type: string, description: 觸發的對象（任務／模組／目的地） }
        text: { type: string }
        firing: { type: boolean }
    OpsPanel:
      type: object
      properties:
        id: { type: integer, description: 與 Grafana 看板 panel id 相同 }
        key: { type: string }
        cn: { type: string }
        section: { type: string, enum: [platform, pipeline, query, activation] }
        kind: { type: string, enum: [timeseries, stat] }
        unit: { type: string, description: 'reqps|s|ms|percentunit|m|bytes|short|none' }
        expr: { type: string, description: 'Grafana 面板的 PromQL（嵌入查詢）' }
        thresholds: { type: array, items: { type: number } }
        series: { type: array, items: { type: object, properties: { name: { type: string }, points: { type: array, items: { type: object, properties: { t: { type: string, format: date-time }, v: { type: number, nullable: true } } } } } } }
    OpsSeries:
      type: object
      properties:
        hours: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval_s: { type: integer, description: 快照間隔（秒） }
        points: { type: integer, description: 緩衝內的快照數 }
        grafana: { type: object, properties: { url: { type: string, nullable: true, description: 'DMP_GRAFANA_URL；null = 未設定，頁面只顯示 API 快照' }, dashboard_uid: { type: string } } }
        panels: { type: array, items: { $ref: '#/components/schemas/OpsPanel' } }
    NotifyConfig:
      type: object
      properties:
        email: { type: object, properties: { enabled: { type: boolean }, to_roles: { type: array, items: { type: string }, description: 依角色從成員目錄取 email（admin、it_admin、digital_ops…） }, extra_to: { type: array, items: { type: string, format: email } }, subject_prefix: { type: string } } }
        line: { type: object, properties: { enabled: { type: boolean }, channel_access_token_ref: { type: string, description: 'secret_ref（kv/…#token、projects/…/secrets/…、secret://…）；回傳時原樣，不回明文' }, to: { type: array, items: { type: string }, description: 'LINE userId（U…）／groupId（C…）／roomId（R…）；多個用 multicast' }, api_base: { type: string, default: 'https://api.line.me' } } }
        policy: { type: object, properties: { min_severity: { type: string, enum: [low, medium, high, critical], default: medium }, cooldown_min: { type: integer, default: 60, description: 同一告警（key＋對象）再次通知的最短間隔 }, notify_resolved: { type: boolean, default: true }, quiet_hours: { type: object, nullable: true, properties: { start: { type: integer }, end: { type: integer }, tz: { type: string } }, description: 靜音時段只送 critical } } }
        updated_at: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
        available: { type: object, description: 執行環境是否具備：email 需 DMP_SMTP_URL、line 需 token 可解析, properties: { email: { type: boolean }, line: { type: boolean } } }
    Notification:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        channel: { type: string, enum: [email, line] }
        kind: { type: string, enum: [alert, resolved, test, alertmanager] }
        alerts: { type: array, items: { type: string }, description: 告警鍵＋對象 }
        recipients: { type: integer }
        status: { type: string, enum: [ok, failed, skipped] }
        response: { type: string, nullable: true }
        text: { type: string, description: 送出的訊息（純文字） }
    OpsAlerts:
      type: object
      properties:
        at: { type: string, format: date-time }
        firing: { type: array, items: { $ref: '#/components/schemas/OpsAlert' } }
        rules: { type: array, items: { $ref: '#/components/schemas/OpsAlert' } }
        notify: { type: array, items: { type: string }, description: 通知角色（第一階段只在頁面顯示） }
    LegacyGroup:
      type: object
      properties:
        name: { type: string, description: 舊平台欄位名（user_group_xxx／user_tag_xxx） }
        kind: { type: string, enum: [segment, tag] }
        cn: { type: string, description: 顯示名（去掉前綴） }
        users: { type: integer, description: 舊平台端人數 }
        values: { type: integer, nullable: true, description: 標籤值種類數 }
        status: { type: string, enum: [pending, snapshot, rebuilt, skipped] }
        dmp: { type: object, nullable: true, properties: { type: { type: string, enum: [segment, tag] }, id: { type: string }, name: { type: string }, users: { type: integer, nullable: true }, diff_pct: { type: number, nullable: true, description: '(DMP − 舊平台) ÷ 舊平台' } } }
        note: { type: string }
        updated_at: { type: string, format: date-time }
    LegacyGroupList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LegacyGroup' } }
        scanned_at: { type: string, format: date-time, nullable: true }
        summary: { type: object, properties: { total: { type: integer }, pending: { type: integer }, snapshot: { type: integer }, rebuilt: { type: integer }, skipped: { type: integer } } }
    TagCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 60, description: 顯示名 }
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$', description: '標籤名稱（dmp.user_tags.tag_id；留空由顯示名產生）' }
        directory: { type: string, description: 所屬目錄（客戶價值／交易偏好／風險／活躍／行銷…） }
        description: { type: string }
        dtype: { type: string, enum: [string, number, bool], default: string }
        kind: { type: string, enum: [values, sql, metric, firstlast, rfm, import], description: 'import＝快照（目前只由舊平台標籤遷移建立：每人一個值存於 dmp.tag_imports，計算時照抄成新版本）；values＝自定義標籤值：每個值一條用戶規則（UsersQuery；最多 24 值）；sql＝SQL 標籤：SELECT one_id_uint, tag_value；metric＝基礎指標值（事件在窗口內的次數／總和／均值／最大／最小／有行為天數，可分桶）；firstlast＝首末次特徵（首次或末次某事件的日期、距今天數分桶、或當時某屬性值）；rfm＝RFM（最近一次距今 R、次數 F、金額 M 各分 n 級，輸出 R5F4M3 分數或八類客群）' }
        values: { type: array, maxItems: 24, items: { type: object, required: [value, rule], properties: { value: { type: string }, rule: { $ref: '#/components/schemas/UsersQuery' } } } }
        sql: { type: string }
        import_id: { type: string, description: 'kind=import 的快照 id' }
        project: { type: string, description: 'metric／firstlast／rfm 的事件專案（預設 altatech_dmp）' }
        spec:
          type: object
          description: 'metric／firstlast／rfm 的參數（依 kind 取用）'
          properties:
            event: { type: string, description: 事件名（語意層目錄） }
            agg: { type: string, enum: [count, sum, avg, max, min, days], description: 'metric：count 次數、sum／avg／max／min 需 field、days 有行為天數' }
            field: { type: string, description: 'metric 的數值欄位（amount、props.xxx）；firstlast feature=field 時的屬性；與 UsersQuery 的欄位鍵同一套' }
            window_days: { type: integer, minimum: 0, maximum: 730, description: '回溯天數（以計算基準日往前）；firstlast 可為 0＝不限' }
            buckets: { type: array, maxItems: 10, items: { type: number }, description: '遞增分桶界線：<b0、b0–b1、…、≥bn；metric 與 firstlast(days_since) 可用；不給則輸出原值' }
            which: { type: string, enum: [first, last], description: firstlast }
            feature: { type: string, enum: [date, days_since, field], description: 'firstlast：首末次日期、距基準日天數（可分桶）、當時的屬性值' }
            amount_field: { type: string, default: amount, description: 'rfm 的金額欄位' }
            bins: { type: integer, minimum: 2, maximum: 10, default: 5, description: 'rfm 每個維度分幾級（ntile）' }
            output: { type: string, enum: [score, segment], default: score, description: 'rfm：score＝R5F4M3；segment＝八類客群（重要價值／重要發展／重要保持／重要挽留／一般價值／一般發展／一般保持／一般挽留，以各維度高於中位為高）' }
        update: { type: object, description: '預設例行每日 02:00 計算（動態標籤：每日凌晨重算符合規則的受眾）；manual 只在手動觸發時計算', properties: { mode: { type: string, enum: [manual, routine] }, freq: { type: string, enum: [daily, weekly, monthly] }, earliest: { type: string, example: '02:00' }, keep: { type: integer, minimum: 1, maximum: 100 } } }
        fields: { type: object, description: 自定義欄位（所屬部門、需求提出人、需求類別）, additionalProperties: { type: string } }
    Tag:
      allOf:
        - $ref: '#/components/schemas/TagCreate'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [draft, pending_approval, active, paused, recycled] }
            owner: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            approval: { type: object, properties: { status: { type: string, enum: [none, pending, approved, rejected] }, by: { type: string, nullable: true }, at: { type: string, nullable: true }, note: { type: string } } }
            latest: { type: object, nullable: true, properties: { version: { type: integer }, basetime: { type: string }, users: { type: integer, nullable: true }, status: { type: string }, computed_at: { type: string }, ms: { type: integer }, distribution: { type: array, items: { type: object, properties: { value: { type: string }, users: { type: integer } } } }, error: { type: string, nullable: true } } }
            versions: { type: array, items: { type: object } }
            lineage: { type: object, properties: { up: { type: array, items: { type: string } }, down: { type: array, items: { type: string } } } }
            recycled_at: { type: string, nullable: true }
    TagSnapshot:
      type: object
      properties:
        one_id: { type: string }
        customer_code: { type: string, description: 代碼化 }
        version: { type: integer }
        computed_at: { type: string, format: date-time }
        tags: { type: object, additionalProperties: {} }
    TagChange:
      type: object
      properties:
        one_id: { type: string }
        customer_code: { type: string }
        tag_id: { type: string }
        old: {}
        new: {}
        version: { type: integer }
        changed_at: { type: string, format: date-time }
    Insight:
      type: object
      required: [kind, title, summary]
      properties:
        id: { type: string }
        kind: { type: string, enum: [funnel, anomaly, risk, campaign, opportunity, answer] }
        title: { type: string }
        summary: { type: string }
        hypothesis: { type: string }
        evidence: { type: array, items: { type: object } }
        chart_spec: { type: object }
        scope: { type: object }
        confidence: { type: number, minimum: 0, maximum: 1 }
        severity: { type: string, enum: [low, medium, high, critical] }
        actions: { type: array, items: { type: object } }
        created_by: { type: object }
        status: { type: string, enum: [open, acknowledged, resolved, dismissed] }
