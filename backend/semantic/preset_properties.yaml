open_questions:
  - 服務端／其它來源的事件（SERVER／OTHER）在 SDK 全埋點事件表仍列出 $ip、$lib、$lib_version、$is_login_id 等欄位；本檔不讓它們繼承 SDK 預置屬性，只帶事件規格表明列的屬性。
