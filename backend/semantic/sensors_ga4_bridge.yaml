# 神策 → GA4 事件／屬性橋接表（generated）。接入時 Flink eventize 以 ga4_to_sensors 把 GA 事件名轉回正式事件名。
version: 1
generated_by: backend/migration/bridge.py（由 events.yaml 產生；不要手改）
principle: 正式事件名 = 神策事件名；GA 上報 ga4_event；接入時 ga4_event → sensors_event（docs/22 §2）
limits:
  event_name_len: 40
  param_name_len: 40
  param_value_len: 100
  params_per_event: 25
  user_property_name_len: 24
  user_property_value_len: 36
  user_properties_per_project: 25
  distinct_event_names_per_app_instance: 500
  custom_dimensions_event_scoped_360: 125
  custom_dimensions_user_scoped_360: 100
  custom_metrics_360: 125
reserved_prefixes:
- firebase_
- google_
- ga_
preset_events:
  $pageview:
    ga4_event: page_view
    kind: auto
    note: gtag 自動；page_location／page_referrer／page_title 自動帶
  $WebClick:
    ga4_event: web_click
    kind: custom
    note: GA 的 click 只收 outbound；全站點擊改自訂事件，帶 element_id／element_content／page_group
  $WebStay:
    ga4_event: user_engagement
    kind: auto
    note: GA 以 engagement_time_msec 近似；停留時長口徑不同，分析時用 session 口徑
  $AppViewScreen:
    ga4_event: screen_view
    kind: auto
    note: Firebase 自動；firebase_screen／firebase_screen_class 對應 $screen_name／$title
  $AppStart:
    ga4_event: app_start
    kind: custom
    note: session_start 口徑不同（30 分鐘）；保留自訂 app_start 以銜接神策「啟動」指標
  $AppEnd:
    ga4_event: app_end
    kind: custom
    note: 帶 event_duration（毫秒）對應 $event_duration
  $AppClick:
    ga4_event: app_click
    kind: custom
    note: 帶 element_id／element_content／screen_name
  $AppInstall:
    ga4_event: first_open
    kind: auto
    note: Firebase 自動
  $SignUp:
    ga4_event: sign_up
    kind: recommended
    note: 帶 method
  $AppPushClick:
    ga4_event: notification_open
    kind: auto
    note: FCM 推播自動；非 FCM 推播改自訂 push_click
  $AppPushReceived:
    ga4_event: notification_receive
    kind: auto
    note: FCM 推播自動
  $AppCrashed:
    ga4_event: app_exception
    kind: auto
    note: Firebase Crashlytics
  $ShortUrlRedirect:
    ga4_event: short_url_redirect
    kind: custom
    note: 短鏈服務以 Measurement Protocol 上報，帶 client_id
preset_props:
  $page_url: page_location
  $referrer: page_referrer
  $title: page_title
  $screen_name: firebase_screen
  $app_version: app_info.version
  $os: device.operating_system
  $os_version: device.operating_system_version
  $manufacturer: device.mobile_brand_name
  $model: device.mobile_model_name
  $browser: device.web_info.browser
  $utm_source: traffic_source.source / manual_campaign.source
  $utm_medium: traffic_source.medium / manual_campaign.medium
  $utm_campaign: traffic_source.name / manual_campaign.campaign_name
  $lib: platform
  $city: geo.city
  $province: geo.region
  $ip: 不送（GA 不匯出 IP）
  $is_first_day: first_open／ga_session_number=1 推導
  $is_first_time: ga_session_number=1 推導
