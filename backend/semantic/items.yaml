# Item 表（事件以外的實體）。事件以 join_key 關聯；分析時 dictGet 取維度，不複製到事件表。敏感等級同 dimensions.yaml。
items:
  - type: account
    cn: 交易帳戶
    primary_key: account_no_token        # FPE 代碼化
    source: trade_core.cdc
    sync: realtime
    join_key: events.entity_id where entity_type='account'
    owner_link: customer_code -> users.one_id   # 一客戶多帳戶
    properties: [{ key: account_type, type: enum, sensitivity: L1 }, { key: branch_id, type: string, sensitivity: L1 }, { key: agent_id, type: string, sensitivity: L3 }, { key: opened_at, type: date, sensitivity: L1 }, { key: status, type: enum, sensitivity: L1 }, { key: margin_enabled, type: bool, sensitivity: L2 }]
  - type: instrument
    cn: 商品
    primary_key: symbol
    source: instrument_master.batch
    sync: daily 05:30
    join_key: events.symbol
    properties: [{ key: name, type: string, sensitivity: L0 }, { key: market, type: enum, sensitivity: L0 }, { key: industry, type: string, sensitivity: L0 }, { key: type, type: enum, sensitivity: L0 }, { key: is_etf, type: bool, sensitivity: L0 }, { key: lot_size, type: number, sensitivity: L0 }]
    dictionary: { name: dict_instrument, layout: complex_key_hashed, lifetime: 3600 }
  - type: agent
    cn: 營業員
    primary_key: agent_id_token
    source: crm.cdc
    sync: daily
    join_key: users.agent_id, events.agent_id
    row_level_key: true
    properties: [{ key: branch_id, type: string, sensitivity: L1 }, { key: team, type: string, sensitivity: L1 }, { key: level, type: enum, sensitivity: L2 }, { key: active, type: bool, sensitivity: L1 }]
  - type: branch
    cn: 分公司
    primary_key: branch_id
    source: hr.org_tree
    sync: daily
    join_key: users.branch_id, events.branch_id
    row_level_key: true
    properties: [{ key: name, type: string, sensitivity: L0 }, { key: region, type: enum, sensitivity: L0 }, { key: manager_id, type: string, sensitivity: L3 }]
  - type: campaign
    cn: 行銷活動
    primary_key: campaign_id
    source: ma.api + ga.utm
    sync: hourly
    join_key: events.campaign_id, events.utm_campaign
    properties: [{ key: name, type: string, sensitivity: L0 }, { key: channel, type: enum, sensitivity: L0 }, { key: start_at, type: date, sensitivity: L0 }, { key: end_at, type: date, sensitivity: L0 }, { key: budget_bucket, type: enum, sensitivity: L2 }, { key: owner, type: string, sensitivity: L1 }]
  - type: reason_code
    cn: 碼表（委託失敗原因）
    primary_key: code
    source: manual
    sync: manual
    join_key: events.reason_code
    properties: [{ key: desc, type: string, sensitivity: L0 }, { key: category, type: enum, sensitivity: L0 }, { key: user_fixable, type: bool, sensitivity: L0 }]
