# 本機開發環境（非正式部署）。正式部署見 docs/02-backend-architecture.md §9。
services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    volumes: ["./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: dmp, POSTGRES_PASSWORD: dmp, POSTGRES_DB: dmp }
    ports: ["5432:5432"]
    volumes: ["./clickhouse/insight_store.sql:/docker-entrypoint-initdb.d/insight_store.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: dmp, MINIO_ROOT_PASSWORD: dmp-secret }
    ports: ["9002:9000", "9001:9001"]
