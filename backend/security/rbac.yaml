# 角色 × 模組 × 動作 矩陣；scope 型別：global | project | segment | aggregate_only（branch / agent 保留給自訂角色，本系統內建角色不用）
actions: [view, use, export, approve, admin]
modules: [overview, events, funnel, path, attribution, users, profile, segments, triggers, integration, ai_ask, ai_admin, ai_skills, governance, audit, iam]
# ai_skills（AI 工作台技能庫，docs/38 §6.6、docs/39 §7.5）：view = 看口徑與參數狀態；use = 編輯草案、乾跑比對、送發布、回復；approve = 核可發布（不可核可自己送的）。
# 角色分配【提案，待 Windy 核定，尚未生效】：行銷／資訊管理 view；數據分析 view+use；數位經營 view+approve。核定前只有系統管理員（"*"）有權限。
roles:
  # 本系統的使用者只有五種：系統管理員、行銷、數據分析、數位經營、資訊管理。營業員／分公司主管不進本系統（客戶歸屬只是維度）。
  admin:        { cn: 系統管理員, scope: global, grants: { "*": [view, use, export, approve, admin] } }
  marketing:    { cn: 行銷,       scope: global, grants: { overview: [view], events: [view, use], funnel: [view, use], path: [view, use], attribution: [view, use], users: [view, use], segments: [view, use], triggers: [view, use], ai_ask: [use], audit: [view] }, note: 分群／推送單／觸發規則可建立，生效需數位經營審批；用戶列表隱碼、不可匯出、不可細查 }
  data_analyst: { cn: 數據分析,   scope: global, grants: { overview: [view, use], events: [view, use, export], funnel: [view, use, export], path: [view, use, export], attribution: [view, use, export], users: [view, use, export], profile: [use], segments: [view, use], triggers: [view], integration: [view], ai_ask: [use], governance: [view], audit: [view] }, sql_sandbox: true, note: 匯出走審批；細查需理由 }
  digital_ops:  { cn: 數位經營,   scope: global, grants: { overview: [view, use], events: [view, use, export], funnel: [view, use, export], path: [view, use, export], attribution: [view, use, export], users: [view, use, export], profile: [use], segments: [view, use, approve], triggers: [view, use, approve], integration: [view], ai_ask: [use, approve], ai_admin: [view], governance: [view], audit: [view, use], iam: [view] }, note: 業務負責人：審批分群／推送／觸發／agent 提議／匯出／L2 揭露 }
  it_admin:     { cn: 資訊管理,   scope: global, grants: { overview: [view, use], events: [view, use], funnel: [view, use], path: [view, use], attribution: [view, use], segments: [view], triggers: [view], integration: [view, use, export, approve, admin], ai_ask: [use], ai_admin: [view, admin], governance: [view, use, export, admin], audit: [view, use, export], iam: [view] }, deny: { profile: [use], users: [view, use, export] }, note: 數據整合、資料流與效能、元事件／用戶表／維度表治理、平台技術設定、審計日誌；不看個人 }
  svc_insight:      { cn: AI 服務身份, scope: aggregate_only, grants: { events: [use], funnel: [use], path: [use], attribution: [use], segments: [view], ai_ask: [use] }, deny: { profile: [use], users: [export] } }
# 自訂角色：由 UI / API（POST /v1/iam/roles）建立，存於 PostgreSQL iam_roles，與本檔內建角色合併載入；
# 規則：u 蘊含 v、e 蘊含 u；系統管理員可新增、修改、刪除任何角色（admin 角色本身除外）；刪除仍有指派的角色須指定改派角色；變更寫審計 role.changed／role.deleted 並需雙人複核。
custom_roles:
  enabled: true
  key_prefix: custom_
  second_review: { enabled: true, approvers: [admin, digital_ops], ttl_days: 7 }   # 自訂角色的建立／修改／刪除先成審批單（role_change），由另一位系統管理員或數位經營核可後才生效；不可自審
  example:
    custom_vendor_analyst: { cn: 外包分析（專案限定）, scope: project, lookback_days: 180, grants: { overview: [view], events: [view, use], funnel: [view, use], segments: [view], ai_ask: [use], audit: [view] } }
combination:
  grants: union              # 多角色：功能權限取聯集
  masking: strictest         # 欄位權限取最嚴格
  scope: union
assignment:
  expiry_supported: true
  break_glass: { approvers: [admin, digital_ops], max_hours: 4 }   # 雙人：申請者（系統管理員）之外的系統管理員或數位經營核可（審批單 break_glass），核可後才建立臨時指派，到期自動失效
k_anonymity: { min_group_size: 20 }
