# 身分提供者（IdP）與登入政策。密鑰只能是 secret_ref（不存明文）。角色矩陣在 security/rbac.yaml，本檔只管「誰」與「群組 → 角色」。
#
# 兩種部署模式（docs/24 §2）：
#   broker（預設）：Keycloak 當身分代理。Entra ID 以 OIDC 身分提供者掛進 Keycloak，機房 AD 以 LDAP User Federation 掛進 Keycloak；
#                  本系統只對 Keycloak 講一種協定（OIDC 授權碼 + PKCE）。LDAP 帳密驗證、MFA、Conditional Access 都在 IdP 端。
#   direct：客戶不允許多一層 Keycloak 時，本系統直接對 Entra ID（OIDC）；另可開本機帳號（外包／單機）。
# AD 一律經 Keycloak 接入（API → Keycloak → AD）：本系統不持有 AD 服務帳號、不做 LDAPS bind。原本直連 AD 的參數搬到 Keycloak User Federation，對照見 docs/24 §2.1。
version: 1
mode: broker                                   # broker | direct

providers:
  keycloak:                                    # mode=broker 用
    kind: oidc
    cn: 公司帳號（SSO）
    issuer: https://sso.internal/realms/dmp
    client_id: altatech-dmp
    client_secret_ref: kv/data/dmp/auth/keycloak#client_secret
    scopes: [openid, profile, email, groups]
    groups_claim: groups                       # Keycloak mapper：Group Membership → groups（full path 關閉）
    redirect_uri: https://dmp.internal/auth/callback
    post_logout_redirect_uri: https://dmp.internal/login
    pkce: S256
    require_amr: []                            # broker 模式 MFA 由 Keycloak 強制；需要時填 [mfa]
  entra:                                       # mode=direct 用；Entra ID（Azure AD）v2.0
    kind: oidc
    cn: Microsoft Entra ID
    issuer: https://login.microsoftonline.com/{tenant_id}/v2.0
    tenant_id_ref: kv/data/dmp/auth/entra#tenant_id
    client_id_ref: kv/data/dmp/auth/entra#client_id
    client_secret_ref: kv/data/dmp/auth/entra#client_secret   # 或改用憑證（federated credential）免密鑰
    scopes: [openid, profile, email]
    groups_claim: groups                       # App registration › Token configuration › groups claim（Security groups，以 Object ID 發）
    groups_overage: graph_memberof             # 群組 > 200 個時 token 無 groups，改呼叫 Graph /me/memberOf（需 GroupMember.Read.All）
    redirect_uri: https://dmp.internal/auth/callback
    post_logout_redirect_uri: https://dmp.internal/login
    pkce: S256
    require_amr: [mfa]                         # ID token 的 amr 需含 mfa（由 Conditional Access 對本 App 強制 MFA）
    tid_check: true                            # 只接受本租戶（iss 含 tenant）

role_mapping:                                  # IdP 群組 → rbac.yaml 角色。Entra 用群組 Object ID（GUID）；Keycloak（含經 Federation 帶進來的 AD 群組）用群組名
  by_group:
    - { group: DMP-Admins,     entra_id: 1c7b1c9a-0000-4000-8000-000000000001, roles: [admin] }
    - { group: DMP-Marketing,  entra_id: 1c7b1c9a-0000-4000-8000-000000000002, roles: [marketing] }
    - { group: DMP-Analysts,   entra_id: 1c7b1c9a-0000-4000-8000-000000000003, roles: [data_analyst] }
    - { group: DMP-DigitalOps, entra_id: 1c7b1c9a-0000-4000-8000-000000000004, roles: [digital_ops] }
    - { group: DMP-IT,         entra_id: 1c7b1c9a-0000-4000-8000-000000000005, roles: [it_admin] }
  default_roles: []                            # 不在任何群組 → 無角色 → 登入成功但只看到「尚未授權」頁（審計 auth.login.no_role）
  assignment_overlay: true                     # /v1/iam/assignments 的本地指派（自訂角色、到期、臨時提權）疊加在群組對應之上；只能加不能減內建對應？否：可 deny
  admin_requires: { amr: [mfa], max_auth_age_s: 900 }   # 取得 admin 角色的 session 必須 MFA 且認證時間在 15 分鐘內（否則降級為唯讀直到 step-up）

session:
  cookie: { name: dmp_sid, secure: true, http_only: true, same_site: Lax, path: / }
  idle_timeout_s: 1800                         # 30 分鐘無操作登出
  absolute_timeout_s: 28800                    # 8 小時強制重新登入
  csrf: { header: X-CSRF-Token, cookie: dmp_csrf }   # double-submit；所有非 GET 必帶
  api_token: { alg: RS256, ttl_s: 900, issuer: altatech-dmp, audience: dmp-api, signing_key_ref: kv/data/dmp/auth/api#rsa_private }   # 給 MCP／排程／CLI 的短效 token
  concurrent_sessions: 3
  bind_ip: false                               # 金融業常要求 true（換 IP 即失效）；預設關閉避免 NAT 誤殺

local_accounts:                                # 只給外包／廠商；強制 TOTP 與到期日；密碼 argon2id；不可取得 admin
  enabled: true
  allowed_roles: [custom_*]
  mfa: totp
  max_days: 90
  password_policy: { min_length: 14, lockout_after: 5, lockout_minutes: 15 }

audit_events: [auth.login.success, auth.login.failed, auth.login.no_role, auth.logout, auth.session.expired, auth.step_up, auth.token.issued, iam.role_mapping.applied]
