# 受眾推送目的地類型（docs/14）
types:
  webhook:
    cn: Webhook（內部系統）
    identifier: [customer_code, one_id]
    auth: { signature: hmac-sha256, header: X-DMP-Signature, timestamp_header: X-DMP-Timestamp, skew_seconds: 300, mtls: optional, ip_allowlist: optional }
    batch: { size: 5000, timeout_seconds: 10 }
    retry: { schedule_seconds: [60, 300, 900, 3600, 21600], dlq: true, pause_after_consecutive_failures: 3 }
    masking: { max_level: L2, numeric: bucket }
    events: [audience.delta, audience.full, audience.complete, tag.update, audience.test]
  kafka:
    cn: Kafka（內部即時）
    topics: { audiences: dmp.audience_updates, tags: dmp.tag_updates }
    format: avro
  gcs:
    cn: GCS Parquet（數倉／大量）
    prefix: gs://dmp-sync/audiences/
    manifest: true
  # 廣告平台（GA4 受眾／Google Ads 再行銷、Customer Match）不在本系統範圍：受眾推送只做名單推送到內部系統。
approval:
  create_destination: [ops_manager]
  new_destination_first_time: [ops_manager, auditor]     # 任何新目的地首次推送需稽核核可
  full_push: [ops_manager]
  delta_scheduled: none
audit_events: [sync.delivered, sync.failed, sync.replayed]
