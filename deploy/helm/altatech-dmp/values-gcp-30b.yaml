# GCP 正式環境：3 年 300 億事件、每日 1,000 標籤、50 人同時上線（docs/13）。與 values-gcp.yaml 疊加使用：
# helm upgrade --install dmp ./helm/altatech-dmp -f values.yaml -f values-gcp.yaml -f values-gcp-30b.yaml
kafka: { replicas: 3, connect: { replicas: 1, cpu: 1, memoryGi: 2 }, storageGi: 1000, partitions: { events: 24, tag_updates: 24 }, retentionDays: 7, nodeSelector: { pool: data }, resources: { cpu: 3, memoryGi: 12 } }
flink:
  jobmanagers: 1
  taskmanagers: 2
  slotsPerTm: 4
  memoryGi: 24
  nodeSelector: { pool: stream }
  checkpointDir: gs://dmp-checkpoints
clickhouse:
  shards: 2
  replicas: 2
  cpu: 20
  memoryGi: 160
  storage: { class: hyperdisk-balanced, sizeTi: 4, provisionedIops: 15000, provisionedThroughputMb: 1200 }
  keeper: { replicas: 3, nodeSelector: { pool: data }, cpu: 1, memoryGi: 4 }
  nodeSelector: { pool: olap }
  settings:
    max_concurrent_queries: 100
    workloads:
      human: { max_memory_usage: 12000000000, max_execution_time: 60, max_threads: 8 }
      agent: { max_memory_usage: 8000000000, max_execution_time: 40, max_threads: 6, max_bytes_to_read: 20000000000 }
      batch: { priority: 10, max_threads: 10 }
    query_cache: { enabled: true, ttlSeconds: 300 }
    tiers: { hotMonths: 13, cold: { type: gcs, bucket: dmp-cold-asia-east1 } }
spark: { enabled: true, onDemand: true, spot: true, executors: { max: 4, cpu: 4, memoryGi: 16 } }
apps:   # v0.6 整併後 6 個自建映像：ingest / core / agent / batch / flink-jobs / web（docs/13 §3.1）
  ingest:       { replicas: 2, cpu: 1, memoryGi: 1, hpa: { min: 2, max: 6, targetCpu: 60 }, nodeSelector: { pool: ingest } }   # Collector（Go）：/v1/events、/sa、/ga4；CDC 由 kafka.connect（Strimzi + Debezium）執行
  core:         # 模組化單體（Python）：API + 語意層 + 分群標籤 + OneID + Profile + Policy Engine + Tag Sync + 受眾推送；同一映像以 DMP_ROLE 分工
    api:        { replicas: 3, cpu: 2, memoryGi: 4, priorityClass: online, nodeSelector: { pool: app } }
    worker:     { replicas: 2, cpu: 3, memoryGi: 6, priorityClass: batch, nodeSelector: { pool: app }, kafkaBatch: 5000, topics: { tags: dmp.tag_updates, segments: dmp.segment_updates } }
  agent:        { replicas: 2, cpu: 2, memoryGi: 4, nodeSelector: { pool: app } }   # Tool Gateway（MCP）+ Agent Runtime + 洞察排程，同一映像
  batch:        { airflow: { executor: LocalExecutor, replicas: 1, cpu: 2, memoryGi: 6 }, dbt: { parallelism: 6, schedule: "0 2 * * *", versionsKept: 7 }, nodeSelector: { pool: app } }   # Airflow（scheduler+webserver 同 Pod）+ dbt + Spark client + dlt，同一映像
  web:          { replicas: 2, cpu: 0.5, memoryGi: 0.5, nodeSelector: { pool: app } }
platform: { keycloak: { replicas: 2 }, prometheus: { retentionDays: 30, storageGi: 150 }, grafana: { replicas: 1 }, nodeSelector: { pool: platform } }
postgres: { inCluster: false, external: { tier: db-custom-4-16384, ha: true, storageGi: 500 } }
valkey: { inCluster: false, external: { sizeGi: 16, tier: standard-ha } }
