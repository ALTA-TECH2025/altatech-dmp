# GCP 正式環境 D 檔：3 台大機型（c3-highmem-44 × 3 同構，44 vCPU / 352 GB）；3 年 200 億事件、每日 500 標籤、50 人同時上線（docs/13 §4.8）
# ClickHouse 2 副本固定在 node-1/2（node-3 預留第三副本或接手）；整併後映像：ingest / core / agent / batch / flink-jobs / web
# helm upgrade --install dmp ./helm/altatech-dmp -f values.yaml -f values-gcp.yaml -f values-gcp-3n-xl.yaml
kafka: { replicas: 3, connect: { replicas: 1, cpu: 1, memoryGi: 2 }, storageGi: 500, partitions: { events: 12, tag_updates: 12 }, retentionDays: 7, nodeSelector: { pool: all }, antiAffinity: required, resources: { cpu: 3, memoryGi: 12 } }
flink: { jobmanagers: 1, taskmanagers: 2, slotsPerTm: 6, memoryGi: 24, nodeSelector: { pool: all }, nodeHint: node-3, checkpointDir: gs://dmp-checkpoints }
clickhouse:
  shards: 1
  replicas: 2            # 選配：改 3，第三副本落在 node-3（+ Hyperdisk 4 TB ≈ US$ 475／月），讀取併發 +50%、任兩台故障仍可讀
  cpu: 24
  memoryGi: 220
  storage: { class: hyperdisk-balanced, sizeTi: 4, provisionedIops: 15000, provisionedThroughputMb: 1200 }
  keeper: { replicas: 3, nodeSelector: { pool: all }, antiAffinity: required, cpu: 1, memoryGi: 2 }
  nodeSelector: { pool: all }
  nodeAffinity: { requiredHosts: [node-1, node-2] }
  settings:
    max_concurrent_queries: 120
    workloads:
      human: { max_memory_usage: 16000000000, max_execution_time: 60, max_threads: 10 }
      agent: { max_memory_usage: 10000000000, max_execution_time: 40, max_threads: 8, max_bytes_to_read: 20000000000 }
      batch: { priority: 10, max_threads: 12 }
    query_cache: { enabled: true, ttlSeconds: 300 }
    tiers: { hotMonths: 36, cold: { type: gcs, bucket: dmp-cold-asia-east1, enabled: false } }   # 3 年全熱；第 4 年起啟用冷層
spark: { enabled: true, onDemand: true, spot: true, nodeSelector: { pool: spot }, executors: { max: 4, cpu: 4, memoryGi: 16 } }
apps:   # v0.6 整併後 6 個自建映像（docs/13 §3.1）；每台機器都能跑任何無狀態 Pod
  ingest:       { replicas: 2, cpu: 1, memoryGi: 1, hpa: { min: 2, max: 4, targetCpu: 60 }, nodeSelector: { pool: all } }
  core:
    api:        { replicas: 2, cpu: 3, memoryGi: 6, priorityClass: online, nodeSelector: { pool: all } }
    worker:     { replicas: 2, cpu: 4, memoryGi: 8, priorityClass: batch, nodeSelector: { pool: all }, nodeHint: node-3, kafkaBatch: 5000, topics: { tags: dmp.tag_updates, segments: dmp.segment_updates } }
  agent:        { replicas: 2, cpu: 2, memoryGi: 4, nodeSelector: { pool: all } }   # 第一階段不含 AI 時改 0，不影響機型
  batch:        { airflow: { executor: LocalExecutor, replicas: 1, cpu: 3, memoryGi: 8 }, dbt: { parallelism: 8, schedule: "0 2 * * *", versionsKept: 7, expectedTags: 500 }, nodeSelector: { pool: all }, nodeHint: node-3 }
  web:          { replicas: 2, cpu: 0.5, memoryGi: 0.5, nodeSelector: { pool: all } }
platform: { keycloak: { replicas: 2, antiAffinity: preferred }, prometheus: { retentionDays: 30, storageGi: 150 }, grafana: { replicas: 1 }, nodeSelector: { pool: all } }
priorityClasses: { online: 1000, batch: 100 }
resourceQuota: { all: { cpu: 120, memoryGi: 980 } }
scheduling: { batchNodeHint: node-3 }   # 日批、Flink、worker 偏好 node-3；查詢在 node-1/2
postgres: { inCluster: false, external: { tier: db-custom-2-8192, ha: true, storageGi: 200 } }
valkey: { inCluster: false, external: { sizeGi: 8, tier: standard-ha } }
