# GCP 正式環境 A′ 檔：第一階段不含 AI 洞察；常駐 5 台 = olap × 2 + general × 3（docs/13 §4.6）。第二階段改回 values-gcp-6n.yaml 即可。
# helm upgrade --install dmp ./helm/altatech-dmp -f values.yaml -f values-gcp.yaml -f values-gcp-5n-noai.yaml
kafka: { replicas: 3, connect: { replicas: 1, cpu: 1, memoryGi: 2 }, storageGi: 500, partitions: { events: 12, tag_updates: 12 }, retentionDays: 7, nodeSelector: { pool: general }, antiAffinity: required, resources: { cpu: 3, memoryGi: 12 } }
flink: { jobmanagers: 1, taskmanagers: 2, slotsPerTm: 4, memoryGi: 16, nodeSelector: { pool: general }, checkpointDir: gs://dmp-checkpoints }
clickhouse:
  shards: 1
  replicas: 2
  cpu: 20
  memoryGi: 160
  storage: { class: hyperdisk-balanced, sizeTi: 4, provisionedIops: 12000, provisionedThroughputMb: 800 }
  keeper: { replicas: 3, nodeSelector: { pool: general }, antiAffinity: required, cpu: 1, memoryGi: 2 }
  nodeSelector: { pool: olap }
  settings:
    max_concurrent_queries: 100
    workloads:
      human: { max_memory_usage: 12000000000, max_execution_time: 60, max_threads: 8 }
      agent: { max_memory_usage: 8000000000, max_execution_time: 40, max_threads: 6, max_bytes_to_read: 20000000000 }
      batch: { priority: 10, max_threads: 10 }
    query_cache: { enabled: true, ttlSeconds: 300 }
    tiers: { hotMonths: 36, cold: { type: gcs, bucket: dmp-cold-asia-east1, enabled: false } }   # 3 年全熱；第 4 年起啟用冷層
spark: { enabled: true, onDemand: true, spot: true, nodeSelector: { pool: spot }, executors: { max: 4, cpu: 4, memoryGi: 16 } }
apps:   # v0.6 整併後 6 個自建映像：ingest / core / agent / batch / flink-jobs / web（docs/13 §3.1）
  ingest:       { replicas: 2, cpu: 1, memoryGi: 1, hpa: { min: 2, max: 4, targetCpu: 60 }, nodeSelector: { pool: general } }   # Collector（Go）：/v1/events、/sa、/ga4；CDC 由 kafka.connect（Strimzi + Debezium）執行
  core:         # 模組化單體（Python）：API + 語意層 + 分群標籤 + OneID + Profile + Policy Engine + Tag Sync + 受眾推送；同一映像以 DMP_ROLE 分工
    api:        { replicas: 3, cpu: 2, memoryGi: 4, priorityClass: online, nodeSelector: { pool: general } }
    worker:     { replicas: 2, cpu: 3, memoryGi: 6, priorityClass: batch, nodeSelector: { pool: general }, kafkaBatch: 5000, topics: { tags: dmp.tag_updates, segments: dmp.segment_updates } }
  agent:        { replicas: 0, cpu: 2, memoryGi: 4, nodeSelector: { pool: general } }   # 第二階段啟用   # Tool Gateway（MCP）+ Agent Runtime + 洞察排程，同一映像
  batch:        { airflow: { executor: LocalExecutor, replicas: 1, cpu: 2, memoryGi: 6 }, dbt: { parallelism: 6, schedule: "0 2 * * *", versionsKept: 7 }, nodeSelector: { pool: general } }   # Airflow（scheduler+webserver 同 Pod）+ dbt + Spark client + dlt，同一映像
  web:          { replicas: 2, cpu: 0.5, memoryGi: 0.5, nodeSelector: { pool: general } }
platform: { keycloak: { replicas: 2, antiAffinity: preferred }, prometheus: { retentionDays: 30, storageGi: 150 }, grafana: { replicas: 1 }, nodeSelector: { pool: general } }
priorityClasses: { online: 1000, batch: 100 }    # 應用與 Collector 用 online；Airflow/dbt/Spark 用 batch
resourceQuota: { general: { cpu: 44, memoryGi: 170 } }
features: { aiInsight: false }   # UI 隱藏 AI 洞察與工具目錄；語意層與 Policy Engine 仍啟用
postgres: { inCluster: false, external: { tier: db-custom-2-8192, ha: true, storageGi: 200 } }
valkey: { inCluster: false, external: { sizeGi: 8, tier: standard-ha } }
