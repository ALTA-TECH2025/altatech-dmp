# VM-1：dmp-web、dmp-core API、ClickHouse 副本 1、Keeper 1、PostgreSQL 主、Redis 主＋Sentinel、SeaweedFS master/volume/filer(S3)、node-exporter、cAdvisor、Alloy（docs/44 §2）
# 啟動：cd deploy/compose && ./dmp.sh vm1 up    （先把 .env 填好、密鑰檔掛在 /run/secrets/dmp-secrets.json）
# 資料服務用 host 網路，三台之間直接以 VM*_HOST 互連；應用容器走 bridge 網路對外發佈埠。
name: dmp-vm1

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "100m", max-file: "5" } }
x-restart: &restart
  restart: unless-stopped

services:
  keeper:
    <<: [*logging, *restart]
    image: ${KEEPER_IMAGE}
    network_mode: host
    environment: { KEEPER_ID: "${KEEPER_ID}", VM1_HOST: "${VM1_HOST}", VM2_HOST: "${VM2_HOST}", VM3_HOST: "${VM3_HOST}" }
    volumes:
      - ../common/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ${DATA_ROOT}/keeper:/var/lib/clickhouse-keeper
    ulimits: { nofile: { soft: 262144, hard: 262144 } }

  seaweedfs-master:
    <<: [*logging, *restart]
    image: ${SEAWEEDFS_IMAGE}
    network_mode: host
    command: ["master", "-ip=${VM_HOST}", "-port=9333", "-peers=${VM1_HOST}:9333,${VM2_HOST}:9333,${VM3_HOST}:9333", "-mdir=/data/master", "-defaultReplication=001"]
    volumes: ["${DATA_ROOT}/seaweedfs:/data"]

  seaweedfs-volume:
    <<: [*logging, *restart]
    image: ${SEAWEEDFS_IMAGE}
    network_mode: host
    depends_on: [seaweedfs-master]
    command: ["volume", "-ip=${VM_HOST}", "-port=8380", "-mserver=${VM1_HOST}:9333,${VM2_HOST}:9333,${VM3_HOST}:9333", "-dir=/data/volume", "-max=0", "-dataCenter=sinopac", "-rack=${VM_HOST}"]
    volumes: ["${DATA_ROOT}/seaweedfs:/data"]

  seaweedfs-filer:
    <<: [*logging, *restart]
    image: ${SEAWEEDFS_IMAGE}
    network_mode: host
    depends_on: [seaweedfs-volume]
    command: ["filer", "-ip=${VM_HOST}", "-port=8888", "-master=${VM1_HOST}:9333,${VM2_HOST}:9333,${VM3_HOST}:9333", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ${DATA_ROOT}/seaweedfs:/data
      - ./rendered/s3.json:/etc/seaweedfs/s3.json:ro

  clickhouse:
    <<: [*logging, *restart]
    image: ${CLICKHOUSE_IMAGE}
    network_mode: host
    depends_on: [keeper]
    environment:
      VM_HOST: "${VM_HOST}"
      VM1_HOST: "${VM1_HOST}"
      VM2_HOST: "${VM2_HOST}"
      VM3_HOST: "${VM3_HOST}"
      CH_REPLICA: "${CH_REPLICA}"
      CH_USER: "${CH_USER}"
      CH_PASSWORD: "${CH_PASSWORD}"
      S3_BACKUP_ENDPOINT: "http://${VM1_HOST}:8333/dmp-backup/clickhouse/"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    volumes:
      - ../common/clickhouse/config.xml:/etc/clickhouse-server/config.d/dmp.xml:ro
      - ../common/clickhouse/users.xml:/etc/clickhouse-server/users.d/dmp.xml:ro
      - ../../../backend/clickhouse/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ${DATA_ROOT}/clickhouse:/var/lib/clickhouse
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    cap_add: [SYS_NICE, NET_ADMIN, IPC_LOCK]
    healthcheck: { test: ["CMD", "clickhouse-client", "--user", "${CH_USER}", "--password", "${CH_PASSWORD}", "-q", "SELECT 1"], interval: 30s, timeout: 5s, retries: 5, start_period: 60s }

  postgres:
    <<: [*logging, *restart]
    image: ${POSTGRES_IMAGE}
    network_mode: host
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: dmp
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PG_REPL_PASSWORD: "${PG_REPL_PASSWORD}"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ../common/postgres/primary.conf:/etc/postgresql/postgresql.conf:ro
      - ../common/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../common/postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ../../../backend/clickhouse/insight_store.sql:/docker-entrypoint-initdb.d/20-insight-store.sql:ro
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ${NAS_BACKUP}/postgres:/backup
    shm_size: 1g
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d dmp"], interval: 30s, timeout: 5s, retries: 5 }

  redis:
    <<: [*logging, *restart]
    image: ${REDIS_IMAGE}
    network_mode: host
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--masterauth", "${REDIS_PASSWORD}"]
    volumes:
      - ../common/redis/redis.conf:/etc/redis/redis.conf:ro
      - ${DATA_ROOT}/redis:/data
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 30s, timeout: 5s, retries: 5 }

  sentinel:
    <<: [*logging, *restart]
    image: ${REDIS_IMAGE}
    network_mode: host
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf.tmpl /data/sentinel.conf && sed -i \"s/__MASTER__/${VM1_HOST}/; s/__PASS__/${REDIS_PASSWORD}/\" /data/sentinel.conf && redis-sentinel /data/sentinel.conf"]
    volumes:
      - ../common/redis/sentinel.conf.tmpl:/etc/redis/sentinel.conf.tmpl:ro
      - ${DATA_ROOT}/sentinel:/data

  api:
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-core:${DMP_TAG}
    depends_on: { clickhouse: { condition: service_healthy }, postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DMP_ROLE: api
      DMP_PORT: "8080"
      DMP_TICK: "0"                      # 背景排程只在 VM2 的 worker 跑一份
      CLICKHOUSE_URL: "http://host.docker.internal:8123"
      CLICKHOUSE_USER: "${CH_USER}"
      CLICKHOUSE_PASSWORD: "${CH_PASSWORD}"
      DMP_PG_DSN: "postgresql://${PG_USER}:${PG_PASSWORD}@host.docker.internal:5432/dmp"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@host.docker.internal:6379/0"
      DMP_IDP_MODE: "${DMP_IDP_MODE}"
      DMP_OIDC_ISSUER: "http://${VM3_HOST}:8180/realms/dmp"
      DMP_PUBLIC_URL: "${DMP_PUBLIC_URL}"
      DMP_SECRETS_JSON: /run/secrets/dmp-secrets.json
      DMP_METRICS_TOKEN: "${DMP_METRICS_TOKEN}"
      DMP_WEB_DIST: ""                   # 前端由 web 容器提供，API 不同源出前端
    volumes: ["/run/secrets/dmp-secrets.json:/run/secrets/dmp-secrets.json:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    deploy: { resources: { limits: { cpus: "4", memory: 8g } } }

  web:
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-web:${DMP_TAG}
    depends_on: [api]
    ports: ["80:8080"]                   # F5／HAProxy 指到三台（VM1、VM2）的 80；TLS 在 LB 終結
    environment: { API_UPSTREAM: "http://api:8080" }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

  node-exporter:
    <<: [*logging, *restart]
    image: ${NODE_EXPORTER_IMAGE}
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes: ["/:/host:ro,rslave"]

  alloy:
    <<: [*logging, *restart]
    image: ${ALLOY_IMAGE}
    network_mode: host
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment: { VM_HOST: "${VM_HOST}", VM3_HOST: "${VM3_HOST}" }
    volumes:
      - ../common/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/alloy:/var/lib/alloy/data

  cadvisor:
    <<: [*logging, *restart]
    image: ${CADVISOR_IMAGE}
    network_mode: host
    command: ["--port=9101", "--docker_only=true", "--housekeeping_interval=30s"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
