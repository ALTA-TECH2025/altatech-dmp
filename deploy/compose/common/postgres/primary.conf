# PostgreSQL 主（VM1）：串流複寫 + WAL 歸檔到永豐 NAS（docs/07 §1.3）
listen_addresses = '*'
max_connections = 200
shared_buffers = 8GB
effective_cache_size = 24GB
wal_level = replica
max_wal_senders = 5
wal_keep_size = 4GB
hot_standby = on
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
log_destination = 'stderr'
log_min_duration_statement = 2000
password_encryption = scram-sha-256
