# Promtail：每台 VM 一個，收所有容器 stdout 送 VM3 的 Loki；標籤 = 主機、容器名
server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: "http://${VM3_HOST}:3100/loki/api/v1/push" }]
scrape_configs:
  - job_name: docker
    docker_sd_configs: [{ host: unix:///var/run/docker.sock, refresh_interval: 15s }]
    relabel_configs:
      - { source_labels: [__meta_docker_container_name], regex: "/(.*)", target_label: container }
      - { replacement: "${VM_HOST}", target_label: host }
