# VM-2（備援）：dmp-web／API 備援（平時不接流量、不跑背景作業；worker、batch 只在接管時以 takeover profile 啟動）、ClickHouse 副本 2、Keeper 2、PostgreSQL 備援、Redis 從＋Sentinel、SeaweedFS master/volume、node-exporter、cAdvisor、Alloy（docs/44 §2）
# 啟動：cd deploy/compose && ./dmp.sh vm2 up    （.env 的 VM_HOST=VM2、KEEPER_ID=2、CH_REPLICA=r2）
name: dmp-vm2

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "100m", max-file: "5" } }
x-restart: &restart
  restart: unless-stopped

services:
  keeper:
    <<: [*logging, *restart]
    image: ${KEEPER_IMAGE}
    network_mode: host
    environment: { KEEPER_ID: "${KEEPER_ID}", VM1_HOST: "${VM1_HOST}", VM2_HOST: "${VM2_HOST}", VM3_HOST: "${VM3_HOST}" }
    volumes:
      - ../common/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ${DATA_ROOT}/keeper:/var/lib/clickhouse-keeper
    ulimits: { nofile: { soft: 262144, hard: 262144 } }

  clickhouse:
    <<: [*logging, *restart]
    image: ${CLICKHOUSE_IMAGE}
    network_mode: host
    depends_on: [keeper]
    environment:
      VM_HOST: "${VM_HOST}"
      VM1_HOST: "${VM1_HOST}"
      VM2_HOST: "${VM2_HOST}"
      VM3_HOST: "${VM3_HOST}"
      CH_REPLICA: "${CH_REPLICA}"
      CH_USER: "${CH_USER}"
      CH_PASSWORD: "${CH_PASSWORD}"
      S3_BACKUP_ENDPOINT: "http://${VM1_HOST}:8333/dmp-backup/clickhouse/"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    volumes:
      - ../common/clickhouse/config.xml:/etc/clickhouse-server/config.d/dmp.xml:ro
      - ../common/clickhouse/users.xml:/etc/clickhouse-server/users.d/dmp.xml:ro
      - ../../../backend/clickhouse/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ${DATA_ROOT}/clickhouse:/var/lib/clickhouse
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    cap_add: [SYS_NICE, NET_ADMIN, IPC_LOCK]
    healthcheck: { test: ["CMD", "clickhouse-client", "--user", "${CH_USER}", "--password", "${CH_PASSWORD}", "-q", "SELECT 1"], interval: 30s, timeout: 5s, retries: 5, start_period: 60s }

  postgres:                              # 從庫可自動重啟；promote 成主庫後若要長期當主，比照 VM1 改 restart: "no"
    <<: [*logging, *restart]
    image: ${POSTGRES_IMAGE}
    network_mode: host
    entrypoint: ["/init-replica.sh"]
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      PRIMARY_HOST: "${VM1_HOST}"
      PG_REPL_PASSWORD: "${PG_REPL_PASSWORD}"
    volumes:
      - ../common/postgres/init-replica.sh:/init-replica.sh:ro
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    shm_size: 1g
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"], interval: 30s, timeout: 5s, retries: 5, start_period: 120s }

  redis:
    <<: [*logging, *restart]
    image: ${REDIS_IMAGE}
    network_mode: host
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--masterauth", "${REDIS_PASSWORD}", "--replicaof", "${VM1_HOST}", "6379"]
    volumes:
      - ../common/redis/redis.conf:/etc/redis/redis.conf:ro
      - ${DATA_ROOT}/redis:/data

  sentinel:
    <<: [*logging, *restart]
    image: ${REDIS_IMAGE}
    network_mode: host
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf.tmpl /data/sentinel.conf && sed -i \"s/__MASTER__/${VM1_HOST}/; s/__PASS__/${REDIS_PASSWORD}/\" /data/sentinel.conf && redis-sentinel /data/sentinel.conf"]
    volumes:
      - ../common/redis/sentinel.conf.tmpl:/etc/redis/sentinel.conf.tmpl:ro
      - ${DATA_ROOT}/sentinel:/data

  seaweedfs-master:
    <<: [*logging, *restart]
    image: ${SEAWEEDFS_IMAGE}
    network_mode: host
    command: ["master", "-ip=${VM_HOST}", "-port=9333", "-peers=${VM1_HOST}:9333,${VM2_HOST}:9333,${VM3_HOST}:9333", "-mdir=/data/master", "-defaultReplication=001"]
    volumes: ["${DATA_ROOT}/seaweedfs:/data"]

  seaweedfs-volume:
    <<: [*logging, *restart]
    image: ${SEAWEEDFS_IMAGE}
    network_mode: host
    depends_on: [seaweedfs-master]
    command: ["volume", "-ip=${VM_HOST}", "-port=8380", "-mserver=${VM1_HOST}:9333,${VM2_HOST}:9333,${VM3_HOST}:9333", "-dir=/data/volume", "-max=0", "-dataCenter=sinopac", "-rack=${VM_HOST}"]
    volumes: ["${DATA_ROOT}/seaweedfs:/data"]

  worker:                                # 接管才起：COMPOSE_PROFILES=takeover ./dmp.sh vm2 up worker batch（docs/44 §5.1；起之前先確認 VM1 的 worker 已停）
    profiles: [takeover]
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-core:${DMP_TAG}
    group_add: ["${DMP_SECRETS_GID}"]   # 讀密鑰檔用（主機上檔案 root:DMP_SECRETS_GID 0440；映像 UID 不同也讀得到，其他人讀不到）
    depends_on: { clickhouse: { condition: service_healthy }, redis: { condition: service_started } }
    extra_hosts: ["host.docker.internal:host-gateway", "pg-primary:${PG_PRIMARY_HOST}"]
    environment:
      DMP_ROLE: worker
      DMP_SCHED_DB: /app-data/sched.db   # VM1 每 15 分鐘同步過來的那份
      DMP_EXPORT_DIR: /app-data/exports
      CLICKHOUSE_URL: "http://host.docker.internal:8123"
      CLICKHOUSE_USER: "${CH_USER}"
      CLICKHOUSE_PASSWORD: "${CH_PASSWORD}"
      DMP_PG_DSN: "postgresql://${PG_USER}:${PG_PASSWORD}@pg-primary:5432/dmp"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${VM1_HOST}:6379/0"
      DMP_SECRETS_JSON: /run/secrets/dmp-secrets.json
      S3_ENDPOINT: "http://${VM1_HOST}:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    volumes:
      - /run/secrets/dmp-secrets.json:/run/secrets/dmp-secrets.json:ro
      - ${APP_DATA}:/app-data
      - ${DATA_ROOT}/landing:/landing          # 接管後由永豐 IT 把 SFTP 落檔改指 VM2
    read_only: true
    tmpfs: ["/tmp"]
    deploy: { resources: { limits: { cpus: "6", memory: 12g } } }

  batch:
    profiles: [takeover]
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-batch:${DMP_TAG}
    group_add: ["${DMP_SECRETS_GID}"]   # 讀密鑰檔用（主機上檔案 root:DMP_SECRETS_GID 0440；映像 UID 不同也讀得到，其他人讀不到）
    depends_on: [worker]
    command: standalone
    extra_hosts: ["host.docker.internal:host-gateway", "pg-primary:${PG_PRIMARY_HOST}"]
    ports: ["8082:8080"]                 # Airflow UI，只開給內網維運
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@pg-primary:5432/dmp"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      CLICKHOUSE_URL: "http://host.docker.internal:8123"
      CLICKHOUSE_USER: "${CH_USER}"
      CLICKHOUSE_PASSWORD: "${CH_PASSWORD}"
      DMP_SECRETS_JSON: /run/secrets/dmp-secrets.json
    volumes:
      - /run/secrets/dmp-secrets.json:/run/secrets/dmp-secrets.json:ro
      - ${DATA_ROOT}/landing:/landing:ro
      - ${DATA_ROOT}/airflow-logs:/opt/airflow/logs
    deploy: { resources: { limits: { cpus: "4", memory: 8g } } }

  api:
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-core:${DMP_TAG}
    group_add: ["${DMP_SECRETS_GID}"]   # 讀密鑰檔用（主機上檔案 root:DMP_SECRETS_GID 0440；映像 UID 不同也讀得到，其他人讀不到）
    depends_on: { clickhouse: { condition: service_healthy } }
    ports: ["8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway", "pg-primary:${PG_PRIMARY_HOST}"]
    environment:
      DMP_ROLE: api                      # 備援：F5 平常不送這台；登入狀態在 PostgreSQL（#72），切過來使用者不必重登
      DMP_PORT: "8080"
      DMP_TICK: "0"
      DMP_SCHED_DB: /app-data/sched.db
      DMP_EXPORT_DIR: /app-data/exports
      CLICKHOUSE_URL: "http://host.docker.internal:8123"
      CLICKHOUSE_USER: "${CH_USER}"
      CLICKHOUSE_PASSWORD: "${CH_PASSWORD}"
      DMP_PG_DSN: "postgresql://${PG_USER}:${PG_PASSWORD}@pg-primary:5432/dmp"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${VM1_HOST}:6379/0"
      DMP_IDP_MODE: "${DMP_IDP_MODE}"
      DMP_OIDC_ISSUER: "${DMP_PUBLIC_URL}/auth/realms/dmp"   # Keycloak 以 --hostname=<對外網址>/auth 啟動，token 的 iss 就是這個（程式讀取見 #80）
      DMP_PUBLIC_URL: "${DMP_PUBLIC_URL}"
      DMP_BASE_URL: "${DMP_PUBLIC_URL}"  # 看板分享連結前綴
      DMP_SECRETS_JSON: /run/secrets/dmp-secrets.json
      DMP_METRICS_TOKEN: "${DMP_METRICS_TOKEN}"
      DMP_WEB_DIST: ""
    volumes:
      - /run/secrets/dmp-secrets.json:/run/secrets/dmp-secrets.json:ro
      - ${APP_DATA}:/app-data
    read_only: true
    tmpfs: ["/tmp"]
    deploy: { resources: { limits: { cpus: "4", memory: 8g } } }

  web:
    <<: [*logging, *restart]
    image: ${REGISTRY}/dmp-web:${DMP_TAG}
    depends_on: [api]
    ports: ["80:8080"]                   # F5 的 backup 成員：VM1 健康檢查失敗才送這裡
    environment: { API_UPSTREAM: "http://api:8080" }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

  node-exporter:
    <<: [*logging, *restart]
    image: ${NODE_EXPORTER_IMAGE}
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes: ["/:/host:ro,rslave"]

  alloy:
    <<: [*logging, *restart]
    image: ${ALLOY_IMAGE}
    network_mode: host
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment: { VM_HOST: "${VM_HOST}", VM3_HOST: "${VM3_HOST}" }
    volumes:
      - ../common/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/alloy:/var/lib/alloy/data

  cadvisor:
    <<: [*logging, *restart]
    image: ${CADVISOR_IMAGE}
    network_mode: host
    command: ["--port=9101", "--docker_only=true", "--housekeeping_interval=30s"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
