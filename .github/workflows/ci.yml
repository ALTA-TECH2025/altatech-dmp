name: ci
on:
  workflow_dispatch:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: "${{ steps.f.outputs.backend }}"
      web: "${{ steps.f.outputs.web }}"
      deploy: "${{ steps.f.outputs.deploy }}"
      contract: "${{ steps.f.outputs.contract }}"
      streaming: "${{ steps.f.outputs.streaming }}"
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/**']
            web: ['prototype/**', 'web/**']
            deploy: ['deploy/**', '.github/**']
            streaming: ['backend/streaming/**', 'backend/integration/modeling.py', 'backend/integration/transforms.py', 'backend/integration/models.example.yaml', 'backend/semantic/user_properties.yaml']   # 批流一致性會用到的規則
            contract: ['backend/openapi.yaml', 'backend/api/errors.yaml', 'backend/semantic/*.yaml', 'backend/mcp/tools.yaml', 'backend/security/*.yaml']   # 契約 = 語意層 yaml（CLAUDE.md）；compiler/ 的程式不是契約
  contract:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml openapi-spec-validator
      - name: YAML 與 OpenAPI 驗證
        run: |
          python3 -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('backend/**/*.yaml',recursive=True)+glob.glob('deploy/**/*.yaml',recursive=True) if '/templates/' not in f]"
          python3 -m openapi_spec_validator backend/openapi.yaml
      - name: 草案更新只收白名單欄位（負例）
        # 技能庫／Agent 設定草案不能改工具、模型可見範圍、自動化界線（docs/39 D3／D4）；契約要能機器驗證地擋下
        run: |
          python3 - <<'PY'
          import yaml, jsonschema
          S = yaml.safe_load(open("backend/openapi.yaml", encoding="utf-8"))["components"]["schemas"]
          bad = {"tools": ["profile.get"], "model_view": {"identifiers": "all"}, "automation": "publish"}
          cases = [("SkillDraftUpdate", {"purpose": "p", "notes_md": "n"}, [bad, {"purpose": "p", "tools": ["x"]}]),
                   ("AgentConfigDraftUpdate", {"skills": [{"name": "explore-data", "version": "1.0.0"}], "notes_md": "n"},
                    [bad, {"skills": [{"name": "explore-data", "version": "latest"}]}, {"skills": [{"name": "a", "version": "1", "tools": ["x"]}]}, {"user_overridable": [{"skill": "a", "param": "k", "status": "confirmed"}]}]),
                   ("AgentRunCreate", {"entry": "analyze", "question": "上週開戶漏斗", "agent": "s1", "params": {"period": "last_week"}},      # C3：專案與身分不可由請求指定
                    [{"entry": "analyze", "question": "q", "project": "other"}, {"entry": "analyze", "question": "q", "user_id": "u", "roles": ["admin"]}]),
                   ("SourceFreshnessUpdate", {"mode": "daily_batch", "ready_at": "07:00", "covers_days_back": 1},      # 來源新鮮度：模式與欄位必須成對、時區固定台北不可帶
                    [{"mode": "realtime"}, {"mode": "realtime", "max_lag_minutes": 15, "ready_at": "07:00"}, {"mode": "daily_batch", "ready_at": "07:00"},
                     {"mode": "daily_batch", "ready_at": "07:00", "covers_days_back": 1, "max_lag_minutes": 15}, {"mode": "daily_batch", "ready_at": "24:00", "covers_days_back": 1},
                     {"mode": "daily_batch", "ready_at": "7:00", "covers_days_back": 1}, {"mode": "realtime", "max_lag_minutes": 15, "timezone": "UTC"}, {"mode": "realtime", "max_lag_minutes": 0}, {"mode": "hourly"}])]
          for name, ok, rejects in cases:
              v = jsonschema.Draft202012Validator(S[name]); v.validate(ok)
              for r in rejects:
                  assert not v.is_valid(r), (name, r)
              print(name, "ok: 正例通過、", len(rejects), "個負例被拒")
          PY
      - name: 錯誤碼目錄與 OpenAPI／工具錯誤碼一致
        # docs/46：REST 與 AI 工具共用 backend/api/errors.yaml；三處不一致時擋下
        run: |
          python3 - <<'PY'
          import re, yaml, jsonschema
          cat = yaml.safe_load(open("backend/api/errors.yaml", encoding="utf-8"))
          api = yaml.safe_load(open("backend/openapi.yaml", encoding="utf-8"))
          tools = yaml.safe_load(open("backend/mcp/tools.yaml", encoding="utf-8"))
          codes, seen = cat["codes"], set()
          for c in codes:
              k = c["code"]; assert re.fullmatch(r"[A-Z][A-Z0-9_]+", k), k
              assert k not in seen, f"重複代碼 {k}"; seen.add(k)
              assert 400 <= c["http"] <= 599 and c["category"] in cat["categories"], k
              assert isinstance(c["retryable"], bool) and c["scope"] and set(c["scope"]) <= {"api", "tool"}, k
              assert c["message"].strip() and c["hint"].strip() and c["log"] in {"info", "warn", "error"}, k
          api_codes = [c["code"] for c in codes if "api" in c["scope"]]
          S = api["components"]["schemas"]
          assert S["Error"]["properties"]["code"]["enum"] == api_codes, "openapi Error.code enum 要和 errors.yaml（scope 含 api）一致"
          tool_cat = {c["code"]: c["retryable"] for c in codes if "tool" in c["scope"]}
          tool_yaml = {e["code"]: e["retryable"] for e in tools["errors"]}
          assert tool_yaml == tool_cat, f"tools.yaml errors 與 errors.yaml（scope 含 tool）不一致：{tool_yaml} vs {tool_cat}"
          assert set(S["ToolError"]["properties"]["code"]["enum"]) == set(tool_cat), "openapi ToolError.code enum 要和 tool 代碼一致"
          for k in cat["mapping"].values():
              assert k in seen, f"mapping 指向不存在的代碼 {k}"
          v = jsonschema.Draft202012Validator(S["Error"])
          ok = {"detail": "你沒有執行這個操作的權限", "code": "AUTHZ_DENIED", "retryable": False, "request_id": "req-01HZX3", "params": {"permission": "events.export"}}
          v.validate(ok)
          for bad in [{**ok, "code": "NOPE"}, {k: ok[k] for k in ok if k != "request_id"}, {**ok, "sql": "SELECT 1"}, {**ok, "request_id": "a b"}]:
              assert not v.is_valid(bad), bad
          # 每個 operation 都要以 4XX／5XX 引用共用 Error；另列的 4xx／5xx 也要引用 Error；1xx–3xx（例 SSO 302）不得套用 Error
          ERR, http_of, ops = {"$ref": "#/components/responses/Error"}, {c["code"]: c["http"] for c in codes if "api" in c["scope"]}, 0
          assert api["components"]["responses"]["Error"]["content"]["application/json"]["schema"] == {"$ref": "#/components/schemas/Error"}
          for path, item in api["paths"].items():
              for m, op in item.items():
                  if m not in {"get", "put", "post", "delete", "patch", "options", "head", "trace"}:
                      continue
                  ops += 1; r, where = op["responses"], f"{m.upper()} {path}"
                  assert r.get("4XX") == ERR and r.get("5XX") == ERR, f"{where} 缺 4XX／5XX → components/responses/Error"
                  for st, v in r.items():
                      st = str(st)
                      if st[0] in "45":
                          assert v.get("$ref") == ERR["$ref"], f"{where} {st} 要引用 components/responses/Error"
                          k = re.match(r"[A-Z][A-Z0-9_]{2,}", str(v.get("description", "")))
                          if k and k.group(0) in seen:
                              assert http_of.get(k.group(0)) == int(st), f"{where} {st} 寫 {k.group(0)}，但目錄的 HTTP 狀態是 {http_of.get(k.group(0))}"
                      else:
                          assert v.get("$ref") != ERR["$ref"], f"{where} {st} 不是錯誤，不可套用 Error"
          print(f"errors.yaml ok：{len(codes)} 個代碼（API {len(api_codes)}、工具 {len(tool_cat)}），Error 結構正例通過、4 個負例被拒；{ops} 個 operation 都接上 4XX／5XX Error")
          PY
      - name: 契約變更需要 contract 標籤
        # 讀 PR 目前的標籤而不是事件快照：開 PR 後才補標籤，重跑這個 job 就能過，不必再推一個 commit
        if: needs.changes.outputs.contract == 'true' && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          echo "PR 標籤：${labels:-（無）}"
          echo "$labels" | grep -qx contract || { echo "::error::改了契約檔但 PR 沒有 contract 標籤；請拆成獨立的 contract PR（或補上標籤後重跑）"; exit 1; }
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:                                # 控制面 PostgreSQL 儲存自測（官方映像，PostgreSQL 授權；LICENSES.md）
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: dmp }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DMP_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/dmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt ruff==0.16.8 pytest   # ruff 版本鎖定，規則在 ruff.toml
      - run: ruff check backend
      - name: 骨架自測
        run: |
          python3 backend/security/policy.py && python3 backend/integration/transforms.py && python3 backend/integration/auth.py && python3 backend/insight_agent/runtime.py && python3 -m backend.insight_agent.model && python3 -m backend.insight_agent.skill_loader && python3 backend/oneid/attribution.py && python3 -m backend.auth && python3 -m backend.auth.local selftest && python3 -m backend.api && python3 -m backend.segments && python3 -m backend.api.store_pg && python3 -m backend.insight_agent.journal && python3 -m backend.ops.lease
          python3 -m backend.integration.modeling && python3 -m backend.integration.scheduler && python3 -m backend.integration.legacy_format && python3 -m backend.integration.ga4_source && python3 -m backend.integration.legacy_api && python3 -m backend.integration.freshness && python3 -m backend.semantic.compiler.golden && python3 -m backend.integration.e2e_clickhouse && python3 -m backend.streaming.parity
          python3 backend/migration/bridge.py --check && python3 backend/migration/properties.py --check && python3 backend/migration/legacy_specific.py --check && python3 backend/migration/presets.py && python3 -m backend.migration.validate selftest
      - name: Tool Gateway 自測
        run: python3 -m backend.mcp.server && python3 -m backend.insight_agent.runs
      - name: 容器入口（backend.entry）自測與啟動前檢查
        env: { DMP_EXPORT_DIR: '${{ runner.temp }}/dmp-exports' }    # 控制面是 PostgreSQL（同正式部署）時必填，否則啟動失敗（#87）
        run: python3 -m backend.entry --selftest && python3 -m backend.entry --check && DMP_ROLE=worker python3 -m backend.entry --check
      - name: pytest（若有 tests/）
        run: |
          if [ -d tests ]; then pytest -q tests; else echo "no tests dir yet"; fi    # 有 tests/ 就跑並把退出碼帶出來；不能用 && … || echo（會把失敗吞掉）
      - name: 守門：工作流裡不准再出現「test … && 測試 || echo」把失敗吞掉的寫法
        run: |
          if grep -nE 'test -[fd] [^&]+ && [^|]+ \|\| echo' .github/workflows/*.yml; then echo "::error::上面的步驟會把測試失敗當成略過（R13）"; exit 1; fi
  flink-parity:   # Flink 第一階段不交付、程式保留（docs/45 D-04）：只在相關規則變動、合併進 main 或手動時跑，不擋無關 PR
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.streaming == 'true' || (github.event_name == 'push' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/streaming/requirements-flink.txt }
      - name: 安裝 PyFlink（完整釘選、不解相依；刻意覆蓋的兩項見檔頭）
        run: pip install --no-deps -r backend/streaming/requirements-flink.txt
      - name: 批流一致性（docs/43 §3.6）：批次 apply() 與 Flink Table UDF（process／thread）、DataStream 逐列相同
        run: python3 -m backend.streaming.parity --require-flink
  e2e-clickhouse:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env: { CH_VERSION: 25.8.33.6 }   # LTS；版本鎖定，升版要同步 docs/11 與 deploy/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - uses: actions/cache@v4
        id: ch
        with: { path: ~/clickhouse, key: "clickhouse-${{ env.CH_VERSION }}-amd64" }
      - name: 下載 ClickHouse 單一執行檔（官方 tgz，固定版本）
        if: steps.ch.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clickhouse && cd ~/clickhouse
          curl -sSL "https://packages.clickhouse.com/tgz/lts/clickhouse-common-static-${CH_VERSION}-amd64.tgz" | tar xz --strip-components=3 "clickhouse-common-static-${CH_VERSION}/usr/bin/clickhouse"
          ./clickhouse --version
      - name: 端到端（接入 → ClickHouse → 對帳 → 用戶表 → 查詢編譯器黃金測試）
        env:
          CLICKHOUSE_BIN: /home/runner/clickhouse/clickhouse
          E2E_USERS: '50000'
          E2E_EVENTS: '300000'
          E2E_SENSORS_LINES: '50000'
          E2E_GA4_PER_TICK: '5000'
        run: python3 -m backend.integration.e2e_clickhouse
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check prototype/js/app.js && node --check prototype/js/data.js
      - name: 正式前端：型別、單元測試、建置
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build
      - name: Playwright 煙霧測試（桌機 1440 + 手機 390，無 console error、無橫向溢出）
        run: |
          npx --yes playwright@1.48.2 install --with-deps chromium
          (cd prototype && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 1
          if [ -f tests/e2e/smoke.mjs ]; then node tests/e2e/smoke.mjs; else echo "tests/e2e/smoke.mjs 尚未加入（QA 工作流 S1）"; fi
  e2e-browser:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CH_VERSION: 25.8.33.6
      DMP_WORK: /home/runner/dmp-local
      DMP_LOCAL_ACCOUNTS: /home/runner/dmp-local/accounts.json
      DMP_SEED_PASSWORD: 'Ci-Seed-Pass-2026-xyz!'          # CI 用的本機帳號初始密碼（只在 runner 內，不是密鑰）
      DMP_COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        id: ch
        with: { path: /home/runner/dmp-local/clickhouse, key: "clickhouse-${{ env.CH_VERSION }}-amd64" }
      - name: 下載 ClickHouse 單一執行檔（與 e2e-clickhouse 同版本）
        if: steps.ch.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DMP_WORK" && cd "$DMP_WORK"
          curl -sSL "https://packages.clickhouse.com/tgz/lts/clickhouse-common-static-${CH_VERSION}-amd64.tgz" | tar xz --strip-components=3 "clickhouse-common-static-${CH_VERSION}/usr/bin/clickhouse"
      - name: 前端建置與瀏覽器
        working-directory: web
        run: |
          npm ci --no-audit --no-fund && npm run build
          npx playwright install --with-deps chromium
      - name: 起本機堆疊（ClickHouse → schema → API）＋ seed ＋ 示範資料 ＋ Webhook 接收端
        run: |
          mkdir -p "$DMP_WORK"
          echo '{"kv/data/dmp/prod/crm#webhook_secret": "crm-local-secret", "kv/data/dmp/prod/ma#webhook_secret": "ma-local-secret"}' > "$DMP_WORK/secrets.json"
          bash deploy/quickstart/run_local.sh up
          bash deploy/quickstart/run_local.sh seed --no-migration < /dev/null
          nohup python3 -m backend.tools.webhook_receiver 9099 crm-local-secret > "$DMP_WORK/receiver.out" 2>&1 &
          sleep 1
          DMP_API=http://127.0.0.1:8000 DMP_DEMO_WORK="$DMP_WORK/demo" python3 -m backend.tools.demo_fill
          curl -sf http://127.0.0.1:8000/healthz
      - name: Playwright 主線（登入 → 事件分析 → 書籤 → 看板 → 推送 → 交付）
        working-directory: web
        env: { E2E_BASE: 'http://127.0.0.1:8000', E2E_ACCOUNTS: /home/runner/dmp-local/accounts.json, E2E_PASSWORD: 'Ci-Seed-Pass-2026-xyz!', CI: 'true' }
        run: npx playwright test
      - name: 失敗時留下報告與 API／接收端日誌
        if: failure()
        run: |
          mkdir -p web/playwright-report && cp "$DMP_WORK"/api.out "$DMP_WORK"/receiver.out web/playwright-report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint（每個 values 檔）
        run: for f in deploy/helm/altatech-dmp/values*.yaml; do helm lint deploy/helm/altatech-dmp -f "$f" || exit 1; done
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with: { recursive: true, dockerfile: deploy/images/Dockerfile.core }
