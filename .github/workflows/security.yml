name: security-and-license
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks 掃 push 的整段 commit 範圍，淺層 checkout 會找不到起點 commit
      - name: Secrets scan (gitleaks CLI；gitleaks-action v2 對組織帳號要求付費授權，改用 MIT 的 CLI，固定版本)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz -C "$RUNNER_TEMP" gitleaks   # 解到 workspace 外，免得 SBOM 把掃描器本身的 Go 模組算進去
          "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact --exit-code 1
      - name: SAST (Semgrep OSS)
        uses: semgrep/semgrep-action@v1
        with: { config: "p/default" }
      - name: Python deps audit
        run: pipx run pip-audit -r backend/requirements.txt || true
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: sbom.spdx.json }
      - name: Vulnerability scan (Grype on SBOM)
        uses: anchore/scan-action@v7.4.2      # v4 綁的 grype 0.80 只讀舊版弱點資料庫（已停止更新，CI 一直紅）
        with: { sbom: sbom.spdx.json, fail-build: true, severity-cutoff: high, only-fixed: true }
      - name: License allowlist
        run: python3 backend/tools/license_check.py sbom.spdx.json
      - name: Config validation
        run: |
          python3 -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('backend/**/*.yaml',recursive=True)+glob.glob('deploy/**/*.yaml',recursive=True) if '/templates/' not in f]"
          python3 backend/security/policy.py && python3 backend/integration/transforms.py
          node --check prototype/js/app.js && node --check prototype/js/data.js
  image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build core image
        id: build
        continue-on-error: true               # 骨架階段映像可能還建不起來；建不起來就跳過掃描，不當成失敗
        run: docker build -f deploy/images/Dockerfile.core -t dmp-core:ci .
      - name: 容器啟動煙霧測試（api 與 worker 都要起得來、/healthz 回 ok）
        if: steps.build.outcome == 'success'
        run: |
          set -e
          docker run --rm dmp-core:ci --check
          docker run --rm -e DMP_ROLE=worker dmp-core:ci --check
          for role in api worker; do
            docker run -d --name core-$role -e DMP_ROLE=$role -e DMP_COOKIE_SECURE=0 dmp-core:ci
            ok=0; for i in $(seq 1 30); do if docker exec core-$role python3.12 -m backend.entry healthcheck; then ok=1; break; fi; sleep 2; done
            if [ "$ok" != 1 ]; then echo "::error::$role 容器 60 秒內 /healthz 未回 ok"; docker logs core-$role; exit 1; fi
            docker rm -f core-$role >/dev/null
          done
      - name: Trivy image scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0  # 0.28.0 標籤已不存在
        with: { image-ref: dmp-core:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: Trivy config scan (Dockerfile／Helm 設定)
        if: steps.build.outcome != 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: config, scan-ref: deploy, severity: "CRITICAL,HIGH", exit-code: "0" }
